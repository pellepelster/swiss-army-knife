# the texts of the sign-in (AuthTexts), english: the source of every language and its fallback
invalid_email: "No valid e-mail address."
mail_subject: "Sign in to %{app}"
mail_body: |
  Hello,

  use the following link to sign in to %{app}:

  %{link}

  The link is valid for %{minutes} minutes and can only be used once. If you did not
  request it, you can ignore this e-mail.
