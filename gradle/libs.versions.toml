[versions]
angus-mail = "2.0.5"
awssdk = "2.57.3"
bouncycastle = "1.86"
caffeine = "3.3.1"
dnsjava = "3.6.3"
greenmail = "2.1.15"
jackson = "3.2.4"
jooq = "3.21.9"
junit = "5.13.4"
kotest = "6.2.6"
kotlin = "2.4.21"
kotlin-logging = "8.0.4"
kotlinx-serialization = "1.11.0"
ktor = "3.6.0"
liquibase = "5.0.4"
logback = "1.6.5"
playwright = "1.64.0"
sqlite-jdbc = "3.53.4.0"

[libraries]
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
awssdk-apache-client = { module = "software.amazon.awssdk:apache-client" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
dnsjava = { module = "dnsjava:dnsjava", version.ref = "dnsjava" }
greenmail-junit5 = { module = "com.icegreen:greenmail-junit5", version.ref = "greenmail" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-dataformat-xml = { module = "tools.jackson.dataformat:jackson-dataformat-xml" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-meta-extensions-liquibase = { module = "org.jooq:jooq-meta-extensions-liquibase", version.ref = "jooq" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt" }
ktor-server-body-limit = { module = "io.ktor:ktor-server-body-limit" }
ktor-server-config-yaml = { module = "io.ktor:ktor-server-config-yaml" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation" }
ktor-server-core = { module = "io.ktor:ktor-server-core" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty" }
ktor-server-routing-openapi = { module = "io.ktor:ktor-server-routing-openapi" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
