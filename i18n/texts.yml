# every text a user reads, in every language: the source of the texts of the backend, the web
# apps, the android app and sakctl. `mise run i18n:generate` writes them into the files each of them
# reads (sak-i18n), the generated files are committed and a test fails when they are not up to date.
#
# A section is either for every app, or the one of an app with its texts by platform:
#   common, backend, web, android    texts of no app: for backend, web and android, or for one
#   <app>.common                     texts of the app on every platform it has a part for
#   <app>.backend, .web, .android    texts of the app on one platform
#   ctl.common, ctl.cli, ctl.ui      sakctl, a program of its own: both, the command line, the
#                                    window; it reads all three, as common.*, cli.* and ui.*
# A platform reads common and its own part merged, the platform drops out of the key: notes.backend
# .too_many_photos is notes.too_many_photos in the backend, its error code. A key is in one part only.
#
# A text has every language, `{ en: "…", de: "…" }`, with the same %{name} placeholders; a text
# that is the same in every language, a name, is a plain string. A plural (android only) has the
# forms of the language, `en: { one: "%{count} item", other: "%{count} items" }`. German uses "du"
# in sakctl and no form of address elsewhere, the words are the ones of the glossary.

