[package]
name = "sak-cloud"
version = "0.1.0"
description = "Declares cloud resources in code and reconciles them against the running state"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
async-trait = "0.1.89"
base64 = "0.23"
hex = "0.4.3"
md-5 = "0.10"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1", features = ["time"] }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"
