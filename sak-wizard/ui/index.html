<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SwissArmyKnife</title>
    <!-- the theme comes from ../../sak-theme, copied to theme/ by mise run wizard:theme -->
    <link rel="stylesheet" href="theme/fonts.css">
    <link rel="stylesheet" href="theme/tokens.css">
    <link rel="stylesheet" href="theme/components.css">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <!-- one view at a time, app.js switches between them; data-text names the text of locales/.
         Buttons moving through the wizard (next, back, cancel, plan, create) sit at the bottom
         right, buttons acting on the data of the view (add a provider, create a deployment)
         at the top right -->
    <main class="view splash" id="view-splash">
      <img class="splash-icon" src="icon.svg" alt="">
      <h1 class="splash-title">SwissArmyKnife</h1>
      <ul class="checks" id="checks" aria-live="polite"></ul>
    </main>

    <main class="view page" id="view-providers" hidden>
      <header class="page-header">
        <h1 data-text="ui.providers.title"></h1>
        <button type="button" class="button" id="providers-add" data-text="ui.providers.add"></button>
      </header>
      <p class="hint" id="providers-empty" data-text="ui.providers.empty"></p>
      <ul class="providers" id="provider-tokens"></ul>
      <div class="actions page-footer">
        <button type="button" class="button button-primary" id="providers-next" data-text="ui.next" disabled></button>
      </div>
    </main>

    <main class="view page" id="view-select" hidden>
      <header class="page-header">
        <h1 data-text="ui.select.title"></h1>
      </header>
      <ul class="providers" id="provider-types"></ul>
      <div class="actions page-footer">
        <button type="button" class="button" id="select-cancel" data-text="ui.cancel"></button>
      </div>
    </main>

    <main class="view page" id="view-token" hidden>
      <header class="page-header">
        <h1 class="provider">
          <img class="provider-logo" id="token-logo" alt="">
          <span id="token-provider"></span>
        </h1>
      </header>
      <form class="token-form" id="token-form">
        <label for="token-input" data-text="ui.token.label"></label>
        <input id="token-input" type="password" autocomplete="off" spellcheck="false">
        <p class="hint" id="token-hint"></p>
        <p class="status" id="token-status" aria-live="polite"></p>
        <div class="actions page-footer">
          <button type="button" class="button" id="token-cancel" data-text="ui.cancel"></button>
          <button type="submit" class="button button-primary" id="token-add" data-text="ui.token.add"></button>
        </div>
      </form>
    </main>

    <main class="view page" id="view-deployments" hidden>
      <header class="page-header">
        <h1 data-text="ui.deployments.title"></h1>
        <button type="button" class="button" id="deployments-create" data-text="ui.deployments.create"></button>
      </header>
      <p class="status" id="deployments-status" aria-live="polite"></p>
      <ul class="deployments" id="deployments"></ul>
      <div class="actions page-footer">
        <button type="button" class="button" id="deployments-back" data-text="ui.back"></button>
      </div>
    </main>

    <main class="view page" id="view-create" hidden>
      <header class="page-header">
        <h1 data-text="ui.create.title"></h1>
      </header>
      <form class="token-form" id="create-form">
        <label for="create-name" data-text="ui.create.name"></label>
        <input id="create-name" type="text" autocomplete="off" spellcheck="false" required>
        <p class="hint" data-text="ui.create.name_hint"></p>
        <label for="create-password" data-text="ui.create.password"></label>
        <input id="create-password" type="password" autocomplete="new-password" minlength="16" required>
        <p class="hint" data-text="ui.create.password_hint"></p>
        <p class="status" id="create-status" aria-live="polite"></p>
        <div class="actions page-footer">
          <button type="button" class="button" id="create-cancel" data-text="ui.cancel"></button>
          <button type="submit" class="button button-primary" id="create-plan" data-text="ui.create.plan"></button>
        </div>
      </form>
    </main>

    <main class="view page" id="view-plan" hidden>
      <header class="page-header">
        <h1 data-text="ui.plan.title"></h1>
      </header>
      <p class="hint"><span data-text="ui.plan.intro"></span> <strong id="plan-name"></strong></p>
      <p class="hint"><span data-text="ui.plan.key"></span> <code class="plan-key sak-mono" id="plan-key"></code></p>
      <ul class="resources" id="plan-resources"></ul>
      <div class="actions page-footer">
        <button type="button" class="button" id="plan-cancel" data-text="ui.cancel"></button>
        <button type="button" class="button" id="plan-back" data-text="ui.back"></button>
        <button type="button" class="button button-primary" id="plan-apply" data-text="ui.plan.apply"></button>
      </div>
    </main>
  </body>
</html>
