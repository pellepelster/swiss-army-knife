# sak-wizard, the desktop app: tauri 2 with its rust core in src-tauri/ and the static web ui in ui/
[tools]
rust = "1.99.1"
# the tauri cli comes from npm as a prebuilt binary, node only runs it
node = "22.22.3"
"npm:@tauri-apps/cli" = "2.12.4"

# the image of the tools sak-wizard runs in a container (Dockerfile) and the canary proving a
# container runtime works on startup (canary/Dockerfile)
[vars]
image = "ghcr.io/pellepelster/sak-wizard"
canary = "ghcr.io/pellepelster/sak-docker-canary"

# the theme of ../sak-theme, copied into ui/theme/ (not committed): tauri bundles ui/ alone
[tasks."wizard:theme"]
description = "Copy sak-theme into ui/theme/ for the page of sak-wizard"
dir = "{{config_root}}"
run = """
rm -rf ui/theme
mkdir -p ui/theme
cp ../sak-theme/tokens.css ../sak-theme/fonts.css ../sak-theme/components.css ui/theme/
cp -r ../sak-theme/fonts ui/theme/fonts
"""

# on linux the webview needs the webkitgtk headers, on debian/ubuntu:
# sudo apt install libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
[tasks."wizard:run"]
description = "Run sak-wizard, reloading it when its rust code or ui changes"
depends = ["wizard:theme"]
dir = "{{config_root}}"
run = "tauri dev"

# the bundles of the platform it runs on (deb, rpm and AppImage on linux, dmg on macos,
# msi and nsis on windows) land in src-tauri/target/release/bundle/
[tasks."wizard:build"]
description = "Build the sak-wizard installers for the current platform, the image of its tools and the canary"
depends = ["wizard:theme", "wizard:image:build", "wizard:canary:build"]
dir = "{{config_root}}"
run = "tauri build"

# the checks run real containers with the docker or podman installed, skipped without one
[tasks."wizard:test"]
description = "Run the tests of sak-wizard"
depends = ["wizard:theme"]
dir = "{{config_root}}/src-tauri"
run = "cargo test"

# sak-cloud in cloud/, the crate that declares the cloud resources of sak-wizard; the tests
# against the real hetzner cloud api need HCLOUD_TOKEN, taken from pass when not set, and
# skip themselves without one (the github workflow has no pass)
[tasks."wizard:cloud:test"]
description = "Run the tests of sak-cloud, those against the hetzner cloud api with the token from pass"
dir = "{{config_root}}/cloud"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
run = "cargo test"

# each image built, tested and pushed on its own (the github workflow runs them in parallel); the
# layers are cached in the registry next to the image, tag buildcache: every build reads it, the
# push writes it. A build is for the platform it runs on, into the local images; --load keeps it
# there when buildx builds in a container of its own (the github workflow)
[tasks."wizard:image:build"]
description = "Build the image of the tools of sak-wizard, terraform and ansible"
dir = "{{config_root}}"
run = """
docker buildx build --load --tag {{vars.image}}:latest \
  --cache-from type=registry,ref={{vars.image}}:buildcache .
"""

[tasks."wizard:image:test"]
description = "Check that the image of the tools runs terraform and ansible as sak (1000:1000)"
depends = ["wizard:image:build"]
run = """
set -e
image={{vars.image}}:latest
[ "$(docker run --rm "$image" id -u):$(docker run --rm "$image" id -g)" = "1000:1000" ]
[ "$(docker run --rm "$image" id -un)" = "sak" ]
docker run --rm "$image" terraform version
docker run --rm "$image" ansible --version
docker run --rm "$image" ansible-galaxy collection list community.general
docker run --rm "$image" ansible localhost -m ping
echo "the image of the tools works"
"""

# for amd64 and arm64 (the macs), tagged latest and with the commit it was built from; the
# platform not running here needs qemu (binfmt)
[tasks."wizard:image:push"]
description = "Build the image of the tools for amd64 and arm64 and push it to ghcr.io"
dir = "{{config_root}}"
run = """
docker buildx build --platform linux/amd64,linux/arm64 \
  --tag {{vars.image}}:latest --tag {{vars.image}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.image}}:buildcache \
  --cache-to type=registry,ref={{vars.image}}:buildcache,mode=max,image-manifest=true \
  --push .
"""

[tasks."wizard:canary:build"]
description = "Build the canary proving a container runtime works, sak-docker-canary"
dir = "{{config_root}}/canary"
run = """
docker buildx build --load --tag {{vars.canary}}:latest \
  --cache-from type=registry,ref={{vars.canary}}:buildcache .
"""

[tasks."wizard:canary:test"]
description = "Check that the canary answers"
depends = ["wizard:canary:build"]
run = """
[ "$(docker run --rm {{vars.canary}}:latest)" = "sak-docker-canary" ]
echo "the canary works"
"""

[tasks."wizard:canary:push"]
description = "Build the canary for amd64 and arm64 and push it to ghcr.io"
dir = "{{config_root}}/canary"
run = """
docker buildx build --platform linux/amd64,linux/arm64 \
  --tag {{vars.canary}}:latest --tag {{vars.canary}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.canary}}:buildcache \
  --cache-to type=registry,ref={{vars.canary}}:buildcache,mode=max,image-manifest=true \
  --push .
"""

# REGISTRY_USERNAME and REGISTRY_PASSWORD: a github user and a token of it with write:packages,
# in the workflow github.actor and its GITHUB_TOKEN
[tasks."wizard:login"]
description = "Log in to ghcr.io to pull and push the images and their cache"
run = """
if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
  echo "set REGISTRY_USERNAME and REGISTRY_PASSWORD to log in to ghcr.io" >&2
  exit 1
fi
printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
"""
