checks:
  failed_title: "SwissArmyKnife can not start"
  quit: "Quit"
  not_finished: "A check did not finish: %{error}"
  splash_not_updated: "The splash screen could not be updated: %{error}"
  container_runtime:
    name: "Verify docker or podman"
    passed: "%{runtime} %{version}"
