    not_working: "%{runtime} does not work: %{error}"
    wrong_answer: "The image %{image} answered '%{answer}' instead of '%{expected}'."
  image:
    name: "Pull the latest image"
    passed: "%{image}"
    not_pulled: "The image %{image} could not be pulled, make sure %{runtime} can reach ghcr.io: %{error}"
    not_run: "%{runtime} could not run the image %{image}: %{error}"
    progress: "%{downloaded} MB of %{total} MB"
    wrong_answer: "The image %{image} runs as '%{answer}' instead of '%{expected}', it is not the image of SwissArmyKnife."
  provider_tokens:
    name: "Verify the provider tokens of the environment"
    passed: "The tokens of %{variables} are valid"
    invalid: "%{variable} holds no valid %{provider} token: %{error} Correct or unset %{variable} and start SwissArmyKnife again."
providers:
  empty_token: "Enter the token."
  duplicate: "This token was added already."
  hetzner:
    token_hint: "Create a token with the permissions read & write in the Hetzner Cloud console of your project, under Security → API tokens."
    unreachable: "The Hetzner Cloud API could not be reached: %{error}"
    unauthorized: "The token is not valid, check that it was copied completely."
    forbidden: "The token can only read, create one with the permissions read & write."
    refused: "The Hetzner Cloud API refused the token: %{error}"
    not_deleted: "The ssh key %{name} created to check the token could not be deleted, delete it in the Hetzner Cloud console: %{error}"
ui:
  providers:
    title: "Provider tokens"
    empty: "No provider tokens yet. Add the API tokens of the providers SwissArmyKnife creates resources at."
    add: "Add"
  select:
    title: "Select the provider"
  token:
    label: "API token"
    add: "Add"
    checking: "Checking the token, an ssh key is created and deleted again…"
  cancel: "Cancel"
  next: "Next"
  back: "Back"
  operations:
    title: "What should the wizard do?"
    install:
      name: "Install"
      description: "Set up SwissArmyKnife from scratch with the provider tokens."
    upgrade:
      name: "Upgrade"
      description: "Bring an existing SwissArmyKnife to this version."
    backup:
      name: "Backup"
      description: "Save the data of an existing SwissArmyKnife."
    restore:
      name: "Restore"
      description: "Bring the data of a backup back into SwissArmyKnife."
