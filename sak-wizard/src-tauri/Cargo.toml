[package]
name = "sak-wizard"
version = "0.1.0"
description = "The SwissArmyKnife desktop app"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.8.4"
rust-i18n = "4.2.4"
sys-locale = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
