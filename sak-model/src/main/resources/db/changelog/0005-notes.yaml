# the notes of the notes app with the labels attached to them; a deleted note stays as a row with
# deleted_at set. Plain sql, sqlite only takes the foreign keys when the table is created.
databaseChangeLog:
  - changeSet:
      id: 0005-notes
      author: sak
      changes:
        - sql:
            sql: >-
              CREATE TABLE notes (
                id INTEGER NOT NULL PRIMARY KEY,
                text VARCHAR(10000) NOT NULL,
                color VARCHAR(16) NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NOT NULL,
                deleted_at TIMESTAMP
              )
        - sql:
            sql: >-
              CREATE TABLE notes_labels (
                note_id INTEGER NOT NULL,
                label_id INTEGER NOT NULL,
                CONSTRAINT notes_labels_pkey PRIMARY KEY (note_id, label_id),
                CONSTRAINT notes_labels_note_id_fkey FOREIGN KEY (note_id) REFERENCES notes (id),
                CONSTRAINT notes_labels_label_id_fkey FOREIGN KEY (label_id) REFERENCES labels (id)
              )
