# the initial schema of the controller's database; sqlite only takes checks and foreign keys when
# a table is created, the unique constraints over several columns are unique indexes. Liquibase
# has no element for check constraints, the table with one is created with plain sql. The unique
# indexes over the rows that are not deleted only are partial ones in plain sql for sqlite only,
# jooq generates its classes from the schema in h2, which knows no partial indexes.
# Every table has created_at, set when the row is inserted, updated_at, null until the row is
# changed, and deleted_at, null until the row is deleted; no row is ever deleted for real
# (SchemaTest).
databaseChangeLog:
  - changeSet:
      id: 0001-initial
      author: sak
      changes:
        # the buckets of the s3 api, each with the key pair that may access it. A deleted bucket
        # stays as a row with deleted_at set, its name stays taken until it is purged
        - createTable:
            tableName: s3_buckets
            columns:
              - column:
                  name: name
                  type: varchar(63)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: access_key_id
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: s3_buckets_access_key_id_key
              - column:
                  name: secret_access_key
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp

        # the domains a bucket is served at, in their order, the first is where redirects to the
        # bucket lead; a domain belongs to one bucket at most among the rows that are not deleted.
        # The domains a bucket is no longer served at, and the ones of a deleted bucket, stay as
        # rows with deleted_at set
        - createTable:
            tableName: s3_buckets_domains
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: domain
                  type: varchar(253)
                  constraints:
                    nullable: false
              - column:
                  name: bucket_name
                  type: varchar(63)
                  constraints:
                    nullable: false
                    foreignKeyName: s3_buckets_domains_bucket_name_fkey
                    references: s3_buckets(name)
              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX s3_buckets_domains_domain_key ON s3_buckets_domains (domain) WHERE deleted_at IS NULL
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX s3_buckets_domains_position_key ON s3_buckets_domains (bucket_name, position) WHERE deleted_at IS NULL

        # the domains caddy redirects, each to an external domain or to the domain a bucket is
        # served at; exactly the column of the target type is set. A deleted redirect stays as a
        # row with deleted_at set, a domain is redirected once among the rows that are not deleted
        - sql:
            sql: >-
              CREATE TABLE redirects (
                id INTEGER NOT NULL PRIMARY KEY,
                source_domain VARCHAR(253) NOT NULL,
                target_type VARCHAR(16) NOT NULL,
                target_domain VARCHAR(253),
                target_bucket VARCHAR(63),
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP,
                deleted_at TIMESTAMP,
                CONSTRAINT redirects_target_bucket_fkey FOREIGN KEY (target_bucket) REFERENCES s3_buckets (name),
                CONSTRAINT redirects_target_check CHECK (
                  (target_type = 'DOMAIN' AND target_domain IS NOT NULL AND target_bucket IS NULL)
                  OR (target_type = 'BUCKET' AND target_bucket IS NOT NULL AND target_domain IS NULL)
                )
              )
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX redirects_source_domain_key ON redirects (source_domain) WHERE deleted_at IS NULL

        # the labels every application can attach to the entities of the user who created them,
        # each application links them in a table of its own; owner is the e-mail address of the
        # signed in user, nobody else sees them. A deleted label stays as a row with deleted_at
        # set; the name is unique among the labels of an owner that are not deleted only
        - createTable:
            tableName: labels
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX labels_owner_name_key ON labels (owner, name) WHERE deleted_at IS NULL

        # the files of the generic file storage, each upload is a file of its own; the content
        # lives in the data dir under its sha-256 (lower case hex), the same content is stored
        # once. The table knows what it is, who uploaded it and the text discovered in it, null
        # until it is discovered. A deleted file stays as a row with deleted_at set.
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sha256
                  type: char(64)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(127)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: discovered
                  type: varchar(100000)

        # the notes of the notes app, each belongs to the address of the user that created it; a
        # deleted note stays as a row with deleted_at set
        - createTable:
            tableName: notes
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: varchar(10000)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
        - createIndex:
            tableName: notes
            indexName: notes_owner_idx
            columns:
              - column:
                  name: owner

        # the labels attached to a note. A label removed from a note, the labels of a deleted note
        # and the links to a deleted label stay as rows with deleted_at set; a label is attached to
        # a note once among the rows that are not deleted
        - createTable:
            tableName: notes_labels
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: note_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_labels_note_id_fkey
                    references: notes(id)
              - column:
                  name: label_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_labels_label_id_fkey
                    references: labels(id)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX notes_labels_label_key ON notes_labels (note_id, label_id) WHERE deleted_at IS NULL

        # the files of a note in their order, its photos and its recordings, told apart by the
        # type of the file. A file removed from a note, or the files of a deleted note, stay as
        # rows with deleted_at set; a file is attached to a note once among the rows that are not
        # deleted
        - createTable:
            tableName: notes_files
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: note_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_files_note_id_fkey
                    references: notes(id)
              - column:
                  name: file_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_files_file_id_fkey
                    references: files(id)
              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX notes_files_file_key ON notes_files (note_id, file_id) WHERE deleted_at IS NULL

        # the settings of the controller, each of a name and a scope: 'system' for the controller
        # itself or the e-mail address of a user. Some are secrets (e.g. AUTH_SIGNING_KEY); the
        # values are plain, the whole database is to be encrypted
        # (docs/fdr/FDR-002-sqlite-encryption.md). A setting replaced or deleted stays as a row
        # with deleted_at set, one setting per name and scope is not deleted
        - createTable:
            tableName: settings
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: varchar(16384)
                  constraints:
                    nullable: false
              - column:
                  name: scope
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX settings_name_scope_key ON settings (name, scope) WHERE deleted_at IS NULL
