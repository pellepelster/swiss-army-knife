# the initial schema of the controller's database; sqlite only takes checks and foreign keys when
# a table is created, the unique constraints over several columns are unique indexes. Liquibase
# has no element for check constraints, the table with one is created with plain sql. The unique
# indexes over the rows that are not deleted only are partial ones in plain sql for sqlite only,
# jooq generates its classes from the schema in h2, which knows no partial indexes.
databaseChangeLog:
  - changeSet:
      id: 0001-initial
      author: sak
      changes:
        # the buckets of the s3 api, each with the key pair that may access it; the secret is
        # stored as is, sigv4 needs it to verify the requests
        - createTable:
            tableName: s3_buckets
            columns:
              - column:
                  name: name
                  type: varchar(63)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: access_key_id
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: s3_buckets_access_key_id_key
              - column:
                  name: secret_access_key
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

        # the domains a bucket is served at, in their order, the first is where redirects to the
        # bucket lead; a domain belongs to one bucket at most
        - createTable:
            tableName: s3_buckets_domains
            columns:
              - column:
                  name: domain
                  type: varchar(253)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: bucket_name
                  type: varchar(63)
                  constraints:
                    nullable: false
                    foreignKeyName: s3_buckets_domains_bucket_name_fkey
                    references: s3_buckets(name)
                    deleteCascade: true
              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false
        - createIndex:
            tableName: s3_buckets_domains
            indexName: s3_buckets_domains_position_key
            unique: true
            columns:
              - column:
                  name: bucket_name
              - column:
                  name: position

        # the domains caddy redirects, each to an external domain or to the domain a bucket is
        # served at; exactly the column of the target type is set
        - sql:
            sql: >-
              CREATE TABLE redirects (
                source_domain VARCHAR(253) NOT NULL PRIMARY KEY,
                target_type VARCHAR(16) NOT NULL,
                target_domain VARCHAR(253),
                target_bucket VARCHAR(63),
                created_at TIMESTAMP NOT NULL,
                CONSTRAINT redirects_target_bucket_fkey FOREIGN KEY (target_bucket) REFERENCES s3_buckets (name),
                CONSTRAINT redirects_target_check CHECK (
                  (target_type = 'DOMAIN' AND target_domain IS NOT NULL AND target_bucket IS NULL)
                  OR (target_type = 'BUCKET' AND target_bucket IS NOT NULL AND target_domain IS NULL)
                )
              )

        # the labels every application can attach to its entities, each application links them in
        # a table of its own. A deleted label stays as a row with deleted_at set; the name is
        # unique among the labels that are not deleted only
        - createTable:
            tableName: labels
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX labels_name_key ON labels (name) WHERE deleted_at IS NULL

        # the files of the generic file storage, each upload is a file of its own; the content
        # lives in the data dir under its sha-256 (lower case hex), the same content is stored
        # once. The table knows what it is, who uploaded it and the text discovered in it, null
        # until it is discovered. A deleted file stays as a row with deleted_at set.
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sha256
                  type: char(64)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(127)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp
              - column:
                  name: discovered
                  type: varchar(100000)

        # the notes of the notes app, each belongs to the address of the user that created it; a
        # deleted note stays as a row with deleted_at set
        - createTable:
            tableName: notes
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: varchar(10000)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp
        - createIndex:
            tableName: notes
            indexName: notes_owner_idx
            columns:
              - column:
                  name: owner

        # the labels attached to a note. A label removed from a note, the labels of a deleted note
        # and the links to a deleted label stay as rows with deleted_at set; a label is attached to
        # a note once among the rows that are not deleted
        - createTable:
            tableName: notes_labels
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: note_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_labels_note_id_fkey
                    references: notes(id)
              - column:
                  name: label_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_labels_label_id_fkey
                    references: labels(id)
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX notes_labels_label_key ON notes_labels (note_id, label_id) WHERE deleted_at IS NULL

        # the files of a note in their order, its photos and its recordings, told apart by the
        # type of the file. A file removed from a note, or the files of a deleted note, stay as
        # rows with deleted_at set; a file is attached to a note once among the rows that are not
        # deleted
        - createTable:
            tableName: notes_files
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: note_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_files_note_id_fkey
                    references: notes(id)
              - column:
                  name: file_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: notes_files_file_id_fkey
                    references: files(id)
              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamp
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX notes_files_file_key ON notes_files (note_id, file_id) WHERE deleted_at IS NULL
