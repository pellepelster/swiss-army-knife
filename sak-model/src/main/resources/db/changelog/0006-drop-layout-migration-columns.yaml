# the columns that only the copies to the resource ids read go (MODEL-8): files.sha256 named where the
# content of a file was before 0004, s3_buckets.objects_at_name the buckets whose objects were still
# below their name after 0005. The backend of the release between copied both when it started; an
# instance must have started that release once before this change set runs
databaseChangeLog:
  - changeSet:
      id: 0006-drop-layout-migration-columns
      author: sak
      dbms: sqlite
      changes:
        - sql:
            sql: ALTER TABLE files DROP COLUMN sha256
        - sql:
            sql: ALTER TABLE s3_buckets DROP COLUMN objects_at_name
  # the same for the classes jooq generates, from h2 at build time (sak-model/build.gradle.kts)
  - changeSet:
      id: 0006-drop-layout-migration-columns-codegen
      author: sak
      dbms: h2
      changes:
        - dropColumn:
            tableName: files
            columnName: sha256
        - dropColumn:
            tableName: s3_buckets
            columnName: objects_at_name
