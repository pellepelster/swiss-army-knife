# the files of the generic file storage, addressed by the sha-256 of their content (lower case
# hex); the content lives in the data dir, the table knows what it is and who uploaded it first.
# A deleted file stays as a row with deleted_at set.
databaseChangeLog:
  - changeSet:
      id: 0006-files
      author: sak
      changes:
        - sql:
            sql: >-
              CREATE TABLE files (
                sha256 CHAR(64) NOT NULL PRIMARY KEY,
                content_type VARCHAR(127) NOT NULL,
                size BIGINT NOT NULL,
                uploaded_by VARCHAR(254) NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NOT NULL,
                deleted_at TIMESTAMP
              )
