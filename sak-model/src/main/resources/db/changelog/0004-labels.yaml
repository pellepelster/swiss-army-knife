# the labels every application can attach to its entities, each application links them in a
# table of its own. A deleted label stays as a row with deleted_at set; active is 1 for the
# labels that are not deleted and null for the deleted ones, so the name is unique among the
# labels that are not deleted only (sqlite takes nulls as distinct). Plain sql, sqlite only
# takes the check when the table is created.
databaseChangeLog:
  - changeSet:
      id: 0004-labels
      author: sak
      changes:
        - sql:
            sql: >-
              CREATE TABLE labels (
                id INTEGER NOT NULL PRIMARY KEY,
                name VARCHAR(64) NOT NULL,
                active INTEGER,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NOT NULL,
                deleted_at TIMESTAMP,
                CONSTRAINT labels_name_key UNIQUE (name, active),
                CONSTRAINT labels_active_check CHECK (
                  (deleted_at IS NULL AND active IS NOT NULL AND active = 1) OR (deleted_at IS NOT NULL AND active IS NULL)
                )
              )
