# the buckets get a resource id (MODEL-8): their objects are on the data volume below s3/<resource_id>,
# no longer below buckets/<name>. The rows of every bucket get one, the deleted ones included.
# objects_at_name tells the buckets whose objects are still below their name: every bucket that is
# there now, until the backend copied its objects when it starts (BucketLayoutMigration); it goes
# with that migration in a later release
databaseChangeLog:
  # as for the files (0004): sqlite adds no column without a default to a table that has rows, and
  # s3_buckets_domains refers to the table, so it is not rebuilt. The defaults are only there for the
  # rows that are now, the repository sets both values of every new row. Should two rows draw the same
  # resource id, the unique index fails, the change set is rolled back and the next start draws again
  - changeSet:
      id: 0005-s3-buckets-resource-id
      author: sak
      dbms: sqlite
      changes:
        - sql:
            sql: ALTER TABLE s3_buckets ADD COLUMN resource_id CHAR(12) NOT NULL DEFAULT ''
        - sql:
            sql: UPDATE s3_buckets SET resource_id = lower(hex(randomblob(6)))
        # over the deleted rows too: a resource id is never given to another bucket (MODEL-8)
        - sql:
            sql: CREATE UNIQUE INDEX s3_buckets_resource_id_key ON s3_buckets (resource_id)
        - sql:
            sql: ALTER TABLE s3_buckets ADD COLUMN objects_at_name BOOLEAN NOT NULL DEFAULT 0
        - sql:
            sql: UPDATE s3_buckets SET objects_at_name = 1
  # the same columns for the classes jooq generates, from h2 at build time (sak-model/build.gradle.kts)
  - changeSet:
      id: 0005-s3-buckets-resource-id-codegen
      author: sak
      dbms: h2
      changes:
        - addColumn:
            tableName: s3_buckets
            columns:
              - column:
                  name: resource_id
                  type: char(12)
                  constraints:
                    nullable: false
              - column:
                  name: objects_at_name
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
