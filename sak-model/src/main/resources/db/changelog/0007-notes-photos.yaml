# the photos of a note in their order, files of the file storage. Plain sql, sqlite only takes the
# foreign keys when the table is created.
databaseChangeLog:
  - changeSet:
      id: 0007-notes-photos
      author: sak
      changes:
        - sql:
            sql: >-
              CREATE TABLE notes_photos (
                note_id INTEGER NOT NULL,
                position INTEGER NOT NULL,
                file_sha256 CHAR(64) NOT NULL,
                CONSTRAINT notes_photos_pkey PRIMARY KEY (note_id, position),
                CONSTRAINT notes_photos_note_id_fkey FOREIGN KEY (note_id) REFERENCES notes (id),
                CONSTRAINT notes_photos_file_sha256_fkey FOREIGN KEY (file_sha256) REFERENCES files (sha256)
              )
