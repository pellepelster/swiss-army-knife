# a grocery item may have a photo, a file of the file storage (files) the apps show scaled in the
# list; the product of a user takes the photo they attach, so it comes back when they add the item
# again (GROCERY-11). Plain sql, as 0002: addColumn rebuilds the table in sqlite, which breaks its
# foreign keys; sqlite and h2 (jooq) both take this one
databaseChangeLog:
  - changeSet:
      id: 0004-grocery-photos
      author: sak
      changes:
        - sql:
            sql: ALTER TABLE grocery_items ADD COLUMN photo_file_id INTEGER REFERENCES files (id)
        - sql:
            sql: ALTER TABLE grocery_products ADD COLUMN photo_file_id INTEGER REFERENCES files (id)
