# the categories of a list (GROCERY-13): a name, an icon (one emoji, none for none) and the position
# of their group in the list; only the owner of the list changes them, everyone who sees it sees them.
# Items and the products a list learned point to a category of their own list, the repository checks
# it. name_key is the name normalized (groceryNameKey), unique among the live categories of a list,
# so "Dairy" and "dairy" are one name. The fixed categories before go, items and products lose theirs.
# The partial index is for sqlite only (0001-initial). Plain sql, as 0002: addColumn rebuilds the
# table in sqlite
databaseChangeLog:
  - changeSet:
      id: 0007-grocery-categories
      author: sak
      changes:
        - sql:
            sql: |
              CREATE TABLE grocery_categories (
                id INTEGER NOT NULL PRIMARY KEY,
                list_id INTEGER NOT NULL,
                owner VARCHAR(254) NOT NULL,
                name VARCHAR(32) NOT NULL,
                name_key VARCHAR(32) NOT NULL,
                icon VARCHAR(32),
                position INTEGER NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP,
                deleted_at TIMESTAMP,
                CONSTRAINT grocery_categories_list_id_fkey FOREIGN KEY (list_id) REFERENCES grocery_lists (id)
              )
        - sql:
            sql: CREATE INDEX grocery_categories_list_id_idx ON grocery_categories (list_id)
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX grocery_categories_list_name_key ON grocery_categories (list_id, name_key) WHERE deleted_at IS NULL
        - sql:
            sql: ALTER TABLE grocery_items ADD COLUMN category_id INTEGER REFERENCES grocery_categories (id)
        - sql:
            sql: ALTER TABLE grocery_products ADD COLUMN category_id INTEGER REFERENCES grocery_categories (id)
        - sql:
            sql: ALTER TABLE grocery_items DROP COLUMN category
        - sql:
            sql: ALTER TABLE grocery_products DROP COLUMN category
