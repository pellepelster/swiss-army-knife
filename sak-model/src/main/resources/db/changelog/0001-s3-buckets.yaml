# the buckets of the s3 api, each with the key pair that may access it; the secret is stored as
# is, sigv4 needs it to verify the requests
databaseChangeLog:
  - changeSet:
      id: 0001-s3-buckets
      author: sak
      changes:
        - createTable:
            tableName: s3_buckets
            columns:
              - column:
                  name: name
                  type: varchar(63)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: access_key_id
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: s3_buckets_access_key_id_key
              - column:
                  name: secret_access_key
                  type: varchar(40)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
