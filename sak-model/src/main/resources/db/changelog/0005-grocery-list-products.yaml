# a shared list learns from its items too (GROCERY-11): a product with a list_id belongs to that list,
# every user who sees the list sees it; one without belongs to its owner alone, as before. One product
# of a name among the live ones of an owner, and among the live ones of a list; the partial indexes
# are for sqlite only (0001-initial). Plain sql, as 0002: addColumn rebuilds the table in sqlite
databaseChangeLog:
  - changeSet:
      id: 0005-grocery-list-products
      author: sak
      changes:
        - sql:
            sql: ALTER TABLE grocery_products ADD COLUMN list_id INTEGER REFERENCES grocery_lists (id)
        - sql:
            dbms: sqlite
            sql: DROP INDEX grocery_products_owner_name_key
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX grocery_products_owner_name_key ON grocery_products (owner, name_key) WHERE deleted_at IS NULL AND list_id IS NULL
        - sql:
            dbms: sqlite
            sql: CREATE UNIQUE INDEX grocery_products_list_name_key ON grocery_products (list_id, name_key) WHERE deleted_at IS NULL AND list_id IS NOT NULL
