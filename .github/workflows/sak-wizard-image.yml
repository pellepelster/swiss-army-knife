# builds and tests the image of the tools of sak-wizard, pushed to ghcr.io from main only
name: sak-wizard image

on:
  push:
    branches: [main]
    paths:
      - sak-wizard/Dockerfile
      - sak-wizard/.dockerignore
      - sak-wizard/mise.toml
      - .github/workflows/sak-wizard-image.yml
  pull_request:
    paths:
      - sak-wizard/Dockerfile
      - sak-wizard/.dockerignore
      - sak-wizard/mise.toml
      - .github/workflows/sak-wizard-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sak-wizard
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # the image tasks need docker only, not the rust, node and terraform of the mise.toml files
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: mise run wizard:image:test
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mise run wizard:image:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mise run wizard:image:push
