# builds and tests everything: the backend and the frontend with gradle, the images of the server
# (sak-backend-images: sak-backend and sak-ingress) and of sak-cli (sak-cli-images: the tools and
# the canary), each in a job of its own and pushed to ghcr.io from main only, sakctl as a native
# binary for linux, macOS and windows, and the documentation of docs/ as a site, published as
# the github pages of the repository from main only. Everything that can be is cached: the mise tools, gradle,
# npm, cargo, the apt packages and the docker layers (in the registry).
name: swiss-army-knife

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one run at a time per branch, a newer push cancels the run before: only the newest commit
# counts, and the images are never pushed by two runs at once (an older run can not overwrite
# latest after a newer one)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # each job installs the tools it needs only, not every tool of the mise.toml files
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  gradle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the jdk of the gradle toolchain, node for the frontend the build calls npm for
      - uses: jdx/mise-action@v5
        with:
          install_args: java node
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      - run: ./gradlew build

  sak-backend-images:
    name: sak-backend-images (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks <image>:image:test and <image>:image:push of the root mise.toml
        image: [backend, ingress]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the backend's distribution comes from gradle, which builds the frontend with npm
      - uses: jdx/mise-action@v5
        with:
          install_args: java node
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the cache of the images may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ${{ matrix.image }}:image:test
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mise run ${{ matrix.image }}:image:push

  sak-cli-images:
    name: sak-cli-images (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks cli:<image>:test and cli:<image>:push
        image: [image, canary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the images and their cache may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run cli:${{ matrix.image }}:test
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mise run cli:${{ matrix.image }}:push

  # sakctl for each platform: the window and the command line in one native binary with the page
  # built in, one artifact for each platform (docs/installation.md), no installers. macOS gets one
  # universal binary for apple silicon and intel. Nothing is signed: macOS and windows warn on the
  # first start
  sakctl:
    name: sakctl (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            build: --no-bundle
            binary: sak-cli/src-tauri/target/release/sakctl
          - platform: macos
            runner: macos-15
            build: --target universal-apple-darwin --no-bundle
            binary: sak-cli/src-tauri/target/universal-apple-darwin/release/sakctl
          - platform: windows
            runner: windows-2025
            build: --no-bundle
            binary: sak-cli/src-tauri/target/release/sakctl.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1
      # the tools are installed after the action, saved to its cache in its post step
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache_save_post: true
      - run: mise install rust node npm:@tauri-apps/cli
      # the universal binary is the one of both architectures
      - if: matrix.platform == 'macos'
        run: mise exec -- rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sak-cli/src-tauri -> target
          key: ${{ matrix.platform }}
      - run: mise run cli:theme
      - name: Build sakctl
        working-directory: sak-cli
        run: mise exec -- tauri build ${{ matrix.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: sakctl-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # the site of docs/ (site/, hugo and the theme relearn); a link that does not resolve fails it, on
  # a pull request too. The address of the pages is its base url
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # go fetches the theme, a hugo module
      - uses: jdx/mise-action@v5
        with:
          install_args: hugo-extended go
      - id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - run: mise run docs:build
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  # the site of the job docs as the github pages of the repository, from main only
  docs-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
