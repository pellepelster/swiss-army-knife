# builds and tests everything: the backend and the frontend with gradle, the images of the server
# (sak-backend and sak-ingress) and of sak-wizard (the tools and the canary), each in a job of its
# own and pushed to ghcr.io from main only, and sak-wizard itself, whose checks pull its images. Everything that can be is cached: the mise
# tools, gradle, npm, cargo, the apt packages and the docker layers (in the registry).
name: swiss-army-knife

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one run at a time per branch, a newer push cancels the run before: only the newest commit
# counts, and the images are never pushed by two runs at once (an older run can not overwrite
# latest after a newer one)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # each job installs the tools it needs only, not every tool of the mise.toml files
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  gradle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the jdk of the gradle toolchain, node for the frontend the build calls npm for
      - uses: jdx/mise-action@v5
        with:
          install_args: java node
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      - run: ./gradlew build

  server-images:
    name: images (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks <image>:image:test and <image>:image:push of the root mise.toml
        image: [backend, ingress]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the backend's distribution comes from gradle, which builds the frontend with npm
      - uses: jdx/mise-action@v5
        with:
          install_args: java node
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the cache of the images may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ${{ matrix.image }}:image:test
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mise run ${{ matrix.image }}:image:push

  images:
    name: images (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks wizard:<image>:test and wizard:<image>:push
        image: [image, canary]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sak-wizard
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the images and their cache may be private
      - run: mise run wizard:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run wizard:${{ matrix.image }}:test
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mise run wizard:${{ matrix.image }}:push

  wizard:
    # its tests pull the images, the ones of main pushed by the jobs before
    needs: images
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sak-wizard
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1
      # the tools are installed after the action, saved to its cache in its post step
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache_save_post: true
      - run: mise install rust node npm:@tauri-apps/cli
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sak-wizard/src-tauri -> target
            sak-wizard/cloud -> target
      # the images may be private
      - run: mise run wizard:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run wizard:test
      - run: mise run wizard:cloud:test
      # the linux installers, the images were built by the jobs before
      - run: mise run wizard:theme
      - run: mise exec -- tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: sak-wizard-linux
          path: |
            sak-wizard/src-tauri/target/release/bundle/deb/*.deb
            sak-wizard/src-tauri/target/release/bundle/rpm/*.rpm
            sak-wizard/src-tauri/target/release/bundle/appimage/*.AppImage
