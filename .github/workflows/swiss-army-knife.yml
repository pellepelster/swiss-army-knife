# tests and builds everything: the unit tests of the backend, the frontend and the cli first, then,
# when they are green, the images of the server (sak-backend-images: sak-backend and sak-ingress)
# and of sak-cli (sak-cli-images: the tools and the canary), each in a job of its own, sakctl as a
# native binary for linux, macOS and windows, and
# the documentation of docs/ as a site. Only the build of a tag v<version> (mise run release)
# publishes: the images pushed to ghcr.io as <VERSION>-rc, then all of them as <VERSION> (release),
# and after the release the documentation as the github pages of the repository. Everything that
# can be is cached: the mise tools, gradle, npm, cargo, the apt packages and the docker layers (in
# the registry).
name: swiss-army-knife

on:
  push:
    branches: [main]
    # v0.0.0 is the start of the versions of svu (mise run release), never a release
    tags: ['v*', '!v0.0.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one run at a time per branch, a newer push cancels the run before: only the newest commit
# counts, and the images are never pushed by two runs at once (an older run can not overwrite
# latest after a newer one)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # the tag v<version> of a release, mise.toml takes the v off; latest for every other build
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  # each job installs the tools it needs only, not every tool of the mise.toml files
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  # the unit tests of the backend, the frontend and the cli (mise run test:<part>:unit), each in a
  # job of its own; their junit reports show as a check of the run, failed tests also when the
  # tests fail. The images are built only when all of them are green
  test-unit:
    name: test-unit (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # the jdk of the gradle toolchain, node for the frontend the build calls npm for
          - part: backend
            tools: java node
            reports: '**/build/test-results/test/*.xml'
          - part: frontend
            tools: java node
            reports: sak-frontend/build/test-results/unit/*.xml
          # node copies sak-theme for sakctl, nextest writes the junit reports
          - part: cli
            tools: rust node github:nextest-rs/nextest
            reports: sak-cli/*/target/nextest/default/junit.xml
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # sakctl builds against webkitgtk
      - if: matrix.part == 'cli'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1
      - uses: jdx/mise-action@v5
        with:
          install_args: ${{ matrix.tools }}
      - if: matrix.part != 'cli'
        uses: gradle/actions/setup-gradle@v6
      - if: matrix.part != 'cli'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      - if: matrix.part == 'cli'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sak-cli/src-tauri -> target
            sak-cli/cloud -> target
          key: test-unit
      - run: mise run test:${{ matrix.part }}:unit
      - if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: unit tests (${{ matrix.part }})
          report_paths: ${{ matrix.reports }}
          require_tests: true
          detailed_summary: true

  sak-backend-images:
    name: sak-backend-images (${{ matrix.image }})
    needs: test-unit
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks <tasks>:test and <tasks>:push of the root mise.toml
        include:
          - image: backend
            tasks: backend:image
          - image: ingress
            tasks: ingress:docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the backend's distribution comes from gradle, which builds the frontend with npm
      - uses: jdx/mise-action@v5
        with:
          install_args: java node
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the cache of the images may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ${{ matrix.tasks }}:test
      - if: github.ref_type == 'tag'
        run: mise run ${{ matrix.tasks }}:push

  sak-cli-images:
    name: sak-cli-images (${{ matrix.image }})
    needs: test-unit
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks cli:<image>:test and cli:<image>:push
        image: [image, canary]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the images and their cache may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run cli:${{ matrix.image }}:test
      - if: github.ref_type == 'tag'
        run: mise run cli:${{ matrix.image }}:push

  # sakctl for each platform (mise run cli:build:<platform>): the window and the command line in
  # one native binary with the page built in, no installers, zipped as
  # sak-cli-<platform>-<VERSION>.zip and uploaded as that file, its sha-256 next to it
  # (<zip>.sha256). Nothing is signed: macOS and windows warn on the first start
  sakctl:
    name: sakctl (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1
      # the tools are installed after the action, saved to its cache in its post step
      - uses: jdx/mise-action@v5
        with:
          install: false
          cache_save_post: true
      - run: mise install rust node npm:@tauri-apps/cli
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sak-cli/src-tauri -> target
          key: ${{ matrix.platform }}
      - run: mise run cli:build:${{ matrix.platform }}
      # the zip as it is, named like the file; a zip of the artifact would lose the executable bit
      - uses: actions/upload-artifact@v7
        with:
          path: sak-cli/build/sak-cli-${{ matrix.platform }}-*.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: sak-cli/build/sak-cli-${{ matrix.platform }}-*.zip.sha256
          archive: false
          if-no-files-found: error

  # the site of docs/ (site/, hugo and the theme relearn); a link that does not resolve fails it, on
  # a pull request too. The address of the pages is its base url, the installation gets the
  # checksums of the zips of sakctl (mise run docs:data)
  docs-build:
    needs: sakctl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # go fetches the theme, a hugo module
      - uses: jdx/mise-action@v5
        with:
          install_args: hugo-extended go
      - uses: actions/download-artifact@v8
        with:
          pattern: sak-cli-*.sha256
          path: sak-cli/build
          merge-multiple: true
      - id: pages
        if: github.ref_type == 'tag'
        uses: actions/configure-pages@v6
      - run: mise run docs:build
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
      - if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  # from a tag v<version> only, when all images and all zips of sakctl are built: the images pushed
  # as <VERSION>-rc as <VERSION> (mise run release:docker), the zips and their checksums as the
  # github release of the tag (mise run cli:release), where the installation downloads them
  release:
    if: github.ref_type == 'tag'
    needs: [sak-backend-images, sak-cli-images, sakctl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      - uses: docker/setup-buildx-action@v4
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run release:docker
      # the zips as they are; without skip-decompress they would be extracted
      - uses: actions/download-artifact@v8
        with:
          pattern: sak-cli-*
          path: sak-cli/build
          merge-multiple: true
          skip-decompress: true
      - run: ls -l sak-cli/build
      - run: mise run cli:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the site of the job docs-build as the github pages of the repository, from a tag v<version>
  # only, after the release: its installation downloads the zips of that release
  docs-publish:
    if: github.ref_type == 'tag'
    needs: [docs-build, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
