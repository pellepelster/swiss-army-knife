# tests and builds everything: the unit tests of the backend, the frontend and the cli first, then,
# when they are green, the images of the server (sak-backend-images: sak-backend and sak-ingress)
# and of sak-cli (sak-cli-images: the tools and the canary), each in a job of its own, sakctl as a
# native binary for linux, macOS and windows, and
# the documentation of docs/ as a site. A push to main pushes the images to ghcr.io as latest; the
# build of a tag v<version> (mise run release) publishes: the images pushed as <VERSION>-rc, then
# all of them as <VERSION> (release), and after the release the documentation as the github pages
# of the repository. Every image pushed is signed with cosign, keyless, as the workflow at its ref.
# Cached: the mise tools, gradle, npm, cargo (written by main only) and the docker layers (in the
# registry). Every action is pinned to the commit of its version (renovate moves the pins), and the
# actions of others are few: a moved tag of an action runs nothing here, the jobs sign the releases
# and the images.
name: swiss-army-knife

on:
  push:
    branches: [main]
    # v0.0.0 is the start of the versions of svu (mise run release), never a release
    tags: ['v*', '!v0.0.0']
  pull_request:
  workflow_dispatch:

# contents: read only; the jobs that push images or publish declare their own permissions, the
# others get no token that writes anything (e.g. the build cache of the images, which a push
# reads)
permissions:
  contents: read

# one run at a time per branch, a newer push cancels the run before: only the newest commit
# counts, and the images are never pushed by two runs at once (an older run can not overwrite
# latest after a newer one)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # the tag v<version> of a release, mise.toml takes the v off; latest for every other build
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
  # each job installs the tools it needs only, not every tool of the mise.toml files
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # what sakctl builds against on linux, webkitgtk for its window
  SAKCTL_APT_PACKAGES: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
  # the target directories stay small enough for the cache: no incremental builds, the debug info of
  # the tests only for the lines of a backtrace (the release profile strips everything)
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # the unit tests of the backend, the frontend and the cli (mise run <part>:test:unit), each in a
  # job of its own. The images are built only when all of them are green
  test-unit:
    name: test-unit (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # the jdk of the gradle toolchain, node for the frontend the build calls npm for
          - part: backend
            tools: java node
          - part: frontend
            tools: java node
          # node copies sak-theme for sakctl, nextest runs the tests
          - part: cli
            tools: rust node github:nextest-rs/nextest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.part == 'cli'
        run: sudo apt-get update -q && sudo apt-get install -q -y --no-install-recommends $SAKCTL_APT_PACKAGES
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: ${{ matrix.tools }}
      - if: matrix.part != 'cli'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: matrix.part != 'cli'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      # the downloads of cargo and the target directories, by the version of rust and the lockfiles,
      # without a fallback to an older key (a target restored from one would only grow); only a push
      # to main saves, so a pull request writes no cache a release could read
      - if: matrix.part == 'cli'
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'cli'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sak-cli/src-tauri/target
            sak-cli/cloud/target
          key: rust-test-unit-${{ steps.rust.outputs.version }}-${{ hashFiles('sak-cli/src-tauri/Cargo.lock', 'sak-cli/cloud/Cargo.lock') }}
      - run: mise run ${{ matrix.part }}:test:unit
      - if: matrix.part == 'cli' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sak-cli/src-tauri/target
            sak-cli/cloud/target
          key: rust-test-unit-${{ steps.rust.outputs.version }}-${{ hashFiles('sak-cli/src-tauri/Cargo.lock', 'sak-cli/cloud/Cargo.lock') }}

  sak-backend-images:
    name: sak-backend-images (${{ matrix.image }})
    needs: test-unit
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks <tasks>:test and <tasks>:push of the root mise.toml
        include:
          - image: backend
            tasks: backend:image
          - image: ingress
            tasks: ingress:image
    # the id token of the job signs its images (mise run image:sign)
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the backend's distribution comes from gradle, which builds the frontend with npm
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java node
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('sak-frontend/package-lock.json') }}
          restore-keys: npm-
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # a builder of buildx in a container: it builds both platforms and writes the cache
      - run: docker buildx create --use --driver docker-container
      # the cache of the images may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ${{ matrix.tasks }}:test
      # a tag as <VERSION>-rc, main as latest; signed as the workflow at the tag or at main
      - if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: mise install cosign && mise run ${{ matrix.tasks }}:push
        env:
          # empty for a tag: the push tasks push <VERSION>-rc
          SAK_PUSH_TAG: ${{ github.ref_type != 'tag' && 'latest' || '' }}

  sak-cli-images:
    name: sak-cli-images (${{ matrix.image }})
    needs: test-unit
    strategy:
      fail-fast: false
      matrix:
        # the mise tasks <image>:image:test and <image>:image:push
        image: [tools, canary]
    # the id token of the job signs its images (mise run image:sign)
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
      # arm64 is built with qemu, buildx pushes both platforms under one tag
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # a builder of buildx in a container: it builds both platforms and writes the cache
      - run: docker buildx create --use --driver docker-container
      # the images and their cache may be private
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run ${{ matrix.image }}:image:test
      # a tag as <VERSION>-rc, main as latest; signed as the workflow at the tag or at main
      - if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: mise install cosign && mise run ${{ matrix.image }}:image:push
        env:
          # empty for a tag: the push tasks push <VERSION>-rc
          SAK_PUSH_TAG: ${{ github.ref_type != 'tag' && 'latest' || '' }}

  # sakctl for each platform (mise run cli:build:<platform>): the window and the command line in
  # one native binary with the page built in (on windows two: sakctl.exe for the window and
  # sakctl-cli.exe, a console program, for the command line), no installers, zipped as
  # sak-cli-<platform>-<architecture>-<VERSION>.zip and uploaded as that file, its sha-256 next to it
  # (<zip>.sha256). The programs are not signed for macOS and windows, they warn on the first start;
  # the release signs the zips with cosign
  sakctl:
    name: sakctl (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.platform == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -q -y --no-install-recommends $SAKCTL_APT_PACKAGES
      # the tools are installed after the action, saved to its cache in its post step
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
          cache_save_post: true
      - run: mise install rust node npm:@tauri-apps/cli
      # as in test-unit: by the version of rust and the lockfile, saved by a push to main only
      - id: rust
        run: echo "version=$(mise exec -- rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sak-cli/src-tauri/target
          key: rust-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-${{ hashFiles('sak-cli/src-tauri/Cargo.lock') }}
      - run: mise run cli:build:${{ matrix.platform }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sak-cli/src-tauri/target
          key: rust-${{ matrix.platform }}-${{ steps.rust.outputs.version }}-${{ hashFiles('sak-cli/src-tauri/Cargo.lock') }}
      # the zip as it is, named like the file; a zip of the artifact would lose the executable bit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: sak-cli/build/sak-cli-${{ matrix.platform }}-*.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: sak-cli/build/sak-cli-${{ matrix.platform }}-*.zip.sha256
          archive: false
          if-no-files-found: error

  # the android apps (android/): their tests, their release apks and their bundles for google play on
  # every build, unsigned, so a broken release build shows before a tag; a tag also needs them. The apks and their checksums are
  # one artifact, the bundles and the maps of r8 another
  sak-android-apps:
    runs-on: ubuntu-24.04
    # unsigned also on a tag, where the tasks would refuse a version without the keystore; the
    # signed build of a tag is sak-android-apps-release
    env:
      ANDROID_UNSIGNED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run android:sdk:build
      - run: mise run android:test
      - run: mise run android:release:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks-unsigned
          path: |
            android/build/sak-*.apk
            android/build/sak-*.apk.sha256
          if-no-files-found: error
      # the bundles for google play and the maps of r8, uploaded to the play console by hand
      - run: mise run android:play:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-play-unsigned
          path: |
            android/build/sak-*.aab
            android/build/sak-*-mapping.txt
          if-no-files-found: error

  # the same on a tag, signed: the keystore is a secret of the environment release, which only a
  # job of a tag v* gets, so no other job and no other build sees it (mise run github:secrets:update)
  sak-android-apps-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: java
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: mise run android:sdk:build
      - run: mise run android:test
      - run: mise run android:release:build
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: |
            android/build/sak-*.apk
            android/build/sak-*.apk.sha256
          if-no-files-found: error
      # the bundles for google play and the maps of r8, uploaded to the play console by hand
      - run: mise run android:play:build
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-play
          path: |
            android/build/sak-*.aab
            android/build/sak-*-mapping.txt
          if-no-files-found: error

  # the site of docs/ (site/, hugo and the theme relearn); a link that does not resolve fails it, on
  # a pull request too. The address of the pages is its base url, the installation gets the
  # checksums of the zips of sakctl (mise run docs:data)
  docs-build:
    needs: sakctl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # go fetches the theme, a hugo module
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: hugo-extended go
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sak-cli-*.sha256
          path: sak-cli/build
          merge-multiple: true
      - id: pages
        if: github.ref_type == 'tag'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: mise run docs:build
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
      - if: github.ref_type == 'tag'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  # from a tag v<version> only, when all images, all zips of sakctl and the apks are built: the images
  # pushed as <VERSION>-rc as <VERSION> (mise run release:docker), the zips, their checksums and their
  # cosign signatures (keyless, with the id token of the job) as the github release of the tag (mise
  # run cli:release), where the installation downloads them, and
  # the signed apks of the android apps with their checksums and their bundles for google play (mise
  # run android:release)
  release:
    if: github.ref_type == 'tag'
    needs: [sak-backend-images, sak-cli-images, sakctl, sak-android-apps, sak-android-apps-release, docs-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: false
      # docker buildx imagetools copies the manifests in the registry, it needs no builder
      - run: mise run registry:login
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run release:docker
      # the zips as they are; without skip-decompress they would be extracted
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sak-cli-*
          path: sak-cli/build
          merge-multiple: true
          skip-decompress: true
      - run: ls -l sak-cli/build
      - run: mise install cosign
      - run: mise run cli:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apks
          path: android/build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-play
          path: android/build
      - run: ls -l android/build
      - run: mise run android:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # the site of the job docs-build as the github pages of the repository, from a tag v<version>
  # only, after the release: its installation downloads the zips of that release
  docs-publish:
    if: github.ref_type == 'tag'
    needs: [docs-build, release]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
