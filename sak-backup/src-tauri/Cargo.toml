[package]
name = "sak-backup"
version = "0.1.0"
description = "The backups of a SAK instance"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
serde = { version = "1", features = ["derive"] }
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
# the sign-in through the browser, the texts and the desktop entry, shared with sakadm
sak-desktop-shared = { path = "../../sak-desktop-shared" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
