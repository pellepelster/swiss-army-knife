[tools]
# the jdk of the gradle toolchain
java = "temurin-25.0.5+8.0.LTS"
# sak-frontend, called by the gradle build
node = "22.23.4"
# linux and macOS only; sakctl itself runs ansible in the tools image
"pipx:ansible-core" = { version = "2.21.5", os = ["linux", "macos"] }
pipx = { version = "1.18.7", os = ["linux", "macos"] }
# the icon font of sak-frontend cut to the icons it uses (frontend:icons), woff2 needs brotli
"pipx:fonttools" = { version = "4.68.0", extras = "woff", os = ["linux", "macos"] }
# sakctl (sak-cli): tauri 2, the rust core in src-tauri/, the web ui in ui/; the tauri command line is
# an npm package of sak-cli/package.json, installed by its lockfile (cli:install)
rust = "1.99.1"
# the docs site (site/), go for the hugo modules
"hugo-extended" = "0.169.0"
go = "1.27.3"
# the rust tests
"github:nextest-rs/nextest" = { version = "0.9.150", version_prefix = "cargo-nextest-" }
# the next version for `release`, from the tags v<version>
svu = "3.4.1"
# the signatures of the zips of sakctl (cli:release), keyless with a certificate of the workflow
cosign = "3.1.4"

# the version of all artifacts (#127): the tag v<version> in the workflow without the v, latest
# otherwise
[env]
VERSION = "{{ get_env(name='VERSION', default='latest') | trim_start(pat='v') }}"

# the images on ghcr.io: the server (backend, ingress) and sakctl's tools and container runtime canary
[vars]
backend_image = "ghcr.io/pellepelster/sak-backend"
ingress_image = "ghcr.io/pellepelster/sak-ingress"
cli_image = "ghcr.io/pellepelster/sak-cli-tools"
cli_canary = "ghcr.io/pellepelster/sak-cli-docker-canary"
# the certificate of the key of the android apps, android:release:build and android:play:build check it
android_cert_sha256 = "546205591d3d1ad2e3b10e38f2ef8ce154eb19b543125a5ea6c7bf2ef9890679"

# REGISTRY_USERNAME and REGISTRY_PASSWORD: a github user and a token with write:packages
# (github.actor and GITHUB_TOKEN in the workflow)
[tasks."registry:login"]
description = "Log in to ghcr.io"
run = """
if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
  echo "set REGISTRY_USERNAME and REGISTRY_PASSWORD to log in to ghcr.io" >&2
  exit 1
fi
printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
"""

# the images: <image>:image:build|test|push, each on its own (the workflow runs them in parallel).
# build loads the image of this platform into the local images, push builds amd64 and arm64 (the
# other platform needs qemu) as SAK_PUSH_TAG (<VERSION>-rc unless set; the workflow pushes main as
# latest) and the commit, and signs it in the workflow (image:sign); release:docker makes it
# <VERSION>. The layers are cached in the registry as tag buildcache, read by every build, written
# by push
[tasks."backend:image:build"]
description = "Build the sak-backend image"
run = """
./gradlew :sak-backend:installDist
docker buildx build --load --tag {{vars.backend_image}}:latest \
  --cache-from type=registry,ref={{vars.backend_image}}:buildcache sak-backend
"""

[tasks."backend:image:test"]
description = "Test the sak-backend image"
depends = ["backend:image:build"]
run = """
set -e
image={{vars.backend_image}}:latest
[ "$(docker run --rm --entrypoint id "$image" -u)" = "10000" ]
docker run --rm --entrypoint java "$image" -version
docker run --rm --entrypoint test "$image" -x /opt/sak-backend/bin/sak-backend
echo "the image of sak-backend works"
"""

[tasks."backend:image:push"]
description = "Push the sak-backend image"
run = """
set -eu
metadata=$(mktemp)
./gradlew :sak-backend:installDist
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" \
  --tag {{vars.backend_image}}:${SAK_PUSH_TAG:-${VERSION}-rc} --tag {{vars.backend_image}}:$(git rev-parse --short=12 HEAD) \
  --metadata-file "$metadata" \
  --cache-from type=registry,ref={{vars.backend_image}}:buildcache \
  --cache-to type=registry,ref={{vars.backend_image}}:buildcache,mode=max,image-manifest=true \
  --push sak-backend
IMAGE={{vars.backend_image}} METADATA="$metadata" mise run image:sign
"""

[tasks."ingress:image:build"]
description = "Build the sak-ingress image"
run = """
docker buildx build --load --tag {{vars.ingress_image}}:latest \
  --cache-from type=registry,ref={{vars.ingress_image}}:buildcache sak-ingress
"""

[tasks."ingress:image:test"]
description = "Test the sak-ingress image"
depends = ["ingress:image:build"]
run = """
set -e
image={{vars.ingress_image}}:latest
[ "$(docker run --rm --entrypoint id "$image" -u)" = "10000" ]
docker run --rm "$image" version
docker run --rm "$image" validate --config /etc/caddy/Caddyfile --adapter caddyfile
echo "the image of sak-ingress works"
"""

[tasks."ingress:image:push"]
description = "Push the sak-ingress image"
run = """
set -eu
metadata=$(mktemp)
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" \
  --tag {{vars.ingress_image}}:${SAK_PUSH_TAG:-${VERSION}-rc} --tag {{vars.ingress_image}}:$(git rev-parse --short=12 HEAD) \
  --metadata-file "$metadata" \
  --cache-from type=registry,ref={{vars.ingress_image}}:buildcache \
  --cache-to type=registry,ref={{vars.ingress_image}}:buildcache,mode=max,image-manifest=true \
  --push sak-ingress
IMAGE={{vars.ingress_image}} METADATA="$metadata" mise run image:sign
"""

# sakctl on linux needs the webkitgtk headers, on debian/ubuntu:
# sudo apt install libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

# only when package.json or package-lock.json changed
[tasks."theme:install"]
description = "Install the npm dependencies of sak-theme"
dir = "{{config_root}}/sak-theme"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
shell = "bash -c"
run = "npm ci --no-audit --no-fund"

# as the gradle build does, only when package.json or package-lock.json changed
[tasks."frontend:install"]
description = "Install the npm dependencies of sak-frontend"
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:npmCi"

# into sak-frontend/dist/, what the backend jar contains
[tasks."frontend:build"]
description = "Build sak-frontend"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:npmBuild"

# into sak-cli/ui/theme/ (not committed): tauri bundles only sak-cli/ui/
[tasks."cli:theme"]
description = "Copy sak-theme into the sakctl ui"
depends = ["theme:install"]
dir = "{{config_root}}/sak-cli"
# bash on windows too (git bash), where mise would run cmd
shell = "bash -c"
run = """
rm -rf ui/theme
mkdir -p ui/theme
cp ../sak-theme/node_modules/bootstrap/dist/css/bootstrap.min.css ui/theme/
cp ../sak-theme/tokens.css ../sak-theme/bootstrap.css ../sak-theme/fonts.css ../sak-theme/components.css ui/theme/
cp -r ../sak-theme/fonts ui/theme/fonts
cp -r ../sak-theme/icons ui/theme/icons
cp -r ../sak-theme/images/sakctl ui/theme/images
"""

# the tauri command line of sak-cli/package.json, exactly as its lockfile has it, with its dependencies
# (SC-10): its build makes the binaries of sakctl, which become the signed zips
[tasks."cli:install"]
description = "Install the tauri command line of sakctl"
dir = "{{config_root}}/sak-cli"
run = "npm ci --no-audit --no-fund"

# the ui without arguments, the command line with them: `mise run cli:run -- --help`. tauri dev
# hands what follows its second -- to the app. HCLOUD_TOKEN from pass unless set
[tasks."cli:run"]
description = "Run sakctl with reload"
depends = ["cli:install", "cli:theme"]
dir = "{{config_root}}/sak-cli"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
run = '''sh -c 'if [ $# -eq 0 ]; then npx --no-install tauri dev; else npx --no-install tauri dev -- -- "$@"; fi' sakctl'''

# the installers of this platform (deb, rpm, AppImage; dmg; msi, nsis) in
# src-tauri/target/release/bundle/
[tasks."cli:build"]
description = "Build the sakctl installers"
depends = ["cli:install", "cli:theme", "tools:image:build", "canary:image:build"]
dir = "{{config_root}}/sak-cli"
run = "npx --no-install tauri build"

# cli:build:<platform>, on that platform (workflow job sakctl): the binary zipped to
# sak-cli/build/sak-cli-<platform>-<architecture>-<VERSION>.zip and its <zip>.sha256; x86_64, a
# universal binary for macOS
[tasks."cli:build:linux"]
description = "Build sakctl for linux"
depends = ["cli:install", "cli:theme"]
dir = "{{config_root}}/sak-cli"
run = """
npx --no-install tauri build --no-bundle
mkdir -p build
rm -f "build/sak-cli-linux-x86_64-${VERSION}.zip"
zip -j "build/sak-cli-linux-x86_64-${VERSION}.zip" src-tauri/target/release/sakctl
(cd build && sha256sum "sak-cli-linux-x86_64-${VERSION}.zip" > "sak-cli-linux-x86_64-${VERSION}.zip.sha256")
"""

[tasks."cli:build:macos"]
description = "Build sakctl for macOS"
depends = ["cli:install", "cli:theme"]
dir = "{{config_root}}/sak-cli"
run = """
rustup target add aarch64-apple-darwin x86_64-apple-darwin
npx --no-install tauri build --target universal-apple-darwin --no-bundle
mkdir -p build
rm -f "build/sak-cli-macos-universal-${VERSION}.zip"
zip -j "build/sak-cli-macos-universal-${VERSION}.zip" src-tauri/target/universal-apple-darwin/release/sakctl
(cd build && shasum -a 256 "sak-cli-macos-universal-${VERSION}.zip" > "sak-cli-macos-universal-${VERSION}.zip.sha256")
"""

# git bash has no zip but 7-Zip; -e stops at a failed step like sh does elsewhere. Two programs in
# the zip: sakctl.exe, the window without a console, and sakctl-cli.exe, the same built with the
# feature console as a console program, whose commands print to the terminal
[tasks."cli:build:windows"]
description = "Build sakctl for windows"
depends = ["cli:install", "cli:theme"]
dir = "{{config_root}}/sak-cli"
shell = "bash -e -c"
run = """
mkdir -p build
npx --no-install tauri build --no-bundle --features console
cp src-tauri/target/release/sakctl.exe build/sakctl-cli.exe
npx --no-install tauri build --no-bundle
rm -f "build/sak-cli-windows-x86_64-${VERSION}.zip"
7z a -tzip "build/sak-cli-windows-x86_64-${VERSION}.zip" ./src-tauri/target/release/sakctl.exe ./build/sakctl-cli.exe
(cd build && sha256sum "sak-cli-windows-x86_64-${VERSION}.zip" > "sak-cli-windows-x86_64-${VERSION}.zip.sha256")
"""

# the zips of cli:build:<platform> and their checksums as the github release v<VERSION>, where the
# installation downloads them; needs gh and GH_TOKEN with contents: write (workflow job release)
# each zip signed with cosign, keyless: a short-lived certificate of sigstore for the workflow run
# of the tag (its id token, permission id-token: write), the signature and the certificate in
# <zip>.sigstore.json. Each signature is verified for the identity the installation names and
# against the trusted root of sigstore that sakctl embeds (sak-cli/src-tauri/trusted_root.json, the
# one sakctl update verifies with), so a root cosign knows but sakctl does not fails the release
# here, not the users
[tasks."cli:release"]
description = "Publish the GitHub release of sakctl"
dir = "{{config_root}}/sak-cli"
run = """
set -eu
identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/swiss-army-knife.yml@${GITHUB_REF}"
files=""
for platform in linux-x86_64 macos-universal windows-x86_64; do
  zip="build/sak-cli-${platform}-${VERSION}.zip"
  [ -f "$zip" ] && [ -f "$zip.sha256" ] || { echo "$zip or its checksum is missing" >&2; exit 1; }
  cosign sign-blob --yes --bundle "$zip.sigstore.json" "$zip"
  cosign verify-blob --bundle "$zip.sigstore.json" --certificate-identity "$identity" \
    --certificate-oidc-issuer https://token.actions.githubusercontent.com \
    --trusted-root {{config_root}}/sak-cli/src-tauri/trusted_root.json "$zip"
  files="$files $zip $zip.sha256 $zip.sigstore.json"
done
# created once; a release that failed halfway runs again, its files are replaced
if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
  gh release create "v${VERSION}" --verify-tag --title "SAK $VERSION" \
    --notes "sakctl for linux, macOS and windows and the android apps of the grocery lists, the notes and the todo lists, built from $(git rev-parse --short=12 HEAD)."
fi
gh release upload "v${VERSION}" $files --clobber
"""

# the command line without the ui: `mise run cli:sakctl -- --help`. HCLOUD_TOKEN from pass
# unless set
[tasks."cli:sakctl"]
description = "Run the sakctl command line"
dir = "{{config_root}}/sak-cli/src-tauri"
# the terminal itself: password prompts and ssh need it
raw = true
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
run = '''sh -c 'cargo run -q -- "$@"' sakctl'''

# the context is the repository: the image contains the ansible collection of ansible/
[tasks."tools:image:build"]
description = "Build the tools image"
dir = "{{config_root}}/sak-cli"
run = """
docker buildx build --load --file Dockerfile --tag {{vars.cli_image}}:latest \
  --cache-from type=registry,ref={{vars.cli_image}}:buildcache ..
"""

[tasks."tools:image:test"]
description = "Test the tools image"
depends = ["tools:image:build"]
run = """
set -e
image={{vars.cli_image}}:latest
[ "$(docker run --rm "$image" id -u):$(docker run --rm "$image" id -g)" = "1000:1000" ]
[ "$(docker run --rm "$image" id -un)" = "sak" ]
docker run --rm "$image" ansible --version
docker run --rm "$image" ansible-galaxy collection list community.general
docker run --rm "$image" ansible-galaxy collection list pelle_io.sak | grep -q "^pelle_io.sak "
docker run --rm "$image" ansible-playbook --list-tasks pelle_io.sak.backend | grep -q "pelle_io.sak.backend :"
docker run --rm "$image" ansible-playbook --list-tasks pelle_io.sak.server | grep -q "pelle_io.sak.storage :"
docker run --rm "$image" ansible localhost -m ping
# the callback posts the events of a run with its token
docker run --rm -v "{{config_root}}/sak-cli/image-test:/test:ro" "$image" sh /test/callback.sh
echo "the image of the tools works"
"""

[tasks."tools:image:push"]
description = "Push the tools image"
dir = "{{config_root}}/sak-cli"
run = """
set -eu
metadata=$(mktemp)
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" --file Dockerfile \
  --tag {{vars.cli_image}}:${SAK_PUSH_TAG:-${VERSION}-rc} --tag {{vars.cli_image}}:$(git rev-parse --short=12 HEAD) \
  --metadata-file "$metadata" \
  --cache-from type=registry,ref={{vars.cli_image}}:buildcache \
  --cache-to type=registry,ref={{vars.cli_image}}:buildcache,mode=max,image-manifest=true \
  --push ..
IMAGE={{vars.cli_image}} METADATA="$metadata" mise run image:sign
"""

[tasks."canary:image:build"]
description = "Build the canary image"
dir = "{{config_root}}/sak-cli/canary"
run = """
docker buildx build --load --tag {{vars.cli_canary}}:latest \
  --cache-from type=registry,ref={{vars.cli_canary}}:buildcache .
"""

[tasks."canary:image:test"]
description = "Test the canary image"
depends = ["canary:image:build"]
run = """
[ "$(docker run --rm {{vars.cli_canary}}:latest)" = "sak-cli-docker-canary" ]
echo "the canary works"
"""

[tasks."canary:image:push"]
description = "Push the canary image"
dir = "{{config_root}}/sak-cli/canary"
run = """
set -eu
metadata=$(mktemp)
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" \
  --tag {{vars.cli_canary}}:${SAK_PUSH_TAG:-${VERSION}-rc} --tag {{vars.cli_canary}}:$(git rev-parse --short=12 HEAD) \
  --metadata-file "$metadata" \
  --cache-from type=registry,ref={{vars.cli_canary}}:buildcache \
  --cache-to type=registry,ref={{vars.cli_canary}}:buildcache,mode=max,image-manifest=true \
  --push .
IMAGE={{vars.cli_canary}} METADATA="$metadata" mise run image:sign
"""

# tags and pushes the next patch version, which the workflow builds and releases; only from a clean
# main equal to origin/main. The docs are built first, a broken link stops it
[tasks."release"]
description = "Tag and push the next release"
depends = ["docs:build"]
run = """
set -eu
[ -z "$(git status --porcelain)" ] || { echo "the repository is not clean" >&2; exit 1; }
[ "$(git branch --show-current)" = main ] || { echo "a release is made from main only" >&2; exit 1; }
git fetch --tags origin main
[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "main is not the same as origin/main" >&2; exit 1; }
version=$(svu patch)
# signed: the ruleset of the tags v* takes no other
git tag -s "$version" -m "Release $version"
git push origin "$version"
echo "tagged $version, the workflow builds and releases it"
"""

# the image IMAGE as buildx pushed it (its --metadata-file METADATA) signed with cosign, keyless:
# a short-lived certificate of sigstore for the workflow run (its id token, permission
# id-token: write), the signature next to the digest in the registry. Verified for the identity
# sakctl checks before it pulls the image, against the trusted root sakctl embeds. Outside of the
# workflow nothing is signed: a push from a machine of a developer has no id token of the workflow
[tasks."image:sign"]
description = "Sign a pushed image with cosign, in the workflow only"
run = """
set -eu
if [ -z "${GITHUB_ACTIONS:-}" ]; then
  echo "$IMAGE is not signed, only the workflow signs"
  exit 0
fi
digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$METADATA")
cosign sign --yes "$IMAGE@$digest"
cosign verify --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/swiss-army-knife.yml@${GITHUB_REF}" \
  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  --trusted-root {{config_root}}/sak-cli/src-tauri/trusted_root.json "$IMAGE@$digest" >/dev/null
echo "signed $IMAGE@$digest"
"""

[tasks."image:all:build"]
description = "Build all images"
depends = ["backend:image:build", "ingress:image:build", "tools:image:build", "canary:image:build"]

# needs registry:login; SAK_DOCKER_PLATFORMS selects other platforms than amd64 and arm64
[tasks."image:all:push"]
description = "Push all images as <VERSION>-rc"
depends = ["backend:image:push", "ingress:image:push", "tools:image:push", "canary:image:push"]

# the registry copies the manifests, nothing is pulled; after all images are pushed (workflow job
# release)
[tasks."release:docker"]
description = "Release the <VERSION>-rc images as <VERSION>"
run = """
for image in {{vars.backend_image}} {{vars.ingress_image}} {{vars.cli_image}} {{vars.cli_canary}}; do
  docker buildx imagetools create --tag "$image:${VERSION}" "$image:${VERSION}-rc"
done
"""

# config/local-compose.yaml in the foreground until Ctrl-C: the ingress on 80 and 443 (admin 2019),
# victorialogs 9428, mailpit 1025 (smtp) and 8025 (web ui)
[tasks."local:env:run"]
description = "Run ingress, victorialogs and mailpit"
run = """
# before docker creates them owned by root
mkdir -p "$SAK_LOCAL_DATA_DIR/s3" "$SAK_LOCAL_DIR/ingress/log" "$SAK_LOCAL_DIR/victorialogs" "$SAK_LOCAL_DIR/vector"
export SAK_LOCAL_UID=$(id -u) SAK_LOCAL_GID=$(id -g)
export SAK_VICTORIALOGS_IMAGE=$(sed -n 's/^backend_victorialogs_image: //p' ansible/roles/backend/defaults/main.yml)
export SAK_VECTOR_IMAGE=$(sed -n 's/^backend_vector_image: //p' ansible/roles/backend/defaults/main.yml)
compose="docker compose -f {{config_root}}/config/local-compose.yaml"
$compose up -d --build --wait --remove-orphans
# sh skips the exit trap on a signal, so Ctrl-C takes the services down too
trap "docker compose -p sak-local down" EXIT
trap "exit 130" INT TERM
echo "the services are up"
$compose logs -f
"""

[tasks."local:env:run".env]
SAK_LOCAL_DIR = "{{config_root}}/build/local"
SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data"

# on 8080; local:frontend:run on 4200 proxies /api to it
[tasks."local:backend:run"]
description = "Run sak-backend"
run = """
if curl -s -o /dev/null --max-time 2 http://localhost:8080/; then
  echo "a backend runs already on http://localhost:8080, stop it first" >&2
  exit 1
fi
mkdir -p "$SAK_LOCAL_DATA_DIR"
./gradlew :sak-backend:run --args="-config={{config_root}}/config/local-config.yaml"
"""

[tasks."local:backend:run".env]
SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data"
SAK_IPV4 = "192.0.2.1"
# the argon2id hash of `a password of sixteen`, the password login of the local backend
SAK_LOCAL_ADMIN_PASSWORD_HASH = "$argon2id$v=19$m=65536,t=3,p=1$al/AGZtQJD5CTnS21yvIXg$L7n0a0d/Gu4awCZm7tuz99SWhVvUedmj0UABpTBu6l4"

# the database, the files and the buckets; the directories stay for the mounts of local:env:run, the
# state of caddy and the logs stay too
[tasks."local:clean"]
description = "Remove the data of the local backend"
env = { SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data" }
run = """
if curl -s -o /dev/null --max-time 2 http://localhost:8080/; then
  echo "a backend runs on http://localhost:8080, stop it first" >&2
  exit 1
fi
if [ -d "$SAK_LOCAL_DATA_DIR" ]; then
  find "$SAK_LOCAL_DATA_DIR" -mindepth 1 -not -type d -delete
  find "$SAK_LOCAL_DATA_DIR" -mindepth 1 -type d -empty -not -path "$SAK_LOCAL_DATA_DIR/s3" -delete
fi
echo "removed the data of the local backend in $SAK_LOCAL_DATA_DIR"
"""

[tasks."local:frontend:run"]
description = "Run sak-frontend"
depends = ["frontend:install"]
dir = "{{config_root}}/sak-frontend"
run = "npx ng serve"

# the data the sakctl ui shows in its screenshots and video (src/core/deployments/window_fixtures.rs)
[tasks."docs:window"]
description = "Prepare the sakctl ui fixtures"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli/src-tauri"
run = "cargo test window_fixtures -- --ignored"

# the version and the checksums of the zips of cli:build:<platform> for the installation page,
# site/data/sakctl.yaml; a platform without a zip shows <sha256>
[tasks."docs:data"]
description = "Write the sakctl data of the docs"
dir = "{{config_root}}/site"
run = """
set -eu
mkdir -p data
{
  echo "version: '$VERSION'"
  # latest has no tag
  [ "$VERSION" = latest ] && echo "release: 'latest'" || echo "release: 'v$VERSION'"
  echo "checksums:"
  for platform in linux macos windows; do
    case "$platform" in macos) architecture=universal ;; *) architecture=x86_64 ;; esac
    checksum="../sak-cli/build/sak-cli-${platform}-${architecture}-${VERSION}.zip.sha256"
    [ -f "$checksum" ] && echo "  $platform: '$(cut -d ' ' -f 1 "$checksum")'"
  done
  true
} > data/sakctl.yaml
"""

# http://localhost:1313, fully rebuilt on every change so menus and links follow
[tasks."docs:serve"]
description = "Serve the docs"
depends = ["docs:data"]
dir = "{{config_root}}/site"
run = "hugo server --disableFastRender"

# into build/site; a broken link fails it
[tasks."docs:build"]
description = "Build the docs"
depends = ["docs:data"]
dir = "{{config_root}}/site"
run = "hugo --destination ../build/site --cleanDestinationDir --panicOnWarning"

# docs/screenshots/: the apps against local:run (desktop and phone), the sakctl ui (light and
# dark), its command line help and the android apps
[tasks."docs:screenshots"]
description = "Take the screenshots"
depends = ["docs:window", "android:screenshots"]
dir = "{{config_root}}"
run = [
  "cd sak-cli/src-tauri && cargo build",
  "./gradlew :sak-e2e:e2eScreenshots",
]

# build/videos/: the tours of the apps (against local:run) and of the sakctl ui as .webm, .mp4 and
# .gif; the sakctl tour also to docs/screenshots/ for the docs and the README
[tasks."docs:video"]
description = "Record the videos"
depends = ["docs:window"]
dir = "{{config_root}}"
run = '''
./gradlew :sak-e2e:e2eVideos
for video in build/videos/*.webm; do
  name="${video%.webm}"
  ffmpeg -v error -y -i "$video" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$name.mp4"
  ffmpeg -v error -y -i "$video" -vf "fps=10,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" "$name.gif"
done
ls -lh build/videos/*.mp4 build/videos/*.gif
# the README on github plays no video: a small gif (6 fps, 560 px wide)
cp build/videos/sakctl-ui.mp4 docs/screenshots/sakctl-ui.mp4
ffmpeg -v error -y -i build/videos/sakctl-ui.mp4 -vf "fps=6,scale=560:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4:diff_mode=rectangle" docs/screenshots/sakctl-ui.gif
'''

# the tests, <part>:test:<kind> (docs/development/architecture/SYSTEM.md, "Tests"): unit tests need
# only the tools above, integration tests the machine (docker, a browser, ssh-keygen), e2e tests a
# Hetzner Cloud project

# every gradle module, the build of sak-backend builds the frontend too
[tasks."backend:test:unit"]
description = "Run the backend unit tests"
dir = "{{config_root}}"
run = "./gradlew test"

# RecipeIngredientsTest: the photos of grocery/recipes at openrouter, a few cents a run. gradle
# reads OPENROUTER_API_KEY from pass unless set; OPENROUTER_MODEL selects another model
[tasks."backend:test:recipes"]
description = "Test the recipe prompt against OpenRouter"
dir = "{{config_root}}"
run = "./gradlew :sak-backend:test --tests '*RecipeIngredientsTest*' --rerun"

# openapi.json from the routes of sak-backend, the source of the android models and the frontend
# types; a test fails while it is out of date
[tasks."api:generate"]
description = "Generate openapi.json and the frontend api types"
dir = "{{config_root}}"
run = [
  "SAK_OPENAPI_WRITE=true ./gradlew :sak-backend:test --tests 'io.pelle.sak.backend.SakAppsTest' --rerun -q",
  "npm --prefix sak-frontend run api:types",
]

# the committed text files of the backend, the web apps, the android apps and sakctl; a test of
# sak-i18n fails while they are out of date
[tasks."i18n:generate"]
description = "Generate the texts of the apps from i18n/texts.yml"
dir = "{{config_root}}"
run = "./gradlew -q :sak-i18n:run --args=generate"

# gradle/verification-metadata.xml and android/gradle/verification-metadata.xml, the sha256 of every
# dependency and plugin of the two gradle builds, which gradle checks before it uses one (SC-9); after a
# dependency changed by hand, Renovate writes them with its updates. Resolves every configuration and
# builds what the workflow builds, so the dependencies of tasks are in it too
[tasks."gradle:verification"]
description = "Write the checksums of the dependencies of the gradle builds"
dir = "{{config_root}}"
run = """
./gradlew --no-configuration-cache -I gradle/resolve-all-dependencies.gradle --write-verification-metadata sha256 resolveAllDependencies assemble testClasses
cd android
ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew -I ../gradle/resolve-all-dependencies.gradle --write-verification-metadata sha256 resolveAllDependencies assembleDebug assembleGithubRelease bundlePlayRelease compileGithubDebugUnitTestKotlin
"""

# the icons of Font Awesome sak-frontend uses (sak-frontend/src/icons): their css and the solid font cut
# to them, from the names fa-<name> in sak-frontend/src/app; a spec fails while they are not current
[tasks."frontend:icons"]
description = "Generate the icon css and font of the frontend"
depends = ["frontend:install"]
dir = "{{config_root}}/sak-frontend"
run = "node scripts/icons.mjs"

[tasks."frontend:test:unit"]
description = "Run the frontend unit tests"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:npmTest"

# sakctl and sak-cloud (sak-cli/cloud/), without sakctl's modules named integration
[tasks."cli:test:unit"]
description = "Run the cli unit tests"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli"
run = """
set -e
(cd src-tauri && cargo nextest run --no-fail-fast -E 'not test(/::integration::/)')
(cd cloud && cargo nextest run --no-fail-fast -E 'kind(lib)')
"""

# in docker: the vector configuration of the backend role, sak-backend as the role renders it
# (backup, restore, maintenance) next to victorialogs, and the role role_markers
[tasks."backend:test:integration"]
description = "Run the backend integration tests"
dir = "{{config_root}}"
run = """
./gradlew :sak-backend:vectorTest
ansible/roles/backend/tests/sak-backend-test.sh
ansible/roles/role_markers/tests/role-markers-test.sh
"""

# the apps in chromium against the backend and a mailpit (docker)
[tasks."frontend:test:integration"]
description = "Run the frontend integration tests"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:e2eTest"

# sakctl's modules named integration: docker and podman (pulling the images from ghcr.io), ssh in the
# tools image, ssh-keygen
[tasks."cli:test:integration"]
description = "Run the cli integration tests"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli/src-tauri"
run = "cargo nextest run --no-fail-fast -E 'test(/::integration::/)'"

# sak-e2e: the apps in chromium against local:run
[tasks."frontend:test:local"]
description = "Run the frontend tests against local:run"
dir = "{{config_root}}"
run = "./gradlew :sak-e2e:e2eLocal"

# in the Hetzner Cloud project of HCLOUD_TOKEN, real servers (test-<id>), slow and not free: sak-cloud
# against the api, then sak-e2e with two deployments of sakctl (sak-e2e/README.md). HCLOUD_TOKEN from
# pass unless set; gradle reads the secrets of sak-e2e itself. The deployments run SAK_DOCKER_IMAGE_TAG,
# <VERSION>-rc unless set, which outside of CI the task builds and pushes first
[tasks."cli:test:e2e"]
description = "Run the cli e2e tests in Hetzner Cloud"
depends = ["cli:theme"]
dir = "{{config_root}}"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
run = """
set -e
[ -n "$HCLOUD_TOKEN" ] || { echo "set HCLOUD_TOKEN, refer to sak-e2e/README.md" >&2; exit 1; }
# a failing build stops before any server exists
(cd sak-cli/src-tauri && cargo build)
# amd64 for the servers and this machine's platform for the tools image
if [ -z "${CI:-}" ]; then
  case "$(uname -m)" in
    aarch64 | arm64) platform=linux/amd64,linux/arm64 ;;
    *) platform=linux/amd64 ;;
  esac
  mise run image:all:build
  SAK_DOCKER_PLATFORMS="${SAK_DOCKER_PLATFORMS:-$platform}" mise run image:all:push
fi
export SAK_DOCKER_IMAGE_TAG="${SAK_DOCKER_IMAGE_TAG:-${VERSION}-rc}"
# one at a time: the tests share their ssh key and names
(cd sak-cli/cloud && cargo nextest run --no-fail-fast --test-threads 1 -E 'kind(test)')
./gradlew :sak-e2e:e2eIntegration --console=plain
"""

# local:env:run, local:backend:run and local:frontend:run, each in its own process group with its
# log in build/local/logs; until Ctrl-C. frontend:install first, so the backend build and the dev
# server do not both install
[tasks."local:run"]
description = "Run everything locally"
depends = ["frontend:install"]
# for the array of process groups
shell = "bash -c"
run = '''
logs="{{config_root}}/build/local/logs"
mkdir -p "$logs"
pids=()

stop() {
  # mise passes Ctrl-C on again: ignored while stopping
  trap '' INT TERM
  trap - EXIT
  echo
  echo "stopping everything…"
  for pid in "${pids[@]}"; do kill -INT -- "-$pid" 2>/dev/null; done
  # gradle hands the backend to its daemon, which stops it once its client is gone
  for _ in $(seq 1 30); do
    alive=0
    for pid in "${pids[@]}"; do kill -0 -- "-$pid" 2>/dev/null && alive=1; done
    [ "$alive" = 0 ] && break
    sleep 0.5
  done
  for pid in "${pids[@]}"; do kill -KILL -- "-$pid" 2>/dev/null; done
  pkill -f 'io.pelle.sak.backend.SakBackendKt' 2>/dev/null
  docker compose -p sak-local down >/dev/null 2>&1
  echo "stopped"
}
trap stop INT TERM EXIT

# in its own process group, so stop() reaches everything it starts
start() {
  setsid mise run "$1" > "$logs/$1.log" 2>&1 < /dev/null &
  pids+=($!)
}

# waits for the line in the task's log, gives up when the task ends or after the seconds
await() {
  local task=$1 line=$2 seconds=$3 pid=$4
  for _ in $(seq 1 "$seconds"); do
    grep -q "$line" "$logs/$task.log" && return 0
    if ! kill -0 "$pid" 2>/dev/null; then
      echo "$task did not start, see $logs/$task.log" >&2
      return 1
    fi
    sleep 1
  done
  echo "$task did not start within $seconds seconds, see $logs/$task.log" >&2
  return 1
}

echo "starting the ingress, victorialogs and mailpit…"
start local:env:run
await local:env:run "the services are up" 300 "${pids[0]}" || exit 1

echo "starting the backend…"
start local:backend:run
await local:backend:run "Responding at" 600 "${pids[1]}" || exit 1

echo "starting the frontend…"
start local:frontend:run
await local:frontend:run "Local:" 180 "${pids[2]}" || exit 1

cat <<ADDRESSES

  frontend   http://localhost:4200   the apps
  backend    http://localhost:8080   api at /api/v1, swagger ui at /swagger/
  ingress    https://sak.localhost   the apps behind caddy, its certificate is caddy's own,
             https://api.localhost   their api at /v1 and the s3 api of the buckets
  mailpit    http://localhost:8025   every login link arrives here
  logs       http://localhost:9428   victorialogs, vector ships the access log of the ingress

  sign in as admin@localhost (config/local-config.yaml), open the link
  from mailpit in the same browser

  logs in $logs
  Ctrl-C stops everything

ADDRESSES
wait
'''

# android/: a gradle build of its own, a module for each app of android/apps.txt on top of core. The
# sdk is in $ANDROID_HOME, ~/Android/Sdk unless set; android:sdk installs it with the licenses accepted
[tasks."android:sdk"]
description = "Install the Android SDK"
# apksigner of the build tools checks the release apks
env = { ANDROID_BUILD_TOOLS = "36.0.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
sdk="${ANDROID_HOME:-$HOME/Android/Sdk}"
sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
if [ ! -x "$sdkmanager" ]; then
  tmp="$(mktemp -d)"
  trap 'rm -rf "$tmp"' EXIT
  curl -fsSL -o "$tmp/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
  echo "e025545c62a8e64c7559119566a569fb1dec5f60  $tmp/tools.zip" | sha1sum -c --quiet
  unzip -q "$tmp/tools.zip" -d "$tmp"
  mkdir -p "$sdk/cmdline-tools"
  mv "$tmp/cmdline-tools" "$sdk/cmdline-tools/latest"
fi
yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
"$sdkmanager" --sdk_root="$sdk" platform-tools "platforms;android-37.2" "build-tools;${ANDROID_BUILD_TOOLS}"
# no emulator for android:sdk:build
[ "${ANDROID_SDK_BUILD_ONLY:-}" = true ] || "$sdkmanager" --sdk_root="$sdk" emulator "system-images;android-36;google_apis;x86_64"
echo "the android sdk is in $sdk"
'''

# for the workflow
[tasks."android:sdk:build"]
description = "Install the Android SDK without the emulator"
env = { ANDROID_SDK_BUILD_ONLY = "true" }
run = "mise run android:sdk"

[tasks."android:build"]
description = "Build the android apps"
dir = "{{config_root}}/android"
run = 'ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew assembleDebug'

# android/build/sak-<app>-<VERSION>.apk (the flavor github) and its checksum for every app of
# android/apps.txt, signed with ANDROID_KEYSTORE (base64, github:secrets:update) or unsigned, which
# only VERSION=latest may be. Only the certificate ANDROID_CERT_SHA256 installs over the installed
# apps, a signed apk must have it
[tasks."android:release:build"]
description = "Build the release apks of the android apps"
dir = "{{config_root}}/android"
env = { ANDROID_CERT_SHA256 = "{{vars.android_cert_sha256}}" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
apps=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' apps.txt)
signed=false
if [ -n "${ANDROID_KEYSTORE:-}" ]; then
  keys="$(mktemp -d)"
  trap 'rm -rf "$keys"' EXIT
  (umask 077 && printf %s "$ANDROID_KEYSTORE" | base64 -d > "$keys/release.p12")
  export ANDROID_KEYSTORE_FILE="$keys/release.p12"
  signed=true
fi
if [ "$VERSION" != latest ] && [ "$signed" != true ]; then
  echo "the release $VERSION needs ANDROID_KEYSTORE, a release apk is signed" >&2
  exit 1
fi
# no apk of an earlier build
for app in $apps; do rm -rf "$app/build/outputs/apk/github/release"; done
./gradlew assembleGithubRelease
mkdir -p build
apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
for app in $apps; do
  apk="build/sak-${app}-${VERSION}.apk"
  if [ "$signed" = true ]; then
    cp "$app/build/outputs/apk/github/release/${app}-github-release.apk" "$apk"
    # every signer has the certificate; the label differs by apksigner version, "Signer #1" (36) or
    # "V2 Signer" (37)
    certs=$("$apksigner" verify --print-certs "$apk")
    digests=$(printf '%s\n' "$certs" | sed -n 's/^.*Signer.* certificate SHA-256 digest: *//p' | sort -u)
    if [ "$digests" != "$ANDROID_CERT_SHA256" ]; then
      echo "$apk is signed with the certificates '$digests', not only with $ANDROID_CERT_SHA256 of the installed apps:" >&2
      printf '%s\n' "$certs" >&2
      exit 1
    fi
  else
    cp "$app/build/outputs/apk/github/release/${app}-github-release-unsigned.apk" "$apk"
  fi
  (cd build && sha256sum "sak-${app}-${VERSION}.apk" > "sak-${app}-${VERSION}.apk.sha256")
  echo "the release apk is $apk, signed: $signed"
done
'''

# the upload to google play of every app of android/apps.txt (the flavor play, without the updater):
# android/build/sak-<app>-<VERSION>.aab and sak-<app>-<VERSION>-mapping.txt, the map of r8 for the
# stack traces of the play console. Signed with ANDROID_KEYSTORE as android:release:build, the key
# google play signs the app with (play app signing), so an apk of github updates an app of play;
# unsigned, which only VERSION=latest may be, play takes no bundle
[tasks."android:play:build"]
description = "Build the google play bundles of the android apps"
dir = "{{config_root}}/android"
env = { ANDROID_CERT_SHA256 = "{{vars.android_cert_sha256}}" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
apps=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' apps.txt)
signed=false
if [ -n "${ANDROID_KEYSTORE:-}" ]; then
  keys="$(mktemp -d)"
  trap 'rm -rf "$keys"' EXIT
  (umask 077 && printf %s "$ANDROID_KEYSTORE" | base64 -d > "$keys/release.p12")
  export ANDROID_KEYSTORE_FILE="$keys/release.p12"
  signed=true
fi
if [ "$VERSION" != latest ] && [ "$signed" != true ]; then
  echo "the release $VERSION needs ANDROID_KEYSTORE, a bundle for google play is signed" >&2
  exit 1
fi
for app in $apps; do rm -rf "$app/build/outputs/bundle/playRelease" "$app/build/outputs/mapping/playRelease"; done
./gradlew bundlePlayRelease
mkdir -p build
for app in $apps; do
  aab="build/sak-${app}-${VERSION}.aab"
  cp "$app/build/outputs/bundle/playRelease/${app}-play-release.aab" "$aab"
  cp "$app/build/outputs/mapping/playRelease/mapping.txt" "build/sak-${app}-${VERSION}-mapping.txt"
  if [ "$signed" = true ]; then
    # a bundle is signed as a jar: every signer has the certificate
    certs=$(keytool -printcert -jarfile "$aab")
    digests=$(printf '%s\n' "$certs" | sed -n 's/^[[:space:]]*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f' | sort -u)
    if [ "$digests" != "$ANDROID_CERT_SHA256" ]; then
      echo "$aab is signed with the certificates '$digests', not only with $ANDROID_CERT_SHA256 of the installed apps:" >&2
      printf '%s\n' "$certs" >&2
      exit 1
    fi
  fi
  echo "the bundle for google play is $aab, its map of r8 build/sak-${app}-${VERSION}-mapping.txt, signed: $signed"
done
'''

# the apks of android:release:build and the bundles for google play of android:play:build with their
# maps of r8 into the github release v<VERSION> of cli:release; files are replaced, a failed release runs again
[tasks."android:release"]
description = "Add the release apks and bundles to the GitHub release"
dir = "{{config_root}}/android"
run = """
set -eu
for app in $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' apps.txt); do
  apk="build/sak-${app}-${VERSION}.apk"
  aab="build/sak-${app}-${VERSION}.aab"
  mapping="build/sak-${app}-${VERSION}-mapping.txt"
  [ -f "$apk" ] && [ -f "$apk.sha256" ] || { echo "$apk or its checksum is missing" >&2; exit 1; }
  [ -f "$aab" ] && [ -f "$mapping" ] || { echo "$aab or its map of r8 is missing" >&2; exit 1; }
  gh release upload "v${VERSION}" "$apk" "$apk.sha256" "$aab" "$mapping" --clobber
done
"""

# the signing secrets of the release apks: the keystore as base64 and its password, also the key's
# in a pkcs12 keystore; only piped to gh, never an argument or in the environment. The alias
# sak-grocery is from when grocery was the only app, renaming it means a new keystore
# renovate.json against this checkout, nothing changed (docs/development/DEPENDENCIES.md): validates
# it, then lists the pull requests Renovate would open and the dependencies it skips; the full log
# in build/renovate/renovate.log. Renovate 44 needs node 24. GITHUB_COM_TOKEN, from pass unless set,
# looks up the actions and the tools of github releases
[tasks."renovate:dry-run"]
description = "Run Renovate locally without changes"
dir = "{{config_root}}"
env = { GITHUB_COM_TOKEN = "{{ get_env(name='GITHUB_COM_TOKEN', default=exec(command='pass show github/pellepelster/pat/admin 2>/dev/null | head -n1')) }}" }
run = '''
set -eu
dir="{{config_root}}/build/renovate"
log="$dir/renovate.log"
mkdir -p "$dir"
mise exec node@24 -- npx -y --package renovate@44 renovate-config-validator
echo "looking up the dependencies, the log is in $log…"
if ! RENOVATE_CONFIG_FILE="{{config_root}}/renovate.json" RENOVATE_BASE_DIR="$dir/base" LOG_LEVEL=debug LOG_FORMAT=json \
  mise exec node@24 -- npx -y --package renovate@44 renovate --platform=local --dry-run=lookup \
  --require-config=ignored --onboarding=false > "$log" 2>&1; then
  echo "renovate failed, see $log" >&2
  exit 1
fi
node -e '
const lines = require("fs").readFileSync(process.argv[1], "utf8").split(/\r?\n/);
let files;
const problems = new Set();
for (const line of lines) {
  let entry;
  try { entry = JSON.parse(line); } catch { continue; }
  if (entry.msg === "packageFiles with updates") files = entry.config;
  if (entry.level >= 40) problems.add(entry.msg + (entry.err ? ": " + (entry.err.message || entry.err) : ""));
}
if (!files) { console.error("renovate found nothing, see " + process.argv[1]); process.exit(1); }
// the reasons a dependency has no lookup on purpose
const expected = new Set(["unspecified-version", "path-dependency", "file", "contains-variable", "disabled"]);
const branches = new Map();
const skipped = new Map();
for (const [manager, packageFiles] of Object.entries(files)) {
  for (const packageFile of packageFiles) {
    for (const dep of packageFile.deps) {
      if (dep.skipReason && !expected.has(dep.skipReason)) {
        skipped.set(dep.skipReason, (skipped.get(dep.skipReason) || new Set()).add(manager + " " + dep.depName));
      }
      for (const update of dep.updates || []) {
        const branch = branches.get(update.branchName) || new Set();
        branches.set(update.branchName, branch.add(dep.depName + " " + dep.currentValue + " -> " + update.newVersion));
      }
    }
  }
}
console.log("pull requests:");
for (const name of [...branches.keys()].sort()) {
  console.log("  " + name);
  for (const update of [...branches.get(name)].sort()) console.log("    " + update);
}
for (const [reason, deps] of skipped) console.log("skipped (" + reason + "): " + [...deps].sort().join(", "));
for (const problem of problems) console.log("warning: " + problem);
' "$log"
'''

# Renovate on github now: starts the workflow renovate (.github/workflows/renovate.yml), which runs
# as the GitHub App of the repository and creates and updates the branches, the pull requests and
# the Dependency Dashboard at once instead of on the schedules of renovate.json (the lock files
# too); it merges what may be merged when the workflow is green. RENOVATE_DRY_RUN=true shows what it
# would do without a change
[tasks."renovate:run"]
description = "Run the Renovate workflow and create the pull requests"
dir = "{{config_root}}"
run = '''
set -eu
gh workflow run renovate.yml --repo pellepelster/swiss-army-knife -f dry_run="${RENOVATE_DRY_RUN:-false}"
echo "started, see gh run list --workflow renovate.yml --repo pellepelster/swiss-army-knife"
'''

# the secrets of the environment release of the repository, which only the jobs of a tag v* get
# (the signed android apps): the keystore is the identity of the apps, no other job sees it. And the
# GitHub App of the workflow renovate, its client id and its private key, secrets of the repository
[tasks."github:secrets:update"]
description = "Set the GitHub secrets of the environment release and of Renovate from pass"
run = """
#!/usr/bin/env bash
set -euo pipefail
repo=pellepelster/swiss-army-knife
pass show sak/android/signing-key | head -n1 | gh secret set ANDROID_KEYSTORE --repo "$repo" --env release
pass show sak/android/signing-key-password | head -n1 | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$repo" --env release
pass show sak/android/signing-key-password | head -n1 | gh secret set ANDROID_KEY_PASSWORD --repo "$repo" --env release
printf sak-grocery | gh secret set ANDROID_KEY_ALIAS --repo "$repo" --env release
pass show github/pellepelster/renovate-app/client-id | head -n1 | gh secret set RENOVATE_APP_CLIENT_ID --repo "$repo"
pass show github/pellepelster/renovate-app/private-key | gh secret set RENOVATE_APP_PRIVATE_KEY --repo "$repo"
"""

[tasks."android:test"]
description = "Run the android unit tests"
dir = "{{config_root}}/android"
run = 'ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew testGithubDebugUnitTest'

# docs/screenshots/android-<app>-<screen>[-dark].png: robolectric renders each app against the fake
# backend of its tests, light and dark (the classes *Screenshots)
[tasks."android:screenshots"]
description = "Take the screenshots of the android apps"
dir = "{{config_root}}/android"
run = 'ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew testGithubDebugUnitTest -Psak.screenshots="{{config_root}}/docs/screenshots"'

# the debug build, e.g. `mise run android:run notes`, on the emulator even with a phone attached; the
# avd sak is created once, the emulator started unless running and left running. The app talks to
# local:run on the host as http://10.0.2.2:4200
[tasks."android:run"]
description = "Run an android app in the emulator"
usage = 'arg "<app>" help="the app, a line of android/apps.txt (grocery, notes, todo)"'
depends = ["android:sdk"]
dir = "{{config_root}}/android"
run = '''
#!/usr/bin/env bash
set -euo pipefail
app="$usage_app"
sed -e 's/#.*//' -e 's/[[:space:]]//g' apps.txt | grep -qx "$app" || { echo "no app $app in android/apps.txt" >&2; exit 1; }
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
adb="$ANDROID_HOME/platform-tools/adb"
emulator="$ANDROID_HOME/emulator/emulator"
avd="sak"
if ! "$emulator" -list-avds | grep -qx "$avd"; then
  echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n "$avd" \
    -k "system-images;android-36;google_apis;x86_64" -d pixel_7
fi
serial=$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')
if [ -z "$serial" ]; then
  nohup "$emulator" -avd "$avd" -no-boot-anim >/dev/null 2>&1 &
  until serial=$("$adb" devices | awk 'NR > 1 && $1 ~ /^emulator-/ { print $1; exit }') && [ -n "$serial" ]; do sleep 2; done
  "$adb" -s "$serial" wait-for-device
  until [ "$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 2; done
fi
export ANDROID_SERIAL="$serial"
./gradlew ":$app:installGithubDebug"
"$adb" -s "$serial" shell am start -n "io.pelle.sak.$app.debug/io.pelle.sak.$app.MainActivity"
'''

# the debug build on the phone attached with usb debugging, e.g. `mise run android:install grocery`;
# ANDROID_SERIAL selects one of several phones (adb devices)
[tasks."android:install"]
description = "Install an android app on the attached phone"
usage = 'arg "<app>" help="the app, a line of android/apps.txt (grocery, notes, todo)"'
depends = ["android:sdk:build"]
dir = "{{config_root}}/android"
run = '''
#!/usr/bin/env bash
set -euo pipefail
app="$usage_app"
sed -e 's/#.*//' -e 's/[[:space:]]//g' apps.txt | grep -qx "$app" || { echo "no app $app in android/apps.txt" >&2; exit 1; }
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
adb="$ANDROID_HOME/platform-tools/adb"
# one serial a line, counted with grep: the length syntax of bash opens a comment in mise's templates
phones=$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ { print $1 }')
count=$(printf '%s' "$phones" | grep -c . || true)
unauthorized=$("$adb" devices | awk 'NR > 1 && $2 == "unauthorized" { print $1 }')
if [ -n "${ANDROID_SERIAL:-}" ]; then
  serial="$ANDROID_SERIAL"
elif [ "$count" -eq 1 ]; then
  serial="$phones"
elif [ "$count" -eq 0 ]; then
  if [ -n "$unauthorized" ]; then
    echo "the phone $unauthorized does not allow usb debugging yet, confirm the prompt on it" >&2
  else
    echo "no phone attached: plug it in with usb debugging on (Settings > System > Developer options)" >&2
  fi
  exit 1
else
  echo "more than one phone attached ($(echo $phones)), name one with ANDROID_SERIAL=<serial>" >&2
  exit 1
fi
./gradlew ":$app:assembleGithubDebug"
"$adb" -s "$serial" install -r "$app/build/outputs/apk/github/debug/$app-github-debug.apk"
"$adb" -s "$serial" shell am start -n "io.pelle.sak.$app.debug/io.pelle.sak.$app.MainActivity"
'''
