set -e
(cd src-tauri && cargo nextest run --no-fail-fast -E 'not test(/::integration::/)')
(cd cloud && cargo nextest run --no-fail-fast -E 'kind(lib)')
"""

# in docker: the vector configuration the backend role deploys, with its image, and sak-backend
# of the role as it renders it (backup, restore and the maintenance), next to a real victorialogs
# (ansible/roles/backend/tests/sak-backend-test.sh), and the role role_markers
# (ansible/roles/role_markers/tests/role-markers-test.sh)
[tasks."backend:test:integration"]
description = "Run the backend integration tests"
dir = "{{config_root}}"
run = """
./gradlew :sak-backend:vectorTest
ansible/roles/backend/tests/sak-backend-test.sh
ansible/roles/role_markers/tests/role-markers-test.sh
"""

# the apps in a browser against the controller and a mailpit e-mail sink (docker); playwright
# downloads its chromium on the first run
[tasks."frontend:test:integration"]
description = "Run the frontend integration tests"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:e2eTest"

# the tests of sakctl in modules named integration: docker and podman (they pull the canary and
# the image of the tools from ghcr.io), the ssh session in the image of the tools, ssh-keygen
[tasks."cli:test:integration"]
description = "Run the cli integration tests"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli/src-tauri"
run = "cargo nextest run --no-fail-fast -E 'test(/::integration::/)'"

# the local tests of sak-e2e: the apps in chromium against the environment of `mise run local:run`;
# playwright downloads its chromium on the first run
[tasks."frontend:test:local"]
description = "Run the frontend tests against local:run"
dir = "{{config_root}}"
run = "./gradlew :sak-e2e:e2eLocal"

# against the Hetzner Cloud project of HCLOUD_TOKEN: the tests of sak-cloud against the hetzner
# cloud api, then sak-e2e: two deployments created with sakctl, built first, the logins and the apps
# in a browser against them, the login mails in a mailtrap sandbox. They create and destroy real
# resources and servers (test-<id>), which takes long and costs money. The token and the mailtrap
# credentials come from pass unless set; without them the task refuses to run. The deployments run
# the images of SAK_DOCKER_IMAGE_TAG, <VERSION>-rc unless set: outside of CI the task builds and
# pushes them first (image:all:push), in CI the jobs of the images pushed them
[tasks."cli:test:e2e"]
description = "Run the cli e2e tests"
depends = ["cli:theme"]
dir = "{{config_root}}"
env = {
    HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}",
    MAILTRAP_API_TOKEN = "{{ get_env(name='MAILTRAP_API_TOKEN', default=exec(command='pass show mailtrap/pelle/api-token 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_HOST = "{{ get_env(name='SAK_E2E_SMTP_HOST', default=exec(command='pass show mailtrap/pelle/smtp-server 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_PORT = "{{ get_env(name='SAK_E2E_SMTP_PORT', default=exec(command='pass show mailtrap/pelle/smtp-port 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_USERNAME = "{{ get_env(name='SAK_E2E_SMTP_USERNAME', default=exec(command='pass show mailtrap/pelle/smtp-user 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_PASSWORD = "{{ get_env(name='SAK_E2E_SMTP_PASSWORD', default=exec(command='pass show mailtrap/pelle/smtp-password 2>/dev/null | head -n1')) }}"
}
run = """
set -e
for variable in HCLOUD_TOKEN MAILTRAP_API_TOKEN SAK_E2E_SMTP_HOST SAK_E2E_SMTP_PORT SAK_E2E_SMTP_USERNAME SAK_E2E_SMTP_PASSWORD; do
  [ -n "$(printenv "$variable")" ] || { echo "set $variable, refer to sak-e2e/README.md" >&2; exit 1; }
done
# sakctl first: a build that fails stops the task before any server is created
(cd sak-cli/src-tauri && cargo build)
# the images of this source, as the deployments of the tests run them
# for amd64, the servers of the tests, and the platform of this machine, which runs the tools,
# unless SAK_DOCKER_PLATFORMS says otherwise
if [ -z "${CI:-}" ]; then
  case "$(uname -m)" in
    aarch64 | arm64) platform=linux/amd64,linux/arm64 ;;
    *) platform=linux/amd64 ;;
  esac
  mise run image:all:build
  SAK_DOCKER_PLATFORMS="${SAK_DOCKER_PLATFORMS:-$platform}" mise run image:all:push
fi
export SAK_DOCKER_IMAGE_TAG="${SAK_DOCKER_IMAGE_TAG:-${VERSION}-rc}"
# one test at a time: the tests against the hetzner cloud api share their ssh key and names
(cd sak-cli/cloud && cargo nextest run --no-fail-fast --test-threads 1 -E 'kind(test)')
./gradlew :sak-e2e:e2eIntegration --console=plain
"""

# everything at once, each in its own process group with its log in build/local/logs. The npm
# dependencies of the frontend first (frontend:install), so neither the build of the backend nor the
# dev server changes them under the other. Ctrl-C stops everything.
[tasks."local:run"]
description = "Run everything locally"
depends = ["frontend:install"]
# the script keeps the process groups of the tasks in an array
shell = "bash -c"
run = '''
logs="{{config_root}}/build/local/logs"
mkdir -p "$logs"
pids=()

stop() {
  # the terminal hands Ctrl-C to mise as well, which passes it on again: ignored while stopping
  trap '' INT TERM
  trap - EXIT
  echo
  echo "stopping everything…"
  for pid in "${pids[@]}"; do kill -INT -- "-$pid" 2>/dev/null; done
  # gradle hands the backend to its daemon, which stops it once its client is gone
  for _ in $(seq 1 30); do
    alive=0
    for pid in "${pids[@]}"; do kill -0 -- "-$pid" 2>/dev/null && alive=1; done
    [ "$alive" = 0 ] && break
    sleep 0.5
  done
  for pid in "${pids[@]}"; do kill -KILL -- "-$pid" 2>/dev/null; done
  pkill -f 'io.pelle.sak.backend.SakBackendKt' 2>/dev/null
  docker compose -p sak-local down >/dev/null 2>&1
  echo "stopped"
}
trap stop INT TERM EXIT

# starts a task in its own process group, so stop() reaches everything it starts
start() {
  setsid mise run "$1" > "$logs/$1.log" 2>&1 < /dev/null &
  pids+=($!)
}

# waits for the line in the log of the task, gives up when the task ended or after the seconds
await() {
  local task=$1 line=$2 seconds=$3 pid=$4
  for _ in $(seq 1 "$seconds"); do
    grep -q "$line" "$logs/$task.log" && return 0
    if ! kill -0 "$pid" 2>/dev/null; then
      echo "$task did not start, see $logs/$task.log" >&2
      return 1
    fi
    sleep 1
  done
  echo "$task did not start within $seconds seconds, see $logs/$task.log" >&2
  return 1
}

echo "starting the ingress, victorialogs and mailpit…"
start local:env:run
await local:env:run "the services are up" 300 "${pids[0]}" || exit 1

echo "starting the backend…"
start local:backend:run
await local:backend:run "Responding at" 600 "${pids[1]}" || exit 1

echo "starting the frontend…"
start local:frontend:run
await local:frontend:run "Local:" 180 "${pids[2]}" || exit 1

cat <<ADDRESSES

  frontend   http://localhost:4200   the apps
  backend    http://localhost:8080   api at /api/v1, swagger ui at /swagger/
  ingress    https://sak.localhost   the apps behind caddy, its certificate is caddy's own,
             https://api.localhost   their api at /v1 and the s3 api of the buckets
  mailpit    http://localhost:8025   every login link arrives here
  logs       http://localhost:9428   victorialogs, vector ships the access log of the ingress

  sign in as admin@localhost (config/local-config.yaml), open the link
  from mailpit in the same browser

  logs in $logs
  Ctrl-C stops everything

ADDRESSES
wait
'''

# android/, the android apps of SAK: one gradle build of its own with its own wrapper, a module for
# each app of android/apps.txt on top of core. The sdk is in $ANDROID_HOME, ~/Android/Sdk when unset;
# android:sdk installs the command-line tools of google there, accepts their licenses and installs what
# the build and the emulator need
[tasks."android:sdk"]
description = "Install the Android SDK of the android apps"
# apksigner of the build tools checks the signature of the release apk
env = { ANDROID_BUILD_TOOLS = "36.0.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
sdk="${ANDROID_HOME:-$HOME/Android/Sdk}"
sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
if [ ! -x "$sdkmanager" ]; then
  tmp="$(mktemp -d)"
  trap 'rm -rf "$tmp"' EXIT
  curl -fsSL -o "$tmp/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
  echo "e025545c62a8e64c7559119566a569fb1dec5f60  $tmp/tools.zip" | sha1sum -c --quiet
  unzip -q "$tmp/tools.zip" -d "$tmp"
  mkdir -p "$sdk/cmdline-tools"
  mv "$tmp/cmdline-tools" "$sdk/cmdline-tools/latest"
fi
yes | "$sdkmanager" --sdk_root="$sdk" --licenses >/dev/null || true
"$sdkmanager" --sdk_root="$sdk" platform-tools "platforms;android-37.2" "build-tools;${ANDROID_BUILD_TOOLS}"
# the emulator only on a machine, not for a build in the workflow (android:sdk:build)
[ "${ANDROID_SDK_BUILD_ONLY:-}" = true ] || "$sdkmanager" --sdk_root="$sdk" emulator "system-images;android-36;google_apis;x86_64"
echo "the android sdk is in $sdk"
'''

# what a build of the android apps needs and no emulator, for the workflow
[tasks."android:sdk:build"]
description = "Install the Android SDK to build the android apps, without the emulator"
env = { ANDROID_SDK_BUILD_ONLY = "true" }
run = "mise run android:sdk"

[tasks."android:build"]
description = "Build the android apps"
dir = "{{config_root}}/android"
run = 'ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew assembleDebug'

# the release apk of every app of android/apps.txt, android/build/sak-<app>-<VERSION>.apk, and its
# checksum. Signed with the keystore of ANDROID_KEYSTORE (base64, from the secrets of the workflow,
# github:secrets:update), decoded into a directory removed afterwards; without it unsigned, which only
# VERSION=latest may be (the build of sak.android.app refuses it too). A signed apk must be signed
# with the certificate of ANDROID_CERT_SHA256, the key every installed app was signed with: an apk of
# another key installs over none of them
[tasks."android:release:build"]
description = "Build the release apks of the android apps"
dir = "{{config_root}}/android"
env = { ANDROID_CERT_SHA256 = "546205591d3d1ad2e3b10e38f2ef8ce154eb19b543125a5ea6c7bf2ef9890679" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
apps=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' apps.txt)
signed=false
if [ -n "${ANDROID_KEYSTORE:-}" ]; then
  keys="$(mktemp -d)"
  trap 'rm -rf "$keys"' EXIT
  (umask 077 && printf %s "$ANDROID_KEYSTORE" | base64 -d > "$keys/release.p12")
  export ANDROID_KEYSTORE_FILE="$keys/release.p12"
  signed=true
fi
if [ "$VERSION" != latest ] && [ "$signed" != true ]; then
  echo "the release $VERSION needs ANDROID_KEYSTORE, a release apk is signed" >&2
  exit 1
fi
# no apk of a build before is taken for this one
for app in $apps; do rm -rf "$app/build/outputs/apk/release"; done
./gradlew assembleRelease
mkdir -p build
apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
for app in $apps; do
  apk="build/sak-${app}-${VERSION}.apk"
  if [ "$signed" = true ]; then
    cp "$app/build/outputs/apk/release/${app}-release.apk" "$apk"
    # every signer the apk names has the certificate of the installed apps, at least one; the label
    # differs between the versions of apksigner, e.g. "Signer #1" (36) or "V2 Signer" (37)
    certs=$("$apksigner" verify --print-certs "$apk")
    digests=$(printf '%s\n' "$certs" | sed -n 's/^.*Signer.* certificate SHA-256 digest: *//p' | sort -u)
    if [ "$digests" != "$ANDROID_CERT_SHA256" ]; then
      echo "$apk is signed with the certificates '$digests', not only with $ANDROID_CERT_SHA256 of the installed apps:" >&2
      printf '%s\n' "$certs" >&2
      exit 1
    fi
  else
    cp "$app/build/outputs/apk/release/${app}-release-unsigned.apk" "$apk"
  fi
  (cd build && sha256sum "sak-${app}-${VERSION}.apk" > "sak-${app}-${VERSION}.apk.sha256")
  echo "the release apk is $apk, signed: $signed"
done
'''

# the release apks of android/apps.txt and their checksums into the github release of the tag
# v<VERSION>, which cli:release created; a file already there is replaced, so a release that failed
# halfway runs again
[tasks."android:release"]
description = "Add the release apks of the android apps to the GitHub release"
dir = "{{config_root}}/android"
run = """
set -eu
for app in $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' apps.txt); do
  apk="build/sak-${app}-${VERSION}.apk"
  [ -f "$apk" ] && [ -f "$apk.sha256" ] || { echo "$apk or its checksum is missing" >&2; exit 1; }
  gh release upload "v${VERSION}" "$apk" "$apk.sha256" --clobber
done
"""

# the secrets of the workflow that signs the release apks of the android apps, from pass: the
# keystore as base64 (sak/android/signing-key) and its password (sak/android/signing-key-password),
# which is also the one of the key in a pkcs12 keystore. The values go to gh through pipes only,
# never as an argument or into the environment. The alias of the key in the keystore is sak-grocery,
# from when the grocery app was the only one; it signs every app, renaming it means a new keystore
# secret
[tasks."github:secrets:update"]
description = "Set the GitHub secrets of the swiss army knife repository from pass"
run = """
#!/usr/bin/env bash
set -euo pipefail
repo=pellepelster/swiss-army-knife
pass show sak/android/signing-key | head -n1 | gh secret set ANDROID_KEYSTORE --repo "$repo"
pass show sak/android/signing-key-password | head -n1 | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$repo"
pass show sak/android/signing-key-password | head -n1 | gh secret set ANDROID_KEY_PASSWORD --repo "$repo"
printf sak-grocery | gh secret set ANDROID_KEY_ALIAS --repo "$repo"
"""

[tasks."android:test"]
description = "Run the tests of the android apps"
dir = "{{config_root}}/android"
run = 'ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew testDebugUnitTest'

# the screenshots of the android apps in docs/screenshots/ (android-<app>-<screen>[-dark].png): each
# app rendered on the jvm by robolectric against the fake backend of its tests, in the light and the
# dark mode of the phone (the classes *Screenshots, android/testing/.../Screenshots.kt)
[tasks."android:screenshots"]
description = "Take the screenshots of the android apps"
dir = "{{config_root}}/android"
run = 'ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}" ./gradlew testDebugUnitTest -Psak.screenshots="{{config_root}}/docs/screenshots"'

# the debug build of an app of android/apps.txt in the emulator, e.g. mise run android:run notes: the
# avd sak is made once, the emulator started when none runs and left running; the debug build is
# installed on the emulator only (ANDROID_SERIAL), also when a phone is attached. It takes a server url
# like http://10.0.2.2:8080/api/v1, the backend of local:run on the host
[tasks."android:run"]
description = "Run an android app in the emulator"
usage = 'arg "<app>" help="the app, a line of android/apps.txt (grocery, notes)"'
depends = ["android:sdk"]
dir = "{{config_root}}/android"
run = '''
#!/usr/bin/env bash
set -euo pipefail
app="$usage_app"
sed -e 's/#.*//' -e 's/[[:space:]]//g' apps.txt | grep -qx "$app" || { echo "no app $app in android/apps.txt" >&2; exit 1; }
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
adb="$ANDROID_HOME/platform-tools/adb"
emulator="$ANDROID_HOME/emulator/emulator"
avd="sak"
if ! "$emulator" -list-avds | grep -qx "$avd"; then
  echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n "$avd" \
    -k "system-images;android-36;google_apis;x86_64" -d pixel_7
fi
serial=$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 ~ /^emulator-/ { print $1; exit }')
if [ -z "$serial" ]; then
  nohup "$emulator" -avd "$avd" -no-boot-anim >/dev/null 2>&1 &
  until serial=$("$adb" devices | awk 'NR > 1 && $1 ~ /^emulator-/ { print $1; exit }') && [ -n "$serial" ]; do sleep 2; done
  "$adb" -s "$serial" wait-for-device
  until [ "$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do sleep 2; done
fi
export ANDROID_SERIAL="$serial"
./gradlew ":$app:installDebug"
"$adb" -s "$serial" shell am start -n "io.pelle.sak.$app.debug/io.pelle.sak.$app.MainActivity"
'''

# the debug build of an app of android/apps.txt on the phone attached by usb (usb debugging on), not on
# an emulator, e.g. mise run android:install grocery; with more than one phone attached,
# ANDROID_SERIAL names the one (adb devices lists them). The sdk without the emulator is enough
[tasks."android:install"]
description = "Install an android app on the attached phone"
usage = 'arg "<app>" help="the app, a line of android/apps.txt (grocery, notes)"'
depends = ["android:sdk:build"]
dir = "{{config_root}}/android"
run = '''
#!/usr/bin/env bash
set -euo pipefail
app="$usage_app"
sed -e 's/#.*//' -e 's/[[:space:]]//g' apps.txt | grep -qx "$app" || { echo "no app $app in android/apps.txt" >&2; exit 1; }
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
adb="$ANDROID_HOME/platform-tools/adb"
# one serial a line; the task is a template of mise, which takes the length syntax of bash for a comment
phones=$("$adb" devices | awk 'NR > 1 && $2 == "device" && $1 !~ /^emulator-/ { print $1 }')
count=$(printf '%s' "$phones" | grep -c . || true)
unauthorized=$("$adb" devices | awk 'NR > 1 && $2 == "unauthorized" { print $1 }')
if [ -n "${ANDROID_SERIAL:-}" ]; then
  serial="$ANDROID_SERIAL"
elif [ "$count" -eq 1 ]; then
  serial="$phones"
elif [ "$count" -eq 0 ]; then
  if [ -n "$unauthorized" ]; then
    echo "the phone $unauthorized does not allow usb debugging yet, confirm the prompt on it" >&2
  else
    echo "no phone attached: plug it in with usb debugging on (Settings > System > Developer options)" >&2
  fi
  exit 1
else
  echo "more than one phone attached ($(echo $phones)), name one with ANDROID_SERIAL=<serial>" >&2
  exit 1
fi
./gradlew ":$app:assembleDebug"
"$adb" -s "$serial" install -r "$app/build/outputs/apk/debug/$app-debug.apk"
"$adb" -s "$serial" shell am start -n "io.pelle.sak.$app.debug/io.pelle.sak.$app.MainActivity"
'''
