[tools]
terraform = "1.17.0"
# builds and tests sak-console, the gradle build calls npm
node = "22.22.3"
"pipx:ansible-core" = "2.18.19"
# the backend the `pipx:` tool above installs with
pipx = "1.17.2"

# the only terraform call, every tf:* task runs through it; the credentials are read from
# pass when a task runs (not when mise loads this file) unless already set in the environment
[tasks."tf"]
description = "Run terraform in infra/ with the Hetzner Cloud, AWS and SMTP credentials from pass"
env = {
    AWS_ACCESS_KEY_ID = "{{ get_env(name='AWS_ACCESS_KEY_ID', default=exec(command='pass show aws/pelle/pelle-io/admin/access_key | head -n1')) }}",
    AWS_SECRET_ACCESS_KEY = "{{ get_env(name='AWS_SECRET_ACCESS_KEY', default=exec(command='pass show aws/pelle/pelle-io/admin/secret_access_key | head -n1')) }}",
    HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token | head -n1')) }}",
    # the scaleway transactional email account the console's login links are sent with
    TF_VAR_smtp_host = "{{ get_env(name='TF_VAR_smtp_host', default=exec(command='pass show scaleway/pelle.io/smtp_host | head -n1')) }}",
    TF_VAR_smtp_port = "{{ get_env(name='TF_VAR_smtp_port', default=exec(command='pass show scaleway/pelle.io/smtp_port | head -n1')) }}",
    TF_VAR_smtp_username = "{{ get_env(name='TF_VAR_smtp_username', default=exec(command='pass show scaleway/pelle.io/smtp_user | head -n1')) }}",
    TF_VAR_smtp_password = "{{ get_env(name='TF_VAR_smtp_password', default=exec(command='pass show scaleway/pelle.io/smtp_password | head -n1')) }}"
}
usage = '''
arg "<args>" var=#true help="arguments passed to terraform"
'''
# usage_args is shell quoted (e.g. '-input=false'), eval restores the original arguments
run = '''
eval "set -- ${usage_args}"
terraform -chdir=infra "$@"
'''

[tasks."tf:init"]
description = "Initialize Terraform for the Hetzner Cloud infrastructure in infra/"
run = "mise run tf -- init"

[tasks."tf:plan"]
description = "Show the changes Terraform would make to the Hetzner Cloud infrastructure"
run = "mise run tf -- plan"

[tasks."tf:apply"]
description = "Create or update sak-backend and its sak-data volume in Hetzner Cloud"
run = "mise run tf -- apply"

# uses the client key and the pinned host key that tf:apply writes to infra/.ssh/,
# extra arguments are passed to ssh (e.g. `mise run ssh -- uptime`)
[tasks."ssh"]
description = "Log in to sak-backend as root with the generated ssh client key"
run = "ssh -i infra/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=infra/.ssh/known_hosts -o StrictHostKeyChecking=yes root@\"$(mise run tf -- output -raw controller_ipv4)\""

# the collection is linked (not copied) into .ansible/collections, so changes below
# ansible/ take effect without reinstalling it; the inventory is written by tf:apply,
# the images are built and exported before every run and only deployed when they changed
[tasks."ansible:run"]
description = "Provision sak-backend with the pelle.sak collection"
env = { ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/.ansible/collections" }
run = """
if [ ! -f infra/.ansible/inventory.yml ]; then
  echo "infra/.ansible/inventory.yml is missing, run 'mise run tf:apply' first" >&2
  exit 1
fi
mkdir -p .ansible/collections/ansible_collections/pelle
ln -sfn ../../../../ansible .ansible/collections/ansible_collections/pelle/sak
ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
mise run docker:save
ansible-playbook -i infra/.ansible/inventory.yml \
  -e controller_image_archive="$PWD/build/images/sak-backend.tar.gz" \
  -e controller_ingress_image_archive="$PWD/build/images/sak-ingress.tar.gz" \
  -e controller_config_src="$PWD/config/controller-config.yaml" \
  pelle.sak.controller
"""

# the images are tagged below localhost/, so podman never tries to pull them
[tasks."docker:build"]
description = "Build the sak-backend and sak-ingress docker images"
run = """
./gradlew :sak-backend:installDist
docker build -t localhost/sak-backend:latest sak-backend
docker build -t localhost/sak-ingress:latest sak-ingress
"""

# gzip -n keeps the archives byte identical for unchanged images, so ansible only
# uploads and loads images that changed
[tasks."docker:save"]
description = "Export the docker images to build/images/ for deployment"
depends = ["docker:build"]
run = """
mkdir -p build/images
docker save localhost/sak-backend:latest | gzip -n > build/images/sak-backend.tar.gz
docker save localhost/sak-ingress:latest | gzip -n > build/images/sak-ingress.tar.gz
"""

# the ports do not clash: backend 8080, console 4200 (proxies /api to the backend), frontend 4300,
# the mailpit the login links of the backend go to 1025 (smtp) and 8025 (web ui)
[tasks."backend:run"]
description = "Run sak-backend on http://localhost:8080 with a mailpit for its login links on http://localhost:8025"
env = { SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data" }
run = """
mkdir -p "$SAK_LOCAL_DATA_DIR"
docker run -d --rm --name sak-local-mailpit -p 127.0.0.1:8025:8025 -p 127.0.0.1:1025:1025 axllent/mailpit:v1.32.0 >/dev/null \
  || docker start sak-local-mailpit >/dev/null
trap 'docker stop sak-local-mailpit >/dev/null' EXIT
./gradlew :sak-backend:run --args="-config={{config_root}}/config/local-config.yaml"
"""

[tasks."console:run"]
description = "Run sak-console on http://localhost:4200, its /api goes to backend:run"
dir = "{{config_root}}/sak-console"
run = """
[ -d node_modules ] || npm ci
npx ng serve --port 4200
"""

[tasks."frontend:run"]
description = "Run the sak-frontend notes prototype on http://localhost:4300"
dir = "{{config_root}}/sak-frontend"
run = """
[ -d node_modules ] || npm ci
npx ng serve --port 4300
"""
