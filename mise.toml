[tools]
terraform = "1.17.0"
# builds and tests sak-frontend, the gradle build calls npm
node = "22.22.3"
"pipx:ansible-core" = "2.18.19"
# the backend the `pipx:` tool above installs with
pipx = "1.17.2"

# the only terraform call, every tf:* task runs through it; the credentials are read from
# pass when a task runs (not when mise loads this file) unless already set in the environment
[tasks."tf"]
description = "Run terraform in infra/ with the Hetzner Cloud, AWS, SMTP and OpenRouter credentials from pass"
env = {
    AWS_ACCESS_KEY_ID = "{{ get_env(name='AWS_ACCESS_KEY_ID', default=exec(command='pass show aws/pelle/pelle-io/admin/access_key | head -n1')) }}",
    AWS_SECRET_ACCESS_KEY = "{{ get_env(name='AWS_SECRET_ACCESS_KEY', default=exec(command='pass show aws/pelle/pelle-io/admin/secret_access_key | head -n1')) }}",
    HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token | head -n1')) }}",
    # the scaleway transactional email account the login links of the apps are sent with
    TF_VAR_smtp_host = "{{ get_env(name='TF_VAR_smtp_host', default=exec(command='pass show scaleway/pelle.io/smtp_host | head -n1')) }}",
    TF_VAR_smtp_port = "{{ get_env(name='TF_VAR_smtp_port', default=exec(command='pass show scaleway/pelle.io/smtp_port | head -n1')) }}",
    TF_VAR_smtp_username = "{{ get_env(name='TF_VAR_smtp_username', default=exec(command='pass show scaleway/pelle.io/smtp_user | head -n1')) }}",
    TF_VAR_smtp_password = "{{ get_env(name='TF_VAR_smtp_password', default=exec(command='pass show scaleway/pelle.io/smtp_password | head -n1')) }}",
    TF_VAR_openrouter_api_token = "{{ get_env(name='TF_VAR_openrouter_api_token', default=exec(command='pass show openrouter/pelle/api-key | head -n1')) }}"
}
usage = '''
arg "<args>" var=#true help="arguments passed to terraform"
'''
# usage_args is shell quoted (e.g. '-input=false'), eval restores the original arguments
run = '''
eval "set -- ${usage_args}"
terraform -chdir=infra "$@"
'''

[tasks."tf:init"]
description = "Initialize Terraform for the Hetzner Cloud infrastructure in infra/"
run = "mise run tf -- init"

[tasks."tf:plan"]
description = "Show the changes Terraform would make to the Hetzner Cloud infrastructure"
run = "mise run tf -- plan"

[tasks."tf:apply"]
description = "Create or update sak-backend and its sak-data volume in Hetzner Cloud"
run = "mise run tf -- apply"

# uses the client key and the pinned host key that tf:apply writes to infra/.ssh/,
# extra arguments are passed to ssh (e.g. `mise run ssh -- uptime`)
[tasks."ssh"]
description = "Log in to sak-backend as root with the generated ssh client key"
run = "ssh -i infra/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=infra/.ssh/known_hosts -o StrictHostKeyChecking=yes root@\"$(mise run tf -- output -raw controller_ipv4)\""

# the collection is linked (not copied) into .ansible/collections, so changes below
# ansible/ take effect without reinstalling it; the inventory is written by tf:apply,
# the images are built and exported before every run and only deployed when they changed
[tasks."ansible:run"]
description = "Provision sak-backend with the pelle.sak collection"
env = { ANSIBLE_COLLECTIONS_PATH = "{{config_root}}/.ansible/collections" }
run = """
if [ ! -f infra/.ansible/inventory.yml ]; then
  echo "infra/.ansible/inventory.yml is missing, run 'mise run tf:apply' first" >&2
  exit 1
fi
mkdir -p .ansible/collections/ansible_collections/pelle
ln -sfn ../../../../ansible .ansible/collections/ansible_collections/pelle/sak
ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
mise run docker:save
ansible-playbook -i infra/.ansible/inventory.yml \
  -e controller_image_archive="$PWD/build/images/sak-backend.tar.gz" \
  -e controller_ingress_image_archive="$PWD/build/images/sak-ingress.tar.gz" \
  -e controller_config_src="$PWD/config/controller-config.yaml" \
  pelle.sak.controller
"""

# the images are tagged below localhost/, so podman never tries to pull them
[tasks."docker:build"]
description = "Build the sak-backend and sak-ingress docker images"
run = """
./gradlew :sak-backend:installDist
docker build -t localhost/sak-backend:latest sak-backend
docker build -t localhost/sak-ingress:latest sak-ingress
"""

# gzip -n keeps the archives byte identical for unchanged images, so ansible only
# uploads and loads images that changed
[tasks."docker:save"]
description = "Export the docker images to build/images/ for deployment"
depends = ["docker:build"]
run = """
mkdir -p build/images
docker save localhost/sak-backend:latest | gzip -n > build/images/sak-backend.tar.gz
docker save localhost/sak-ingress:latest | gzip -n > build/images/sak-ingress.tar.gz
"""

# the services of config/local-compose.yaml next to the backend of backend:run: the ingress on 80
# and 443 (admin api 2019), victorialogs 9428 and the mailpit the login links go to, 1025 (smtp)
# and 8025 (web ui); in the foreground with their logs until Ctrl-C
[tasks."env:run"]
description = "Run the ingress on https://apps.localhost, victorialogs on http://localhost:9428 and mailpit on http://localhost:8025 until Ctrl-C"
env = {
    SAK_LOCAL_DIR = "{{config_root}}/build/local",
    SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data"
}
run = """
# created before docker would create them owned by root
mkdir -p "$SAK_LOCAL_DATA_DIR/s3" "$SAK_LOCAL_DIR/ingress/log" "$SAK_LOCAL_DIR/victorialogs" "$SAK_LOCAL_DIR/vector"
export SAK_LOCAL_UID=$(id -u) SAK_LOCAL_GID=$(id -g)
export SAK_VICTORIALOGS_IMAGE=$(sed -n 's/^controller_victorialogs_image: //p' ansible/roles/controller/defaults/main.yml)
export SAK_VECTOR_IMAGE=$(sed -n 's/^controller_vector_image: //p' ansible/roles/controller/defaults/main.yml)
compose="docker compose -f {{config_root}}/config/local-compose.yaml"
$compose up -d --build --wait --remove-orphans
# sh skips the exit trap when a signal ends it, Ctrl-C takes the services down as well
trap "docker compose -p sak-local down" EXIT
trap "exit 130" INT TERM
echo "the services are up"
$compose logs -f
"""

# the ports do not clash: backend 8080, frontend 4200 (proxies /api to the backend), the services
# of env:run
[tasks."backend:run"]
description = "Run sak-backend on http://localhost:8080, its ingress, victorialogs and mailpit come from env:run"
env = {
    SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data",
    SAK_OPENROUTER_API_TOKEN = "{{ get_env(name='SAK_OPENROUTER_API_TOKEN', default=exec(command='pass show openrouter/pelle/api-key | head -n1')) }}"
}
run = """
if curl -s -o /dev/null --max-time 2 http://localhost:8080/; then
  echo "a backend runs already on http://localhost:8080, stop it first" >&2
  exit 1
fi
mkdir -p "$SAK_LOCAL_DATA_DIR"
./gradlew :sak-backend:run --args="-config={{config_root}}/config/local-config.yaml"
"""

[tasks."frontend:run"]
description = "Run sak-frontend, the apps, on http://localhost:4200, its /api goes to backend:run"
dir = "{{config_root}}/sak-frontend"
run = """
[ -d node_modules ] || npm ci
npx ng serve
"""

# the end to end tests of sak-e2e need the local environment of `mise run run`
[tasks."e2e:install"]
description = "Install playwright and its chromium for the end to end tests in sak-e2e"
dir = "{{config_root}}/sak-e2e"
run = """
npm ci
npx playwright install chromium
"""

[tasks."e2e:run"]
description = "Run the end to end tests of sak-e2e against the environment of mise run run"
dir = "{{config_root}}/sak-e2e"
# extra arguments go to playwright (e.g. `mise run e2e:run -- --headed`)
run = """
[ -d node_modules ] || mise run e2e:install
npx playwright test
"""

# everything at once, each in its own process group with its log in build/local/logs; the backend
# first, its build installs the npm dependencies of the frontend, which must not change under its
# dev server. Ctrl-C stops everything.
[tasks."run"]
description = "Run the services of env:run, the backend and the frontend until Ctrl-C"
# the script keeps the process groups of the tasks in an array
shell = "bash -c"
run = '''
logs="{{config_root}}/build/local/logs"
mkdir -p "$logs"
pids=()

stop() {
  # the terminal hands Ctrl-C to mise as well, which passes it on again: ignored while stopping
  trap '' INT TERM
  trap - EXIT
  echo
  echo "stopping everything…"
  for pid in "${pids[@]}"; do kill -INT -- "-$pid" 2>/dev/null; done
  # gradle hands the backend to its daemon, which stops it once its client is gone
  for _ in $(seq 1 30); do
    alive=0
    for pid in "${pids[@]}"; do kill -0 -- "-$pid" 2>/dev/null && alive=1; done
    [ "$alive" = 0 ] && break
    sleep 0.5
  done
  for pid in "${pids[@]}"; do kill -KILL -- "-$pid" 2>/dev/null; done
  pkill -f 'io.pelle.sak.backend.SakBackendKt' 2>/dev/null
  docker compose -p sak-local down >/dev/null 2>&1
  echo "stopped"
}
trap stop INT TERM EXIT

# starts a task in its own process group, so stop() reaches everything it starts
start() {
  setsid mise run "$1" > "$logs/$1.log" 2>&1 < /dev/null &
  pids+=($!)
}

# waits for the line in the log of the task, gives up when the task ended or after the seconds
await() {
  local task=$1 line=$2 seconds=$3 pid=$4
  for _ in $(seq 1 "$seconds"); do
    grep -q "$line" "$logs/$task.log" && return 0
    if ! kill -0 "$pid" 2>/dev/null; then
      echo "$task did not start, see $logs/$task.log" >&2
      return 1
    fi
    sleep 1
  done
  echo "$task did not start within $seconds seconds, see $logs/$task.log" >&2
  return 1
}

echo "starting the ingress, victorialogs and mailpit…"
start env:run
await env:run "the services are up" 300 "${pids[0]}" || exit 1

echo "starting the backend…"
start backend:run
await backend:run "Responding at" 600 "${pids[1]}" || exit 1

echo "starting the frontend…"
start frontend:run
await frontend:run "Local:" 180 "${pids[2]}" || exit 1

cat <<ADDRESSES

  frontend   http://localhost:4200   the apps
  backend    http://localhost:8080   api at /api/v1, swagger ui at /swagger/
  ingress    https://apps.localhost  the apps behind caddy, its certificate is caddy's own,
             https://api.localhost   their api at /v1 and the s3 api of the buckets
  mailpit    http://localhost:8025   every login link arrives here
  logs       http://localhost:9428   victorialogs, vector ships the access log of the ingress

  sign in as admin@localhost (config/local-config.yaml), open the link
  from mailpit in the same browser

  logs in $logs
  Ctrl-C stops everything

ADDRESSES
wait
'''
