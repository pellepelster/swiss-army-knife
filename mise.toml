[tools]
# the jdk of the gradle toolchain (buildSrc, sak.java-conventions)
java = "temurin-25.0.5+8.0.LTS"
# builds and tests sak-frontend, the gradle build calls npm
node = "22.22.3"
# ansible and pipx exist for linux and macOS only; sakctl runs ansible in its image of the tools
"pipx:ansible-core" = { version = "2.18.19", os = ["linux", "macos"] }
# the backend the `pipx:` tool above installs with
pipx = { version = "1.17.2", os = ["linux", "macos"] }
# sakctl (sak-cli): tauri 2 with its rust core in sak-cli/src-tauri/ and the static web ui in
# sak-cli/ui/; the tauri cli comes from npm as a prebuilt binary, node only runs it
rust = "1.99.1"
"npm:@tauri-apps/cli" = "2.12.4"
# the documentation as a site (site/): hugo, and go for its modules (the theme relearn)
"hugo-extended" = "0.168.0"
go = "1.26.0"
# runs the tests of sakctl and sak-cloud, with a junit report (.config/nextest.toml of each crate)
"github:nextest-rs/nextest" = { version = "0.9.150", version_prefix = "cargo-nextest-" }
# the next version of `release`, from the tags v<version>
svu = "3.4.1"

# the version of SAK, the same for all its artifacts (#127): the build of a tag v<version> gets it
# from the workflow as its tag, the artifacts take it without the v; latest everywhere else
[env]
VERSION = "{{ get_env(name='VERSION', default='latest') | trim_start(pat='v') }}"

# the images of the server and of sakctl, built and pushed to ghcr.io: the tools sakctl runs in a
# container (sak-cli/Dockerfile) and the canary proving a container runtime works on its start
# (sak-cli/canary/Dockerfile)
[vars]
backend_image = "ghcr.io/pellepelster/sak-backend"
ingress_image = "ghcr.io/pellepelster/sak-ingress"
cli_image = "ghcr.io/pellepelster/sak-cli-tools"
cli_canary = "ghcr.io/pellepelster/sak-cli-docker-canary"

# REGISTRY_USERNAME and REGISTRY_PASSWORD: a github user and a token of it with write:packages,
# in the workflow github.actor and its GITHUB_TOKEN
[tasks."registry:login"]
description = "Log in to ghcr.io"
run = """
if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
  echo "set REGISTRY_USERNAME and REGISTRY_PASSWORD to log in to ghcr.io" >&2
  exit 1
fi
printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
"""

# the images of the server, sak-backend (the controller) and sak-ingress (caddy), each built,
# tested and pushed on its own (the github workflow runs them in parallel); the layers are
# cached in the registry next to the image, tag buildcache: every build reads it, the push
# writes it. A build is for the platform it runs on, into the local images; --load keeps it
# there when buildx builds in a container of its own (the github workflow)
[tasks."backend:image:build"]
description = "Build the sak-backend image"
run = """
./gradlew :sak-backend:installDist
docker buildx build --load --tag {{vars.backend_image}}:latest \
  --cache-from type=registry,ref={{vars.backend_image}}:buildcache sak-backend
"""

[tasks."backend:image:test"]
description = "Test the sak-backend image"
depends = ["backend:image:build"]
run = """
set -e
image={{vars.backend_image}}:latest
[ "$(docker run --rm --entrypoint id "$image" -u)" = "10000" ]
docker run --rm --entrypoint java "$image" -version
docker run --rm --entrypoint test "$image" -x /opt/sak-backend/bin/sak-backend
echo "the image of sak-backend works"
"""

# for amd64 and arm64, tagged <VERSION>-rc (`release:docker` makes it <VERSION>) and with the commit it
# was built from; the platform not running here needs qemu (binfmt)
[tasks."backend:image:push"]
description = "Push the sak-backend image"
run = """
./gradlew :sak-backend:installDist
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" \
  --tag {{vars.backend_image}}:${VERSION}-rc --tag {{vars.backend_image}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.backend_image}}:buildcache \
  --cache-to type=registry,ref={{vars.backend_image}}:buildcache,mode=max,image-manifest=true \
  --push sak-backend
"""

[tasks."ingress:image:build"]
description = "Build the sak-ingress image"
run = """
docker buildx build --load --tag {{vars.ingress_image}}:latest \
  --cache-from type=registry,ref={{vars.ingress_image}}:buildcache sak-ingress
"""

[tasks."ingress:image:test"]
description = "Test the sak-ingress image"
depends = ["ingress:image:build"]
run = """
set -e
image={{vars.ingress_image}}:latest
[ "$(docker run --rm --entrypoint id "$image" -u)" = "10000" ]
docker run --rm "$image" version
docker run --rm "$image" validate --config /etc/caddy/Caddyfile --adapter caddyfile
echo "the image of sak-ingress works"
"""

[tasks."ingress:image:push"]
description = "Push the sak-ingress image"
run = """
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" \
  --tag {{vars.ingress_image}}:${VERSION}-rc --tag {{vars.ingress_image}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.ingress_image}}:buildcache \
  --cache-to type=registry,ref={{vars.ingress_image}}:buildcache,mode=max,image-manifest=true \
  --push sak-ingress
"""

# sakctl (sak-cli). On linux the webview needs the webkitgtk headers, on debian/ubuntu:
# sudo apt install libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

# the npm dependencies of sak-theme (its bootstrap), installed again when its package-lock.json changed
[tasks."theme:install"]
description = "Install the npm dependencies of sak-theme"
dir = "{{config_root}}/sak-theme"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
shell = "bash -c"
run = "npm ci --no-audit --no-fund"

# the npm dependencies of sak-frontend, as the gradle build installs them (:sak-frontend:npmCi),
# again only when package.json or package-lock.json changed
[tasks."frontend:install"]
description = "Install the npm dependencies of sak-frontend"
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:npmCi"

# the apps built into sak-frontend/dist/, as the jar of the backend takes them (:sak-frontend:npmBuild);
# gradle builds again only what changed
[tasks."frontend:build"]
description = "Build sak-frontend"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:npmBuild"

# the theme of sak-theme with its bootstrap, copied into sak-cli/ui/theme/ (not committed): tauri
# bundles sak-cli/ui/ alone
[tasks."cli:theme"]
description = "Copy sak-theme into the sakctl ui"
depends = ["theme:install"]
dir = "{{config_root}}/sak-cli"
# bash on windows too (git bash), where mise would run cmd
shell = "bash -c"
run = """
rm -rf ui/theme
mkdir -p ui/theme
cp ../sak-theme/node_modules/bootstrap/dist/css/bootstrap.min.css ui/theme/
cp ../sak-theme/tokens.css ../sak-theme/bootstrap.css ../sak-theme/fonts.css ../sak-theme/components.css ui/theme/
cp -r ../sak-theme/fonts ui/theme/fonts
cp -r ../sak-theme/icons ui/theme/icons
"""

# without arguments the window, with a command (list, create, deploy, destroy, --help) the command line:
# `mise run cli:run -- list`; tauri dev passes what follows its second -- to the app. The token
# comes from pass unless HCLOUD_TOKEN is set
[tasks."cli:run"]
description = "Run sakctl with reload"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
usage = '''
arg "<args>" var=#true default="" help="nothing for the window, or list, create [<name>], deploy <name> or destroy <name>"
'''
run = '''
eval "set -- ${usage_args}"
if [ $# -eq 0 ]; then
  tauri dev
else
  tauri dev -- -- "$@"
fi
'''

# the bundles of the platform it runs on (deb, rpm and AppImage on linux, dmg on macos,
# msi and nsis on windows) land in sak-cli/src-tauri/target/release/bundle/
[tasks."cli:build"]
description = "Build the sakctl installers"
depends = ["cli:theme", "tools:image:build", "canary:image:build"]
dir = "{{config_root}}/sak-cli"
run = "tauri build"

# sakctl as one native binary for a platform, without installers, zipped with its executable bit
# to sak-cli/build/sak-cli-<platform>-<VERSION>.zip, its sha-256 next to it in <zip>.sha256; each
# runs on its own platform (the workflow, job sakctl). macOS gets one universal binary for apple
# silicon and intel
[tasks."cli:build:linux"]
description = "Build sakctl for linux"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli"
run = """
tauri build --no-bundle
mkdir -p build
rm -f "build/sak-cli-linux-${VERSION}.zip"
zip -j "build/sak-cli-linux-${VERSION}.zip" src-tauri/target/release/sakctl
(cd build && sha256sum "sak-cli-linux-${VERSION}.zip" > "sak-cli-linux-${VERSION}.zip.sha256")
"""

[tasks."cli:build:macos"]
description = "Build sakctl for macOS"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli"
run = """
rustup target add aarch64-apple-darwin x86_64-apple-darwin
tauri build --target universal-apple-darwin --no-bundle
mkdir -p build
rm -f "build/sak-cli-macos-${VERSION}.zip"
zip -j "build/sak-cli-macos-${VERSION}.zip" src-tauri/target/universal-apple-darwin/release/sakctl
(cd build && shasum -a 256 "sak-cli-macos-${VERSION}.zip" > "sak-cli-macos-${VERSION}.zip.sha256")
"""

# in git bash, which has no zip; 7-Zip is there instead. -e: a failed step ends the task, as sh
# does for the others
[tasks."cli:build:windows"]
description = "Build sakctl for windows"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli"
shell = "bash -e -c"
run = """
tauri build --no-bundle
mkdir -p build
rm -f "build/sak-cli-windows-${VERSION}.zip"
7z a -tzip "build/sak-cli-windows-${VERSION}.zip" ./src-tauri/target/release/sakctl.exe
(cd build && sha256sum "sak-cli-windows-${VERSION}.zip" > "sak-cli-windows-${VERSION}.zip.sha256")
"""

# the zips of all platforms and their checksums (sak-cli/build/, from cli:build:<platform>) as the
# assets of the github release of the tag v<VERSION>, where the installation downloads them:
# .../releases/download/v<VERSION>/sak-cli-<platform>-<VERSION>.zip. Needs gh and GH_TOKEN with
# contents: write (the workflow, job release, on a tag only)
[tasks."cli:release"]
description = "Publish the sakctl GitHub release"
dir = "{{config_root}}/sak-cli"
run = """
set -eu
files=""
for platform in linux macos windows; do
  zip="build/sak-cli-${platform}-${VERSION}.zip"
  [ -f "$zip" ] && [ -f "$zip.sha256" ] || { echo "$zip or its checksum is missing" >&2; exit 1; }
  files="$files $zip $zip.sha256"
done
gh release create "v${VERSION}" --verify-tag --title "sakctl $VERSION" \
  --notes "sakctl for linux, macOS and windows, built from $(git rev-parse --short=12 HEAD)." $files
"""

# the wizard on the command line, the same code as its pages: list, create [<name>],
# deploy <name> or destroy <name>, the token from pass, SAK_NAME, SAK_PASSWORD and SAK_LOCATION from the
# environment, e.g. SAK_NAME=test SAK_PASSWORD=… mise run cli:sakctl -- create
[tasks."cli:sakctl"]
description = "Run the sakctl command line"
dir = "{{config_root}}/sak-cli/src-tauri"
# the terminal of the user, not a pipe: the prompts of the passwords and an ssh session need it
raw = true
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
usage = '''
arg "<args>" var=#true help="list, create [<name>], deploy <name>, destroy <name> or ssh <name>"
'''
run = '''
eval "set -- ${usage_args}"
cargo run -q -- "$@"
'''

# each image built, tested and pushed on its own (the github workflow runs them in parallel); the
# layers are cached in the registry next to the image, tag buildcache: every build reads it, the
# push writes it. A build is for the platform it runs on, into the local images; --load keeps it
# there when buildx builds in a container of its own (the github workflow). The context is the
# repository, the image takes the ansible collection of ansible/
[tasks."tools:image:build"]
description = "Build the tools image"
dir = "{{config_root}}/sak-cli"
run = """
docker buildx build --load --file Dockerfile --tag {{vars.cli_image}}:latest \
  --cache-from type=registry,ref={{vars.cli_image}}:buildcache ..
"""

[tasks."tools:image:test"]
description = "Test the tools image"
depends = ["tools:image:build"]
run = """
set -e
image={{vars.cli_image}}:latest
[ "$(docker run --rm "$image" id -u):$(docker run --rm "$image" id -g)" = "1000:1000" ]
[ "$(docker run --rm "$image" id -un)" = "sak" ]
docker run --rm "$image" ansible --version
docker run --rm "$image" ansible-galaxy collection list community.general
docker run --rm "$image" ansible-galaxy collection list pelle_io.sak | grep -q "^pelle_io.sak "
docker run --rm "$image" ansible-playbook --list-tasks pelle_io.sak.backend | grep -q "pelle_io.sak.backend :"
docker run --rm "$image" ansible-playbook --list-tasks pelle_io.sak.server | grep -q "pelle_io.sak.storage :"
docker run --rm "$image" ansible localhost -m ping
# the callback posts the events of a run to the endpoint with the token of the run
docker run --rm -v "{{config_root}}/sak-cli/image-test:/test:ro" "$image" sh /test/callback.sh
echo "the image of the tools works"
"""

# for amd64 and arm64 (the macs), tagged <VERSION>-rc (`release:docker` makes it <VERSION>) and with the
# commit it was built from; the platform not running here needs qemu (binfmt)
[tasks."tools:image:push"]
description = "Push the tools image"
dir = "{{config_root}}/sak-cli"
run = """
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" --file Dockerfile \
  --tag {{vars.cli_image}}:${VERSION}-rc --tag {{vars.cli_image}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.cli_image}}:buildcache \
  --cache-to type=registry,ref={{vars.cli_image}}:buildcache,mode=max,image-manifest=true \
  --push ..
"""

[tasks."canary:image:build"]
description = "Build the canary image"
dir = "{{config_root}}/sak-cli/canary"
run = """
docker buildx build --load --tag {{vars.cli_canary}}:latest \
  --cache-from type=registry,ref={{vars.cli_canary}}:buildcache .
"""

[tasks."canary:image:test"]
description = "Test the canary image"
depends = ["canary:image:build"]
run = """
[ "$(docker run --rm {{vars.cli_canary}}:latest)" = "sak-cli-docker-canary" ]
echo "the canary works"
"""

[tasks."canary:image:push"]
description = "Push the canary image"
dir = "{{config_root}}/sak-cli/canary"
run = """
docker buildx build --platform "${SAK_DOCKER_PLATFORMS:-linux/amd64,linux/arm64}" \
  --tag {{vars.cli_canary}}:${VERSION}-rc --tag {{vars.cli_canary}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.cli_canary}}:buildcache \
  --cache-to type=registry,ref={{vars.cli_canary}}:buildcache,mode=max,image-manifest=true \
  --push .
"""

# the next patch version of main as the tag v<version>, pushed: the workflow builds the tag and
# releases it as <version> (the images, sakctl and the documentation). Only from a clean main that
# is the same as origin/main, the commit of the tag must be on github
[tasks."release"]
description = "Tag and push the next release"
run = """
set -eu
[ -z "$(git status --porcelain)" ] || { echo "the repository is not clean" >&2; exit 1; }
[ "$(git branch --show-current)" = main ] || { echo "a release is made from main only" >&2; exit 1; }
git fetch --tags origin main
[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "main is not the same as origin/main" >&2; exit 1; }
version=$(svu patch)
git tag -a "$version" -m "Release $version"
git push origin "$version"
echo "tagged $version, the workflow builds and releases it"
"""

# every image of SAK for the platform it runs on, into the local images: the server (sak-backend,
# sak-ingress) and sakctl (the tools, the canary)
[tasks."docker:all:build"]
description = "Build all images"
depends = ["backend:image:build", "ingress:image:build", "tools:image:build", "canary:image:build"]

# every image of SAK for amd64 and arm64, pushed to ghcr.io as <VERSION>-rc (and with the commit);
# `release:docker` makes them <VERSION>. Needs a login to ghcr.io (registry:login). SAK_DOCKER_PLATFORMS
# selects other platforms, e.g. only the one of this machine, which needs no qemu
[tasks."docker:all:push"]
description = "Push all images as <VERSION>-rc"
depends = ["backend:image:push", "ingress:image:push", "tools:image:push", "canary:image:push"]

# the images of a build, pushed as <VERSION>-rc by their push tasks, as <VERSION>: the registry
# copies the manifest of both platforms, nothing is pulled. Run when all images are pushed (the
# workflow, job release); sakctl and the servers take <VERSION> only after it
[tasks."release:docker"]
description = "Release the <VERSION>-rc images as <VERSION>"
run = """
for image in {{vars.backend_image}} {{vars.ingress_image}} {{vars.cli_image}} {{vars.cli_canary}}; do
  docker buildx imagetools create --tag "$image:${VERSION}" "$image:${VERSION}-rc"
done
"""

# the services of config/local-compose.yaml next to the backend of local:backend:run: the ingress on 80
# and 443 (admin api 2019), victorialogs 9428 and the mailpit the login links go to, 1025 (smtp)
# and 8025 (web ui); in the foreground with their logs until Ctrl-C
[tasks."local:env:run"]
description = "Run ingress, victorialogs and mailpit"
env = {
    SAK_LOCAL_DIR = "{{config_root}}/build/local",
    SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data"
}
run = """
# created before docker would create them owned by root
mkdir -p "$SAK_LOCAL_DATA_DIR/s3" "$SAK_LOCAL_DIR/ingress/log" "$SAK_LOCAL_DIR/victorialogs" "$SAK_LOCAL_DIR/vector"
export SAK_LOCAL_UID=$(id -u) SAK_LOCAL_GID=$(id -g)
export SAK_VICTORIALOGS_IMAGE=$(sed -n 's/^backend_victorialogs_image: //p' ansible/roles/backend/defaults/main.yml)
export SAK_VECTOR_IMAGE=$(sed -n 's/^backend_vector_image: //p' ansible/roles/backend/defaults/main.yml)
compose="docker compose -f {{config_root}}/config/local-compose.yaml"
$compose up -d --build --wait --remove-orphans
# sh skips the exit trap when a signal ends it, Ctrl-C takes the services down as well
trap "docker compose -p sak-local down" EXIT
trap "exit 130" INT TERM
echo "the services are up"
$compose logs -f
"""

# the ports do not clash: backend 8080, frontend 4200 (proxies /api to the backend), the services
# of local:env:run
[tasks."local:backend:run"]
description = "Run sak-backend"
env = {
    SAK_LOCAL_DATA_DIR = "{{config_root}}/build/local/data",
    SAK_IPV4 = "192.0.2.1",
    # the argon2id hash of `a password of sixteen`, the password login of the local backend
    SAK_LOCAL_ADMIN_PASSWORD_HASH = "$argon2id$v=19$m=65536,t=3,p=1$al/AGZtQJD5CTnS21yvIXg$L7n0a0d/Gu4awCZm7tuz99SWhVvUedmj0UABpTBu6l4",
    SAK_OPENROUTER_API_TOKEN = "{{ get_env(name='SAK_OPENROUTER_API_TOKEN', default=exec(command='pass show openrouter/pelle/api-key | head -n1')) }}"
}
run = """
if curl -s -o /dev/null --max-time 2 http://localhost:8080/; then
  echo "a backend runs already on http://localhost:8080, stop it first" >&2
  exit 1
fi
mkdir -p "$SAK_LOCAL_DATA_DIR"
./gradlew :sak-backend:run --args="-config={{config_root}}/config/local-config.yaml"
"""

[tasks."local:frontend:run"]
description = "Run sak-frontend"
depends = ["frontend:install"]
dir = "{{config_root}}/sak-frontend"
run = "npx ng serve"

# the page of sakctl's window and the answers of rust for it, what the window screenshots and its
# video show (sak-cli/src-tauri/src/core/deployments/window_fixtures.rs)
[tasks."docs:window"]
description = "Prepare the sakctl window fixtures"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli/src-tauri"
run = "cargo test window_fixtures -- --ignored"

# the version of sakctl and the checksums of its zips in sak-cli/build/ (cli:build:<platform>, in
# the workflow those of all platforms) for the installation, as site/data/sakctl.yaml; a platform
# without a zip shows <sha256>
[tasks."docs:data"]
description = "Write the sakctl data of the docs"
dir = "{{config_root}}/site"
run = """
set -eu
mkdir -p data
{
  echo "version: '$VERSION'"
  # the tag of the release, no tag for a build that is not one
  [ "$VERSION" = latest ] && echo "release: 'latest'" || echo "release: 'v$VERSION'"
  echo "checksums:"
  for platform in linux macos windows; do
    checksum="../sak-cli/build/sak-cli-${platform}-${VERSION}.zip.sha256"
    [ -f "$checksum" ] && echo "  $platform: '$(cut -d ' ' -f 1 "$checksum")'"
  done
  true
} > data/sakctl.yaml
"""

# the documents of docs/ as a site with the theme relearn in the look of sak-theme (site/),
# reloaded on every change: http://localhost:1313
[tasks."docs:serve"]
description = "Serve the docs"
depends = ["docs:data"]
dir = "{{config_root}}/site"
run = "hugo server"

# the same site as files in build/site; a link that does not resolve fails it
[tasks."docs:build"]
description = "Build the docs"
depends = ["docs:data"]
dir = "{{config_root}}/site"
run = "hugo --destination ../build/site --cleanDestinationDir --panicOnWarning"

# the screenshots of docs/development/screenshots/, taken in chromium: the apps against the
# environment of `mise run local:run` (every page on a desktop and on a phone), the window of sakctl
# in light and dark
[tasks."docs:screenshots"]
description = "Take the screenshots"
depends = ["docs:window"]
dir = "{{config_root}}"
run = "./gradlew :sak-e2e:e2eScreenshots"

# the videos of build/videos/, never committed: the tour of the apps against the environment of
# `mise run local:run` and the tour of the window of sakctl, each as .webm, .mp4 and .gif
[tasks."docs:video"]
description = "Record the videos"
depends = ["docs:window"]
dir = "{{config_root}}"
run = '''
./gradlew :sak-e2e:e2eVideos
for video in build/videos/*.webm; do
  name="${video%.webm}"
  ffmpeg -v error -y -i "$video" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$name.mp4"
  ffmpeg -v error -y -i "$video" -vf "fps=10,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen[p];[b][p]paletteuse" "$name.gif"
done
ls -lh build/videos/*.mp4 build/videos/*.gif
'''

# the tests, <part>:test:<kind> (ARCHITECTURE.md, "Tests"): unit tests need nothing but the tools
# of mise.toml, integration tests need what the machine that runs them has (docker, a browser,
# ssh-keygen), e2e tests need resources outside of it (a Hetzner Cloud project). The unit tests
# write junit reports, to build/test-results/ of each gradle module and target/nextest/ of each
# crate; the github workflow shows them

# the unit tests of every gradle module of the backend; the build of sak-backend builds the
# frontend with npm
[tasks."backend:test:unit"]
description = "Run the backend unit tests"
dir = "{{config_root}}"
run = "./gradlew test"

[tasks."frontend:test:unit"]
description = "Run the frontend unit tests"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:npmTest"

# sakctl and sak-cloud (sak-cli/cloud/, the crate that declares the cloud resources of sakctl);
# the integration tests of sakctl are in modules named integration
[tasks."cli:test:unit"]
description = "Run the cli unit tests"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli"
run = """
set -e
(cd src-tauri && cargo nextest run --no-fail-fast -E 'not test(/::integration::/)')
(cd cloud && cargo nextest run --no-fail-fast -E 'kind(lib)')
"""

# in docker: the vector configuration the backend role deploys, with its image, and sak-backend
# of the role as it renders it (backup, restore and the maintenance), next to a real victorialogs
# (ansible/roles/backend/tests/sak-backend-test.sh), and the role role_markers
# (ansible/roles/role_markers/tests/role-markers-test.sh)
[tasks."backend:test:integration"]
description = "Run the backend integration tests"
dir = "{{config_root}}"
run = """
./gradlew :sak-backend:vectorTest
ansible/roles/backend/tests/sak-backend-test.sh
ansible/roles/role_markers/tests/role-markers-test.sh
"""

# the apps in a browser against the controller and a mailpit e-mail sink (docker); playwright
# downloads its chromium on the first run
[tasks."frontend:test:integration"]
description = "Run the frontend integration tests"
depends = ["frontend:install"]
dir = "{{config_root}}"
run = "./gradlew :sak-frontend:e2eTest"

# the tests of sakctl in modules named integration: docker and podman (they pull the canary and
# the image of the tools from ghcr.io), the ssh session in the image of the tools, ssh-keygen
[tasks."cli:test:integration"]
description = "Run the cli integration tests"
depends = ["cli:theme"]
dir = "{{config_root}}/sak-cli/src-tauri"
run = "cargo nextest run --no-fail-fast -E 'test(/::integration::/)'"

# the local tests of sak-e2e: the apps in chromium against the environment of `mise run local:run`;
# playwright downloads its chromium on the first run
[tasks."frontend:test:local"]
description = "Run the frontend tests against local:run"
dir = "{{config_root}}"
run = "./gradlew :sak-e2e:e2eLocal"

# against the Hetzner Cloud project of HCLOUD_TOKEN: the tests of sak-cloud against the hetzner
# cloud api, then sak-e2e: two deployments created with sakctl, built first, the logins and the apps
# in a browser against them, the login mails in a mailtrap sandbox. They create and destroy real
# resources and servers (test-<id>), which takes long and costs money. The token and the mailtrap
# credentials come from pass unless set; without them the task refuses to run. The deployments run
# the images of SAK_DOCKER_IMAGE_TAG, <VERSION>-rc unless set: outside of CI the task builds and
# pushes them first (docker:all:push), in CI the jobs of the images pushed them
[tasks."cli:test:e2e"]
description = "Run the cli e2e tests"
depends = ["cli:theme"]
dir = "{{config_root}}"
env = {
    HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}",
    MAILTRAP_API_TOKEN = "{{ get_env(name='MAILTRAP_API_TOKEN', default=exec(command='pass show mailtrap/pelle/api-token 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_HOST = "{{ get_env(name='SAK_E2E_SMTP_HOST', default=exec(command='pass show mailtrap/pelle/smtp-server 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_PORT = "{{ get_env(name='SAK_E2E_SMTP_PORT', default=exec(command='pass show mailtrap/pelle/smtp-port 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_USERNAME = "{{ get_env(name='SAK_E2E_SMTP_USERNAME', default=exec(command='pass show mailtrap/pelle/smtp-user 2>/dev/null | head -n1')) }}",
    SAK_E2E_SMTP_PASSWORD = "{{ get_env(name='SAK_E2E_SMTP_PASSWORD', default=exec(command='pass show mailtrap/pelle/smtp-password 2>/dev/null | head -n1')) }}"
}
run = """
set -e
for variable in HCLOUD_TOKEN MAILTRAP_API_TOKEN SAK_E2E_SMTP_HOST SAK_E2E_SMTP_PORT SAK_E2E_SMTP_USERNAME SAK_E2E_SMTP_PASSWORD; do
  [ -n "$(printenv "$variable")" ] || { echo "set $variable, refer to sak-e2e/README.md" >&2; exit 1; }
done
# sakctl first: a build that fails stops the task before any server is created
(cd sak-cli/src-tauri && cargo build)
# the images of this source, as the deployments of the tests run them
# for amd64, the servers of the tests, and the platform of this machine, which runs the tools,
# unless SAK_DOCKER_PLATFORMS says otherwise
if [ -z "${CI:-}" ]; then
  case "$(uname -m)" in
    aarch64 | arm64) platform=linux/amd64,linux/arm64 ;;
    *) platform=linux/amd64 ;;
  esac
  mise run docker:all:build
  SAK_DOCKER_PLATFORMS="${SAK_DOCKER_PLATFORMS:-$platform}" mise run docker:all:push
fi
export SAK_DOCKER_IMAGE_TAG="${SAK_DOCKER_IMAGE_TAG:-${VERSION}-rc}"
# one test at a time: the tests against the hetzner cloud api share their ssh key and names
(cd sak-cli/cloud && cargo nextest run --no-fail-fast --test-threads 1 -E 'kind(test)')
./gradlew :sak-e2e:e2eIntegration --console=plain
"""

# everything at once, each in its own process group with its log in build/local/logs. The npm
# dependencies of the frontend first (frontend:install), so neither the build of the backend nor the
# dev server changes them under the other. Ctrl-C stops everything.
[tasks."local:run"]
description = "Run everything locally"
depends = ["frontend:install"]
# the script keeps the process groups of the tasks in an array
shell = "bash -c"
run = '''
logs="{{config_root}}/build/local/logs"
mkdir -p "$logs"
pids=()

stop() {
  # the terminal hands Ctrl-C to mise as well, which passes it on again: ignored while stopping
  trap '' INT TERM
  trap - EXIT
  echo
  echo "stopping everything…"
  for pid in "${pids[@]}"; do kill -INT -- "-$pid" 2>/dev/null; done
  # gradle hands the backend to its daemon, which stops it once its client is gone
  for _ in $(seq 1 30); do
    alive=0
    for pid in "${pids[@]}"; do kill -0 -- "-$pid" 2>/dev/null && alive=1; done
    [ "$alive" = 0 ] && break
    sleep 0.5
  done
  for pid in "${pids[@]}"; do kill -KILL -- "-$pid" 2>/dev/null; done
  pkill -f 'io.pelle.sak.backend.SakBackendKt' 2>/dev/null
  docker compose -p sak-local down >/dev/null 2>&1
  echo "stopped"
}
trap stop INT TERM EXIT

# starts a task in its own process group, so stop() reaches everything it starts
start() {
  setsid mise run "$1" > "$logs/$1.log" 2>&1 < /dev/null &
  pids+=($!)
}

# waits for the line in the log of the task, gives up when the task ended or after the seconds
await() {
  local task=$1 line=$2 seconds=$3 pid=$4
  for _ in $(seq 1 "$seconds"); do
    grep -q "$line" "$logs/$task.log" && return 0
    if ! kill -0 "$pid" 2>/dev/null; then
      echo "$task did not start, see $logs/$task.log" >&2
      return 1
    fi
    sleep 1
  done
  echo "$task did not start within $seconds seconds, see $logs/$task.log" >&2
  return 1
}

echo "starting the ingress, victorialogs and mailpit…"
start local:env:run
await local:env:run "the services are up" 300 "${pids[0]}" || exit 1

echo "starting the backend…"
start local:backend:run
await local:backend:run "Responding at" 600 "${pids[1]}" || exit 1

echo "starting the frontend…"
start local:frontend:run
await local:frontend:run "Local:" 180 "${pids[2]}" || exit 1

cat <<ADDRESSES

  frontend   http://localhost:4200   the apps
  backend    http://localhost:8080   api at /api/v1, swagger ui at /swagger/
  ingress    https://sak.localhost   the apps behind caddy, its certificate is caddy's own,
             https://api.localhost   their api at /v1 and the s3 api of the buckets
  mailpit    http://localhost:8025   every login link arrives here
  logs       http://localhost:9428   victorialogs, vector ships the access log of the ingress

  sign in as admin@localhost (config/local-config.yaml), open the link
  from mailpit in the same browser

  logs in $logs
  Ctrl-C stops everything

ADDRESSES
wait
'''
