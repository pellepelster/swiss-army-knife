# the backend of `mise run backend:run`, its data lives below build/local/; the frontend
# (`mise run frontend:run`) proxies /api to it, the login links go to the mailpit backend:run
# starts
ktor:
  deployment:
    port: 8080
sak:
  data_dir: $SAK_LOCAL_DATA_DIR
  root_domain: localhost
  # nothing listens here, so a caddy on its default admin port is never reconfigured
  caddy_admin_url: http://localhost:12019
  auth:
    # the login links lead to the dev server of mise run run, also for the frontend the backend
    # serves on 8080
    frontend_url: http://localhost:4300
    # every login link lands in mailpit, none leaves the machine
    admins:
      - admin@localhost
      - pelle@pelle.io
    smtp:
      host: localhost
      port: 1025
      from: login@localhost
      starttls: false
  # mise run backend:run takes the token from pass (openrouter/pelle/api-key)
  openrouter:
    api_token: $SAK_OPENROUTER_API_TOKEN
