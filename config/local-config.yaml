# the backend of `mise run local:backend:run`, its data lives below build/local/; the frontend
# (`mise run local:frontend:run`) proxies /api to it, the login links go to the mailpit of
# config/local-compose.yaml
ktor:
  deployment:
    port: 8080
sak:
  data_dir: $SAK_LOCAL_DATA_DIR
  root_domain: localhost
  # the hosts right below localhost: sak.localhost and api.localhost
  dns_mode: domain
  # the ingress of config/local-compose.yaml
  caddy_admin_url: http://localhost:2019
  auth:
    # the login links lead to the dev server of mise run local:run, also for the frontend the backend
    # serves on 8080
    frontend_url: http://localhost:4200
    # every login link lands in mailpit, none leaves the machine
    admins:
      - admin@localhost
    # the hash of the local admin password `a password of sixteen`, set by mise run
    # local:backend:run (a value starting with $ here would be read as a variable)
    admin_password: $SAK_LOCAL_ADMIN_PASSWORD_HASH
    smtp:
      host: localhost
      port: 1025
      from: login@localhost
      starttls: false
  # the victorialogs of config/local-compose.yaml, vector ships the access log of its ingress
  logs:
    victorialogs_url: http://127.0.0.1:9428
  # a dummy address of the server from mise run local:backend:run (192.0.2.1, reserved for
  # documentation), the health checks of the domains have something to compare with; no domain
  # points there, they show as unhealthy
  addresses:
    ipv4: $SAK_IPV4
