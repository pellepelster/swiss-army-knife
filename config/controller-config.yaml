---
ktor:
  deployment:
    port: 8080
sak:
  data_dir: /storage/data/controller/data
  root_domain: pelle.io
  redirects:
    solidblocks.de: pelle.io
    krawallbu.de: pelle.io
    krawallbude.de: pelle.io
    pellepelster.de: pelle.io
    sanne.li: pelle.io
  # the domains buckets are served at, the buckets and their keys are created in the console
  s3:
    buckets:
      pelle.io:
        domains:
          - pelle.io
  # the console at console.pelle.io, its login links are sent through scaleway's
  # transactional email (smtp credentials from pass, see `mise run tf`)
  auth:
    admins:
      - pelle@pelle.io
    smtp:
      host: $SAK_SMTP_HOST
      port: $SAK_SMTP_PORT
      username: $SAK_SMTP_USERNAME
      password: $SAK_SMTP_PASSWORD
      from: noreply@mail.pelle.io
      # implicit tls on port 465
      tls: true
