---
ktor:
  deployment:
    port: 8080
sak:
  data_dir: /storage/data/backend/data
  root_domain: pelle.io
  # the keys the secrets are encrypted with by their version, the highest encrypts; terraform
  # creates them (infra/main.tf, random_bytes.secret_key_1) and writes them to backend.env
  secret_keys:
    1: $SAK_SECRET_KEY_1
  auth:
    admins:
      - pelle@pelle.io
    smtp:
      host: $SAK_SMTP_HOST
      port: $SAK_SMTP_PORT
      username: $SAK_SMTP_USERNAME
      password: $SAK_SMTP_PASSWORD
      from: noreply@mail.pelle.io
      # implicit tls on port 465
      tls: true
  # reads the text in the photos of notes, the token comes from pass (openrouter/pelle/api-key)
  openrouter:
    api_token: $SAK_OPENROUTER_API_TOKEN
