---
- name: Check that the required variables are set
  ansible.builtin.assert:
    that:
      - sak_name | default('') | length > 0
      - sak_dns_mode in ['domain', 'subdomain']
      - sak_root_domain | default('') | length > 0
      - sak_api_public_key is match('^[A-Za-z0-9+/]{43}=$')
      - not (sak_smtp_enabled | bool) or (sak_admin_email | default('', true) | length > 0)
      - backend_env_src | length > 0
    fail_msg: "sak_name, sak_dns_mode (domain or subdomain), sak_root_domain, sak_api_public_key (32 bytes as base64), sak_admin_email (with sak_smtp_enabled) and backend_env_src must be set"
    quiet: true

# sqlite3, zstd, age and curl for sak-backup and sak-restore
- name: Install podman and the tools of the backup
  ansible.builtin.apt:
    name:
      - podman
      - sqlite3
      - zstd
      - age
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the sak group
  ansible.builtin.group:
    name: "{{ backend_group }}"
    gid: "{{ backend_gid }}"
    system: true

- name: Create the data directory of the deployment
  ansible.builtin.file:
    path: "{{ sak_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the sak user
  ansible.builtin.user:
    name: "{{ backend_user }}"
    uid: "{{ backend_uid }}"
    group: "{{ backend_group }}"
    system: true
    home: "{{ backend_base_path }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the backend directory
  ansible.builtin.file:
    path: "{{ backend_base_path }}"
    state: directory
    owner: root
    group: "{{ backend_group }}"
    mode: "0750"

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ backend_data_path }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0750"

# the ingress runs as the same user and serves the buckets at their domains, it gets the
# directory mounted and never needs to traverse the directories above it
- name: Create the s3 data directory
  ansible.builtin.file:
    path: "{{ backend_s3_data_path }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0750"

- name: Create the ingress data directory
  ansible.builtin.file:
    path: "{{ backend_ingress_data_path }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0700"

# caddy writes its logs here, vector gets the directory mounted before caddy may have created it
- name: Create the ingress log directory
  ansible.builtin.file:
    path: "{{ backend_ingress_data_path }}/log"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0700"

- name: Create the log data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ backend_user }}"
    group: "{{ backend_group }}"
    mode: "0700"
  loop:
    - "{{ backend_victorialogs_data_path }}"
    - "{{ backend_vector_data_path }}"

# made on the server, never by the controller; victorialogs reads it as the user sak
- name: Create the key of the partition endpoints of victorialogs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      umask 077
      head -c 32 /dev/urandom | base64 > {{ backend_victorialogs_auth_key_file | quote }}
      chown {{ backend_user }}:{{ backend_group }} {{ backend_victorialogs_auth_key_file | quote }}
      chmod 0400 {{ backend_victorialogs_auth_key_file | quote }}
    creates: "{{ backend_victorialogs_auth_key_file }}"
    executable: /bin/bash
  notify: Restart sak-victorialogs

# called by sakctl through ssh (sakctl backup, sakctl restore), as root
- name: Install the backup scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /usr/local/bin/{{ item }}
    owner: root
    group: root
    mode: "0700"
  loop:
    - sak-backup
    - sak-restore

# every run pulls every image: sak-backend and sak-ingress at the tag CI pushes from main
# (latest), the log images at their pinned tags. A pull that brings another image than the one
# there restarts its container and removes the replaced image. Pulled here already, the vector
# configuration is validated with its image
- name: Pull the images
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      before=$(podman image inspect --format '{% raw %}{{.Id}}{% endraw %}' {{ item.image | quote }} 2>/dev/null || true)
      after=$(podman pull --quiet {{ item.image | quote }})
      [ "$before" = "$after" ] || echo "pulled $after"
    executable: /bin/bash
  loop:
    - { name: sak-backend, image: "{{ backend_image }}" }
    - { name: sak-ingress, image: "{{ backend_ingress_image }}" }
    - { name: sak-victorialogs, image: "{{ backend_victorialogs_image }}" }
    - { name: sak-vector, image: "{{ backend_vector_image }}" }
  loop_control:
    label: "{{ item.image }}"
  register: backend_pulls
  changed_when: backend_pulls.stdout is search('pulled')
  # a pull changes the server, check mode only looks
  when: not ansible_check_mode
  notify:
    - "Restart {{ item.name }}"
    - Remove replaced images

- name: Upload the vector configuration
  ansible.builtin.copy:
    src: vector.yaml
    dest: "{{ backend_vector_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: podman run --rm --network none --volume %s:/etc/vector/vector.yaml:ro {{ backend_vector_image }} validate --no-environment /etc/vector/vector.yaml
  notify: Restart sak-vector

- name: Write the backend configuration
  ansible.builtin.template:
    src: backend-config.yaml.j2
    dest: "{{ backend_config_file }}"
    owner: root
    group: "{{ backend_group }}"
    mode: "0640"
  notify: Restart sak-backend

# read by podman (as root) only, the backend gets the credentials via its environment
- name: Upload the backend environment
  ansible.builtin.copy:
    src: "{{ backend_env_src }}"
    dest: "{{ backend_env_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart sak-backend

# sak-backend was called sak-controller, its container would keep the port taken
- name: Stop the sak-controller container
  ansible.builtin.systemd_service:
    name: sak-controller
    state: stopped
  failed_when: false

# the images were uploaded as archives before they were pulled
- name: Remove the sak-controller quadlet and the image archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/containers/systemd/sak-controller.container
    - "{{ backend_base_path }}/sak-controller-image.tar.gz"
    - "{{ backend_base_path }}/sak-backend-image.tar.gz"
    - "{{ backend_base_path }}/sak-ingress-image.tar.gz"

- name: Install the quadlets
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: /etc/containers/systemd/{{ item }}.container
    owner: root
    group: root
    mode: "0644"
  loop:
    - sak-ingress
    - sak-backend
    - sak-victorialogs
    - sak-vector
  notify: "Restart {{ item }}"

# quadlet units are generated on daemon-reload and enabled by their [Install] section
- name: Start the containers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  loop:
    - sak-ingress
    - sak-backend
    - sak-victorialogs
    - sak-vector
