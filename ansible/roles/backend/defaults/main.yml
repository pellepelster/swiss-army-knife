---
# the backend, pulled on every run: CI pushes it from main
backend_image: ghcr.io/pellepelster/sak-backend:latest
# path the data volume is mounted at, the same default as the storage role
sak_mount_dir: /storage/data
# everything of the deployment lives below this path on the data volume
sak_data_dir: "{{ sak_mount_dir }}/{{ sak_name }}"
# everything of the backend lives below this path
backend_base_path: "{{ sak_data_dir }}/backend"
# mounted at the same path into the container, the backend hands caddy paths below it
backend_data_path: "{{ backend_base_path }}/data"
# the s3 api stores the buckets here (always s3 below sak.data_dir), caddy serves buckets
# with domains from it
backend_s3_data_path: "{{ backend_data_path }}/s3"
backend_config_file: "{{ backend_base_path }}/config.yaml"
# the name of the deployment (required), its dns mode and its root domain (required), written
# into the backend configuration (templates/backend-config.yaml.j2); sakctl sets them in the
# inventory of the run
sak_name: ""
sak_dns_mode: subdomain
sak_root_domain: ""
# the directory of the acme ca caddy gets its certificates from, its default issuers when empty;
# the staging ca of let's encrypt for tests
sak_acme_ca: ""
# the public half of the key sakctl signs its requests to the admin api with, 32 bytes as base64
# (required); the key itself is nowhere
sak_api_public_key: ""
# the admin signs in with the password of the deployment (its hash is SAK_ADMIN_PASSWORD_HASH of
# backend.env). Multi user (sak_smtp_enabled): the admin's address (required) is also the first of
# the e-mail login; single user: the admin has no address
sak_admin_email: ""
# the mail server of the e-mail login, multi user; without it single user, only the admin's
# password login. Its
# host, port, user name and password are SAK_SMTP_* of backend.env; without starttls the
# connection is implicit tls
sak_smtp_enabled: false
sak_smtp_tls: false
sak_smtp_starttls: true
# environment of the backend container, holds the s3 credentials the configuration references
backend_env_file: "{{ backend_base_path }}/backend.env"
# local path of the environment file (required)
backend_env_src: ""
backend_user: sak
backend_group: sak
# the user all images run as, the host user and group are identical so the files the
# containers write belong to them
backend_uid: 10000
backend_gid: 10000
# the ingress (caddy), pulled on every run like the backend
backend_ingress_image: ghcr.io/pellepelster/sak-ingress:latest
# caddy keeps its certificates and acme state here
backend_ingress_data_path: "{{ sak_data_dir }}/ingress"
# victorialogs keeps the ingress access logs the console computes the metrics of the sites
# from, it only listens on localhost; both log images are pulled at a pinned tag
backend_victorialogs_image: docker.io/victoriametrics/victoria-logs:v1.53.0
backend_victorialogs_data_path: "{{ sak_data_dir }}/victorialogs"
# longer than the longest range the console shows (30 days)
backend_victorialogs_retention: 35d
backend_victorialogs_max_disk_usage: 10GiB
# the key of the partition endpoints of victorialogs (its snapshots for the backup, but also the
# detach and delete of days), made once on the server; only sak-backup sends it
backend_victorialogs_auth_key_file: "{{ backend_base_path }}/victorialogs-partition.key"
# a snapshot that a killed sak-backup did not delete goes after this time
backend_victorialogs_snapshots_max_age: 1d
# vector ships the access log from the ingress data directory to victorialogs
backend_vector_image: docker.io/timberio/vector:0.60.0-alpine
backend_vector_data_path: "{{ sak_data_dir }}/vector"
backend_vector_config_file: "{{ backend_base_path }}/vector.yaml"
# sak-backup and sak-restore (docs/plans/backup.md) keep their working copies on the data volume,
# next to the data of the deployment, so a hard link or a rename stays on one filesystem
backend_backup_staging_path: "{{ sak_mount_dir }}/.backup-{{ sak_name }}"
backend_restore_staging_path: "{{ sak_mount_dir }}/.restore-{{ sak_name }}"
backend_restore_replaced_path: "{{ sak_mount_dir }}/.replaced-{{ sak_name }}"
# one backup or restore at a time
backend_backup_lock_file: /run/sak-backup.lock
# how long sak-restore waits for the backend to answer after the restore, in seconds
backend_restore_wait: 300
