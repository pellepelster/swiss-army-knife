---
- name: Check that the required variables are set
  ansible.builtin.assert:
    that:
      - controller_image_archive | length > 0
      - controller_ingress_image_archive | length > 0
      - controller_config_src | length > 0
      - controller_env_src | length > 0
    fail_msg: "controller_image_archive, controller_ingress_image_archive, controller_config_src and controller_env_src must be set"
    quiet: true

- name: Install podman
  ansible.builtin.apt:
    name:
      - podman
    state: present
    update_cache: true
    cache_valid_time: 3600

# earlier versions ran the controller from a distribution zip and caddy from the debian
# package, a unit in /etc/systemd/system would shadow the one quadlet generates
- name: Check for the sak-controller unit of the zip distribution
  ansible.builtin.stat:
    path: /etc/systemd/system/sak-controller.service
  register: controller_zip_unit

- name: Stop the sak-controller unit of the zip distribution
  ansible.builtin.systemd_service:
    name: sak-controller
    state: stopped
  when: controller_zip_unit.stat.exists

- name: Remove the sak-controller unit of the zip distribution
  ansible.builtin.file:
    path: /etc/systemd/system/sak-controller.service
    state: absent

- name: Remove the caddy package
  ansible.builtin.apt:
    name: caddy
    state: absent

- name: Create the sak group
  ansible.builtin.group:
    name: "{{ controller_group }}"
    gid: "{{ controller_gid }}"
    system: true

- name: Create the sak user
  ansible.builtin.user:
    name: "{{ controller_user }}"
    uid: "{{ controller_uid }}"
    group: "{{ controller_group }}"
    system: true
    home: "{{ controller_base_path }}"
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the controller directory
  ansible.builtin.file:
    path: "{{ controller_base_path }}"
    state: directory
    owner: root
    group: "{{ controller_group }}"
    mode: "0750"

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ controller_data_path }}"
    state: directory
    owner: "{{ controller_user }}"
    group: "{{ controller_group }}"
    mode: "0750"

# the ingress runs as the same user and serves the buckets at their domains, it gets the
# directory mounted and never needs to traverse the directories above it
- name: Create the s3 data directory
  ansible.builtin.file:
    path: "{{ controller_s3_data_path }}"
    state: directory
    owner: "{{ controller_user }}"
    group: "{{ controller_group }}"
    mode: "0750"

- name: Create the ingress data directory
  ansible.builtin.file:
    path: "{{ controller_ingress_data_path }}"
    state: directory
    owner: "{{ controller_user }}"
    group: "{{ controller_group }}"
    mode: "0700"

# the uploaded archives are kept, so an unchanged image is neither copied nor loaded again
- name: Upload the images
  ansible.builtin.copy:
    src: "{{ item.archive }}"
    dest: "{{ controller_base_path }}/{{ item.name }}-image.tar.gz"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { name: sak-controller, archive: "{{ controller_image_archive }}", image: "{{ controller_image }}" }
    - { name: sak-ingress, archive: "{{ controller_ingress_image_archive }}", image: "{{ controller_ingress_image }}" }
  loop_control:
    label: "{{ item.name }}"
  register: controller_image_uploads

- name: Check for the loaded images
  ansible.builtin.command:
    cmd: podman image exists {{ item.item.image }}
  loop: "{{ controller_image_uploads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: controller_images_loaded
  changed_when: false
  failed_when: controller_images_loaded.rc not in [0, 1]

- name: Load the images
  ansible.builtin.command:
    cmd: podman load --input {{ controller_base_path }}/{{ item.item.item.name }}-image.tar.gz
  loop: "{{ controller_images_loaded.results }}"
  loop_control:
    label: "{{ item.item.item.name }}"
  # the uploaded archive does not exist in check mode
  when: not ansible_check_mode and (item.item.changed or item.rc != 0)
  changed_when: true
  notify:
    - "Restart {{ item.item.item.name }}"
    - Remove replaced images

- name: Upload the controller configuration
  ansible.builtin.copy:
    src: "{{ controller_config_src }}"
    dest: "{{ controller_config_file }}"
    owner: root
    group: "{{ controller_group }}"
    mode: "0640"
  notify: Restart sak-controller

# read by podman (as root) only, the controller gets the credentials via its environment
- name: Upload the controller environment
  ansible.builtin.copy:
    src: "{{ controller_env_src }}"
    dest: "{{ controller_env_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart sak-controller

- name: Install the quadlets
  ansible.builtin.template:
    src: "{{ item }}.container.j2"
    dest: /etc/containers/systemd/{{ item }}.container
    owner: root
    group: root
    mode: "0644"
  loop:
    - sak-ingress
    - sak-controller
  notify: "Restart {{ item }}"

# quadlet units are generated on daemon-reload and enabled by their [Install] section
- name: Start the containers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    daemon_reload: true
  loop:
    - sak-ingress
    - sak-controller
