---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
    cache_valid_time: 3600

# the periodic apt jobs (apt-daily timers) refresh the package lists and run unattended-upgrade
- name: Enable periodic package list updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

# the distribution's 50unattended-upgrades stays untouched (it selects the security
# and stable origins), this file only overrides the behaviour around it
- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades-sak.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-sak
    owner: root
    group: root
    mode: "0644"

- name: Enable the unattended-upgrades service
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Enable the periodic apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
