# sakctl, the desktop app: tauri 2 with its rust core in src-tauri/ and the static web ui in ui/
[tools]
rust = "1.99.1"
# the tauri cli comes from npm as a prebuilt binary, node only runs it
node = "22.22.3"
"npm:@tauri-apps/cli" = "2.12.4"

# the image of the tools sakctl runs in a container (Dockerfile) and the canary proving a
# container runtime works on startup (canary/Dockerfile)
[vars]
image = "ghcr.io/pellepelster/sak-cli-tools"
canary = "ghcr.io/pellepelster/sak-cli-docker-canary"

# the theme of ../sak-theme with its bootstrap, copied into ui/theme/ (not committed): tauri
# bundles ui/ alone
[tasks."cli:theme"]
description = "Copy sak-theme into ui/theme/ for the page of sakctl"
dir = "{{config_root}}"
run = """
(cd ../sak-theme && npm ci --no-audit --no-fund)
rm -rf ui/theme
mkdir -p ui/theme
cp ../sak-theme/node_modules/bootstrap/dist/css/bootstrap.min.css ui/theme/
cp ../sak-theme/tokens.css ../sak-theme/bootstrap.css ../sak-theme/fonts.css ../sak-theme/components.css ui/theme/
cp -r ../sak-theme/fonts ui/theme/fonts
"""

# on linux the webview needs the webkitgtk headers, on debian/ubuntu:
# sudo apt install libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
# without arguments the window, with a command (list, create, deploy, destroy, --help) the command line:
# `mise run cli:run -- list`; tauri dev passes what follows its second -- to the app. The token
# comes from pass unless HCLOUD_TOKEN is set
[tasks."cli:run"]
description = "Run sakctl, reloading it when its rust code or ui changes; a command as argument runs its command line"
depends = ["cli:theme"]
dir = "{{config_root}}"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
usage = '''
arg "<args>" var=#true default="" help="nothing for the window, or list, create [<sak name>], deploy <sak name> or destroy <sak name>"
'''
run = '''
eval "set -- ${usage_args}"
if [ $# -eq 0 ]; then
  tauri dev
else
  tauri dev -- -- "$@"
fi
'''

# the bundles of the platform it runs on (deb, rpm and AppImage on linux, dmg on macos,
# msi and nsis on windows) land in src-tauri/target/release/bundle/
[tasks."cli:build"]
description = "Build the sakctl installers for the current platform, the image of its tools and the canary"
depends = ["cli:theme", "cli:image:build", "cli:canary:build"]
dir = "{{config_root}}"
run = "tauri build"

# the checks run real containers with the docker or podman installed, skipped without one
[tasks."cli:test"]
description = "Run the tests of sakctl"
depends = ["cli:theme"]
dir = "{{config_root}}/src-tauri"
run = "cargo test"

# sak-cloud in cloud/, the crate that declares the cloud resources of sakctl; the tests
# against the real hetzner cloud api need HCLOUD_TOKEN, taken from pass when not set, and
# skip themselves without one (the github workflow has no pass)
[tasks."cli:cloud:test"]
description = "Run the tests of sak-cloud, those against the hetzner cloud api with the token from pass"
dir = "{{config_root}}/cloud"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
run = "cargo test"

# the wizard on the command line, the same code as its pages: list, create [<sak name>],
# deploy <sak name> or destroy <sak name>, the token from pass, SAK_NAME, SAK_PASSWORD and SAK_LOCATION from the
# environment, e.g. SAK_NAME=test SAK_PASSWORD=… mise run cli:sakctl -- create
[tasks."cli:sakctl"]
description = "Run sakctl on the command line: list, create [<sak name>], deploy <sak name> or destroy <sak name>"
dir = "{{config_root}}/src-tauri"
env = { HCLOUD_TOKEN = "{{ get_env(name='HCLOUD_TOKEN', default=exec(command='pass show hetzner/pelle.io/hcloud_api_token 2>/dev/null | head -n1')) }}" }
usage = '''
arg "<args>" var=#true help="list, create [<sak name>], deploy <sak name> or destroy <sak name>"
'''
run = '''
eval "set -- ${usage_args}"
cargo run -q -- "$@"
'''

# each image built, tested and pushed on its own (the github workflow runs them in parallel); the
# layers are cached in the registry next to the image, tag buildcache: every build reads it, the
# push writes it. A build is for the platform it runs on, into the local images; --load keeps it
# there when buildx builds in a container of its own (the github workflow). The context is the
# repository, the image takes the ansible collection of ../ansible
[tasks."cli:image:build"]
description = "Build the image of the tools of sakctl, ansible and the pelle_io.sak collection"
dir = "{{config_root}}"
run = """
docker buildx build --load --file Dockerfile --tag {{vars.image}}:latest \
  --cache-from type=registry,ref={{vars.image}}:buildcache ..
"""

[tasks."cli:image:test"]
description = "Check that the image of the tools runs ansible and the pelle_io.sak collection as sak (1000:1000)"
depends = ["cli:image:build"]
run = """
set -e
image={{vars.image}}:latest
[ "$(docker run --rm "$image" id -u):$(docker run --rm "$image" id -g)" = "1000:1000" ]
[ "$(docker run --rm "$image" id -un)" = "sak" ]
docker run --rm "$image" ansible --version
docker run --rm "$image" ansible-galaxy collection list community.general
docker run --rm "$image" ansible-galaxy collection list pelle_io.sak | grep -q "^pelle_io.sak "
docker run --rm "$image" ansible-playbook --list-tasks pelle_io.sak.controller | grep -q "pelle_io.sak.controller :"
docker run --rm "$image" ansible-playbook --list-tasks pelle_io.sak.server | grep -q "pelle_io.sak.storage :"
docker run --rm "$image" ansible localhost -m ping
echo "the image of the tools works"
"""

# for amd64 and arm64 (the macs), tagged latest and with the commit it was built from; the
# platform not running here needs qemu (binfmt)
[tasks."cli:image:push"]
description = "Build the image of the tools for amd64 and arm64 and push it to ghcr.io"
dir = "{{config_root}}"
run = """
docker buildx build --platform linux/amd64,linux/arm64 --file Dockerfile \
  --tag {{vars.image}}:latest --tag {{vars.image}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.image}}:buildcache \
  --cache-to type=registry,ref={{vars.image}}:buildcache,mode=max,image-manifest=true \
  --push ..
"""

[tasks."cli:canary:build"]
description = "Build the canary proving a container runtime works, sak-cli-docker-canary"
dir = "{{config_root}}/canary"
run = """
docker buildx build --load --tag {{vars.canary}}:latest \
  --cache-from type=registry,ref={{vars.canary}}:buildcache .
"""

[tasks."cli:canary:test"]
description = "Check that the canary answers"
depends = ["cli:canary:build"]
run = """
[ "$(docker run --rm {{vars.canary}}:latest)" = "sak-cli-docker-canary" ]
echo "the canary works"
"""

[tasks."cli:canary:push"]
description = "Build the canary for amd64 and arm64 and push it to ghcr.io"
dir = "{{config_root}}/canary"
run = """
docker buildx build --platform linux/amd64,linux/arm64 \
  --tag {{vars.canary}}:latest --tag {{vars.canary}}:$(git rev-parse --short=12 HEAD) \
  --cache-from type=registry,ref={{vars.canary}}:buildcache \
  --cache-to type=registry,ref={{vars.canary}}:buildcache,mode=max,image-manifest=true \
  --push .
"""

# REGISTRY_USERNAME and REGISTRY_PASSWORD: a github user and a token of it with write:packages,
# in the workflow github.actor and its GITHUB_TOKEN
[tasks."cli:login"]
description = "Log in to ghcr.io to pull and push the images and their cache"
run = """
if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
  echo "set REGISTRY_USERNAME and REGISTRY_PASSWORD to log in to ghcr.io" >&2
  exit 1
fi
printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
"""
