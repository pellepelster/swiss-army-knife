[package]
name = "sakctl"
version = "0.1.0"
description = "The Swiss Army Knife desktop app"
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
sha2 = "0.10.9"
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
rust-i18n = "4.2.4"
sys-locale = "0.3.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
base64 = "0.23.1"
bollard = "0.21.1"
futures-util = "0.3"
sak-cloud = { path = "../cloud" }
argon2 = "0.5.3"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-opener = "2.7.2"
url = "2.5.8"
# the endpoint the ansible callback posts its events to, on the loopback for one run
tiny_http = "0.12.0"
# the password typed on the terminal without echo, never an argument
rpassword = "7.4.0"
# the values of a deployment, each from one master key of the password (core/keys.rs)
hkdf = "0.12.4"
sha2 = "0.10.9"
# the password as nfc, the same bytes however it was typed
unicode-normalization = "0.1.26"
# a password guessed easily is refused
zxcvbn = "3.1.1"
hmac = "0.12.1"
age = "0.12.1"
bech32 = "0.11"
semver = "1.0.28"
self-replace = "1.5.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
async-trait = "0.1.89"
# the copies of the password and of the keys are wiped when they go, not left in freed memory
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
# whether a process lives, without a process of its own (`provision::alive`)
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

# the master key takes 256 MiB of argon2id, unoptimized the tests would wait minutes for it
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
