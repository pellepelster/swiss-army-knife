# the controller of the end-to-end tests, see playwright.config.ts
ktor:
  deployment:
    port: 18080
sak:
  data_dir: $SAK_E2E_DATA_DIR
  root_domain: example.org
  # nothing listens here, the controller keeps retrying to configure caddy in the background
  caddy_admin_url: http://localhost:12019
  s3:
    # served at their domains, so they are sites; only the statistics test writes their requests
    buckets:
      e2e-stats:
        domains:
          - stats.example.org
      e2e-other:
        domains:
          - other.example.org
  auth:
    console_url: http://localhost:18080
    # one address per spec, each gets at most five login links an hour from one client
    admins:
      - admin@example.org
      - live@example.org
      - logs@example.org
      - api@example.org
      - buckets@example.org
    smtp:
      host: localhost
      port: 11025
      from: login@example.org
      starttls: false
  logs:
    victorialogs_url: http://127.0.0.1:19428
