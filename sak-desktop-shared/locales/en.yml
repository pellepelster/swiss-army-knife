# the texts of sak-desktop-shared in en, generated from i18n/texts.yml by sak-i18n (mise run i18n:generate), do not edit
common:
  checks:
    not_finished: "A check did not finish: %{error}"
    splash_not_updated: "The splash screen could not be updated: %{error}"
  update:
    checking: "Asking %{receiver} for the newest release of %{app}…"
    no_release: "This %{app} (%{version}) is no release, there is no version to compare it with."
    up_to_date: "%{app} %{version} is up-to-date."
    newer: "%{app} %{newest} is available, this is %{current}."
    installing: "Downloading %{app} %{version} from %{receiver}…"
    installed: "%{app} is updated from %{current} to %{newest}. Start %{app} again to use it."
    unreachable: "%{url} could not be reached: %{error}"
    failed: "%{url} answered %{status}."
    not_https: "%{url} is no https address, %{app} asks github over https only."
    not_github: "%{url} is no address of github, %{app} downloads from github only."
    unreadable: "The newest release on %{receiver} could not be read: %{error}"
    no_asset: "The release %{version} has no %{name}."
    checksum_mismatch: "The sha-256 of %{name} is not the one of its checksum, nothing was changed."
    signature_invalid: "%{name} is not signed by the release workflow of %{version}, nothing was changed: %{error}"
    no_binary: "%{name} has no %{binary}, nothing was changed."
    not_replaced: "%{app} at %{path} could not be replaced: %{error}"
cli:
  refused: "The SAK instance refused it (%{status})."
  failed: "It failed: %{error}"
  update:
    hint: "Run %{app} update to install it."
ui:
  update:
    version: "%{app} %{version}"
    check: "Check for updates"
    idle: "Asks %{receiver} for the newest release of %{app}."
    install: "Update to %{version}"
    restart: "Restart"
    restart_hint: "Restart to use %{app} %{version}."
  login:
    address: "SAK address"
    address_hint: "The address of your SAK instance, e.g. sak.example.org"
    sign_in: "Sign in"
    waiting: "Sign in in the browser and confirm the connection there."
    code: "Confirm only when the browser shows this code: %{code}"
    cancel: "Cancel"
    browser:
      signed_in_title: "Signed in"
      signed_in: "%{app} is signed in. You can close this tab."
      cancelled_title: "Sign-in cancelled"
      cancelled: "%{app} is not signed in. You can close this tab."
      interfered_title: "Sign-in stopped"
      interfered: "This sign-in of %{app} was opened a second time, by the browser or by another program. It was stopped for safety. Sign in again in %{app}."
    error:
      invalid_address: "An address like sak.example.org is needed."
      no_instance: "No SAK instance answers at this address."
      listener: "The app can not wait for the browser: %{error}"
      browser: "The browser did not open: %{error}"
      cancelled: "The sign-in was cancelled."
      timed_out: "The browser did not come back in time. Sign in again."
      refused: "The SAK instance refused the sign-in. Sign in again."
      interfered: "The sign-in was opened a second time, by the browser or by another program. It was stopped for safety. Sign in again."
      other_user: "The browser did not reach the app: only programs of other users of this computer asked, e.g. a proxy. Open the browser as the user of this app and sign in again."
      failed: "The SAK instance did not answer as expected: %{error}"
    restore:
      expired: "The session expired. Sign in again."
      unreachable: "The SAK instance did not answer. Sign in again, or try later."
      changed: "The SAK address names another API than at your last sign-in. Sign in again."
