[package]
name = "sak-desktop-shared"
version = "0.1.0"
description = "What the desktop apps of SAK share: the sign-in through the browser, the texts, the desktop entry, the update"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# the commands of the sign-in in the window (window.rs), with the browser it opens
tauri = { version = "2.12.6", features = [] }
tauri-plugin-opener = "2.7.2"
# the texts of locales/, generated from `desktop_shared` of i18n/texts.yml; the locale is the one the
# app sets, rust_i18n has one for all crates
rust-i18n = "4.2.4"
# the session tokens in the keychain of the system (secrets.rs): Secret Service, Keychain, Credential Manager
keyring = "4.2.0"
# the language of the system (i18n::init_locale)
sys-locale = "0.3.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the one request of the browser on the loopback that hands over the connect token
tiny_http = "0.12.0"
getrandom = "0.4.3"
base64 = "0.23.1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
# the session token wiped when it goes, the state and the secret of a sign-in compared in constant
# time (SEC-36); both are in the lockfiles of the apps already
zeroize = "1.8"
subtle = "2.6"
url = "2.5.8"
# the update of an app (update.rs): the versions of the releases, the zip of a release, the app
# replaced by the binary of the zip
semver = "1.0.28"
self-replace = "1.5.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# the cosign signature of an update and of an image (sigstore.rs), offline against the trusted root
# of sigstore
sigstore-verify = { version = "0.16.0", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
